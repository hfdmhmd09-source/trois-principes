معون الأطراف كلها والنصوص كلها ويشحذونها وينظرون فيها ثم يخرجون منها بنتيجة؛ هذه النتيجة تكون صحيحة سليمة؛ لماذا؟ لأنها نتيجة نظر في الأطراف كلها. ولذلك ضل الجبرية لأنهم أخذوا بطرف فقط والقدرية أخذوا بالطرف الآخر؛ أهل السنة في باب القدر وفي غيره صار قولهم هم الحق لأنهم أخذوا بأطراف الأدلة كلها. هذه خصيصة واضحة؛ فأهل السنة والجماعة لا يتركون شيئاً مما يحتاج إلى دراسته في مسألة عقدية؛ ولذلك صار مذهبهم هو الحق الذي لا أحقَّ منه."], "fr": ["Les gens de la Sunna et de la communauté prennent toutes les extrémités des preuves dans une même question. Ils prennent toutes les extrémités des preuves dans une question unique. C&#x27;est une caractéristique propre aux gens de la Sunna et de la communauté, claire comme le soleil en plein jour pour qui médite et réfléchit à leur doctrine. C&#x27;est pourquoi les assimilateurs (al-mumaththila) se sont égarés dans le chapitre des Noms et des Attributs : ils n&#x27;ont pris que les preuves de l&#x27;affirmation, et laissé les preuves de la transcendance ; et c&#x27;est l&#x27;inverse pour les négateurs (al-mu&#x27;attila), qui se sont égarés dans le chapitre des Noms et des Attributs parce qu&#x27;ils n&#x27;ont pris que les preuves de la transcendance et laissé les preuves de l&#x27;affirmation des attributs. La cause de l&#x27;égarement des deux sectes est donc d&#x27;avoir pris une seule extrémité des preuves dans la question. Vous me suivez ?", "Si donc tu étudies une question et que tu veux le chemin de la vérité et de la guidée, rassemble tous les textes légaux relatifs à cette question, afin d&#x27;en tirer une représentation claire et juste. Quant aux gens de la Sunna, dans une même question, ils ne regardent pas une preuve, ni deux, ni une extrémité ou un côté : ils rassemblent toutes les extrémités et tous les textes, les aiguisent et les examinent, puis en tirent un résultat. Ce résultat est juste et sain. Pourquoi ? Parce qu&#x27;il est le résultat d&#x27;un examen de toutes les extrémités.", "C&#x27;est pourquoi les Jabrites se sont égarés, parce qu&#x27;ils n&#x27;ont pris qu&#x27;une extrémité, et les Qadarites ont pris l&#x27;autre extrémité ; les gens de la Sunna, dans le chapitre du destin et ailleurs, ont vu leur parole devenir la vérité, parce qu&#x27;ils ont pris toutes les extrémités des preuves. C&#x27;est une caractéristique claire : les gens de la Sunna et de la communauté ne laissent rien de ce qui doit être étudié dans une question de croyance. C&#x27;est pourquoi leur doctrine est la vérité, et il n&#x27;y a pas de vérité plus vraie."]}, {"id": "r6", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 6: مذهبهم أعلم وأسلم وأحكم", "tf": "Règle 6 : Leur doctrine est la plus savante, la plus sûre, la plus sage", "ar": ["قاعدة: مذهب أهل السنة أعلم وأسلم وأحكم. مذهب أهل السنة أسلم وأعلم وأحكم. فهو أسلم لأن النبي صلى الله عليه وسلم شهد لمن كان مقتفياً له متبعاً لأثره مقتدياً به أنه من أهل النجاة، والسلامة لا تكون إلا في سلوك طريق النجاة. وأعلم لأنه مذهب مبني على ماذا؟ على الكتاب والسنة، فهما الحق الذي لا أحق منهما، وما بُني على الحق فهو حق. وأحكم لأنه رباني المصدر، من عند الحكيم عز وجل؛ ترى سلسلة مذهبنا، مذهب أهل السنة والجماعة، سلسلته: نحن عن التابعين، عن أتباع، عن الصحابة، عن النبي صلى الله عليه وسلم، عن جبريل، عن من؟ عن الله عز وجل؛ ترى عقيدتنا ربانية المصدر؛ فكيف تكون ربانية المصدر ولا تكون هي ذات حكمة؟ فالذي وضع هذه العقيدة وشرعها وأمر بها إنما هو الحكيم اسماً وذو الحكمة صفة. إذن مذهب أهل السنة والجماعة أحكم وأعلم وأسلم."], "fr": ["La doctrine des gens de la Sunna est la plus savante, la plus sûre et la plus sage. Elle est la plus sûre, parce que le Prophète (que Dieu le bénisse et le salue) a témoigné que celui qui le suit, marche sur sa trace et l&#x27;imite est des gens du salut ; et la sûreté ne se trouve que dans le fait de suivre le chemin du salut. Elle est la plus savante, parce qu&#x27;elle est une doctrine bâtie sur quoi ? Sur le Livre et la Sunna, qui sont la vérité, et il n&#x27;y a pas de vérité plus vraie ; et ce qui est bâti sur la vérité est vérité. Elle est la plus sage, parce qu&#x27;elle est d&#x27;origine divine, issue du Sage, le Puissant et Majestueux. Vois la chaîne de notre doctrine, la doctrine des gens de la Sunna et de la communauté : notre chaîne vient des successeurs, des suiveurs des successeurs, des compagnons, du Prophète (que Dieu le bénisse et le salue), de Gabriel, de qui ? De Dieu, le Puissant et Majestueux. Notre croyance est divine par son origine. Comment pourrait-elle être divine par son origine sans être sage ? Celui qui a posé cette croyance, l&#x27;a légiférée et l&#x27;a ordonnée est le Sage de par Son nom et le Possesseur de la sagesse par Son attribut. La doctrine des gens de la Sunna et de la communauté est donc la plus sage, la plus savante et la plus sûre."]}, {"id": "r7", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 7: لا يتعارض نقل صحيح مع عقل صريح", "tf": "Règle 7 : Aucune transmission authentique ne contredit une raison claire", "ar": ["قاعدة: أهل السنة يعتقدون الاعتقاد الصريح أنه لا يتعارض نقل صحيح مع عقل صريح. أهل السنة والجماعة يعتقدون الاعتقاد الصريح أنه لا يتعارض نقل صحيح مع عقل صريح؛ لأن الذي أنزل النص هو الذي خلق العقل، وهو أحسن حديثاً وأقوم قيلاً من خلقه عز وجل، ومن أصدق من الله قيلاً؛ فإذن الله يعلم ما يتعارض مع العقول فلا ينزله كنص. فإذا رأيت أن إنساناً يدعي وجود تعارض بين نص صحيح مع عقل صريح فاعرف أنه من أهل البدع ليس من أهل السنة؛ ولذلك لا نعلم كلمة واحدة في إثبات تعارض بين نقل وعقل في كلام أهل السنة أبداً، بل جميع من يدعي وجود التعارض بين النقول والعقول إنما هم أهل البدع. وأما نحن معاشر أهل السنة فلا، حتى وإن شغبوا علينا بجمل من النصوص كتاباً وسنة وقالوا وزعموا زوراً وبهتاناً أنها معارضة للعقل، فلها إجاباتها عند أهل السنة والجماعة: إما أن يكون النص غير صحيح أصلاً، وإما إذا كان النص صحيحاً فإننا نرجع إلى النظر في العقل الذي نظر في النص، فقد يكون في العقل [كلمة غير واضحة في التفريغ] عليه نظره وتفكيره؛ ولكن إذا اجتمعت صحة النص وسلامة العقل فأقسم بالله العلي العظيم أنه لا تعارض بينهما أبداً. ولذلك ألّف الإمام ابن تيمية كتابه الكبير المفيد العظيم المستصعب «موافقة صريح المعقول لصحيح المنقول»، يثبت فيها مسألة واحدة بتسعة مجلدات، يثبت فيها مسألة واحدة: أنه ما يمكن أبداً أن يتعارض هذا مع هذا."], "fr": ["Les gens de la Sunna croient, d&#x27;une croyance nette, qu&#x27;aucune transmission authentique ne contredit une raison claire. Les gens de la Sunna et de la communauté croient, d&#x27;une croyance nette, qu&#x27;une transmission authentique ne contredit pas une raison claire, car Celui qui a fait descendre le texte est Celui qui a créé la raison, et Il est le plus beau en parole et le plus droit en discours parmi Ses créatures, Puissant et Majestueux : « Et qui est plus véridique que Dieu en parole ? » Dieu sait donc ce qui contredit les raisons et ne le fait pas descendre comme texte. Si tu vois qu&#x27;un homme prétend qu&#x27;il existe une contradiction entre un texte authentique et une raison claire, sache qu&#x27;il est des gens d&#x27;innovation, non des gens de la Sunna. C&#x27;est pourquoi nous ne connaissons aucune parole des gens de la Sunna qui établisse une contradiction entre la transmission et la raison : bien plus, tous ceux qui prétendent une contradiction entre les transmissions et les raisons sont des gens d&#x27;innovation.", "Quant à nous, assemblée des gens de la Sunna, non : même s&#x27;ils nous cherchent noise avec un ensemble de textes du Livre et de la Sunna, et prétendent, par mensonge et calomnie, qu&#x27;ils s&#x27;opposent à la raison, les gens de la Sunna et de la communauté ont des réponses. Ou bien le texte n&#x27;est pas authentique du tout ; ou bien, si le texte est authentique, nous revenons à l&#x27;examen de la raison qui a examiné le texte : il se peut qu&#x27;il y ait dans la raison un défaut dans son examen et sa réflexion [passage corrompu dans la transcription]. Mais si l&#x27;authenticité du texte et la santé de la raison sont réunies, je jure par Dieu, l&#x27;Élevé, le Grand, qu&#x27;il n&#x27;y a jamais de contradiction entre elles. C&#x27;est pourquoi l&#x27;imam Ibn Taymiyya a composé son grand livre, utile, immense et ardu : « La concordance de la raison claire avec la transmission authentique », dans lequel il établit, en neuf volumes, une seule question : qu&#x27;il est absolument impossible que l&#x27;une contredise l&#x27;autre."]}, {"id": "r8", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 8: العدل مع المؤالف والمخالف", "tf": "Règle 8 : La justice envers l'allié et l'opposant", "ar": ["قاعدة: أهل السنة يعتمدون وجوب العدل مع المؤالف والمخالف. أهل السنة والجماعة يعتمدون وجوب العدل مع المؤالف والمخالف، كما قال الله عز وجل: ﴿وإذا قلتم فاعدلوا ولو كان ذا قربى﴾؛ هذا وجوب العدل مع المؤالف. وأما المخالف فقال الله عز وجل فيه: ﴿ولا يجرمنكم شنآن قوم على ألا تعدلوا اعدلوا هو أقرب للتقوى﴾. فإذن أهل السنة لا يداهنون في الحق قريباً، ولا يردّون الحق ولو جاءهم من رجل بعيد عنهم؛ فإذن ولاؤهم كله وحبهم وبغضهم لا شأن له بقرابات نسبية، ولا ولاءات عنصرية، ولا حدود جغرافية، وإنما ولاؤهم للحق. فهم يقولون الحق حتى وإن كان على القريب المؤالف، ويقولون الحق حتى وإن كان سيستفيد منه، إيش يا جماعة؟ العدو المخالف؛ فهم يعتمدون العدل مع الجميع، بينما جميع الطوائف ما تعتمد العدل، وإنما عدلها مبني على شهواتها؛ ولذلك هم يكفّرون أهل السنة والجماعة، أغلب الطوائف تكفّر أهل السنة والجماعة والسلف الصالح، ولا لا؟ لكن شوف كيف عدل أهل السنة: لا يقابلون التكفير بالتكفير من باب الانتقام وجزاء سيئة سيئة مثلها، لا، بل هم يقولون: الحق مع المخالف والمؤالف."], "fr": ["Les gens de la Sunna prescrivent la justice envers l&#x27;allié et l&#x27;opposant. Les gens de la Sunna et de la communauté prescrivent l&#x27;obligation de la justice envers l&#x27;allié (al-mu&#x27;allif) et l&#x27;opposant, comme Dieu, le Puissant et Majestueux, dit : « Et lorsque vous parlez, soyez justes, fût-ce envers un proche. » Voilà l&#x27;obligation de justice envers l&#x27;allié. Quant à l&#x27;opposant, Dieu dit à son sujet : « Et que la haine d&#x27;un peuple ne vous incite pas à ne pas être justes. Soyez justes, c&#x27;est plus proche de la piété. » Les gens de la Sunna ne flattent donc pas dans la vérité un proche, et ne rejettent pas la vérité même si elle vient d&#x27;un homme éloigné d&#x27;eux. Toute leur loyauté, leur amour, leur haine n&#x27;ont rien à voir avec des parentés de sang, ni des allégeances racistes, ni des frontières géographiques : leur loyauté va à la vérité. Ils disent la vérité même si elle est contre le proche allié, et ils disent la vérité même si en profitera, qui donc, mes frères ? L&#x27;ennemi opposant. Ils s&#x27;appuient donc sur la justice envers tous, tandis que les autres sectes ne s&#x27;appuient pas sur la justice : leur justice est bâtie sur leurs passions. C&#x27;est pourquoi la plupart des sectes déclarent mécréants les gens de la Sunna et de la communauté et les pieux prédécesseurs, n&#x27;est-ce pas ? Mais voyez la justice des gens de la Sunna : ils ne répondent pas à la déclaration de mécréance par la déclaration de mécréance par vengeance, « la rétribution d&#x27;un mal est un mal semblable » : non, ils disent : la vérité est avec l&#x27;opposant et avec l&#x27;allié."]}, {"id": "r9", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 9: ليس لهم إمام معظَّم إلا النبي ﷺ", "tf": "Règle 9 : Pas d'imam vénéré sauf le Prophète", "ar": ["ومن قواعدهم وأصولهم: أهل السنة ليس لهم إمام معظَّم يأخذون كلامه ويدعون ما خالفه إلا النبي صلى الله عليه وسلم. أهل السنة والجماعة ليس لهم إمام معظم يأخذون كلامه ويدعون ما خالفه إلا النبي صلى الله عليه وسلم؛ لأن كلاً يؤخذ من قوله ويترك إلا قول الشارع صلى الله عليه وسلم. وهذه الخصيصة إنما هي في حق أهل السنة والجماعة فقط، وإلا فكل أمة، فكل طائفة من الطوائف إنما تأخذ بأقوال أسيادها ومؤسسي فرقتها وتعتمد أصولهم ولا تنظر هل وافقت الكتاب والسنة أو خالفت؛ بل لو أن نصاً خالف قاعدة مما ورثوه ممن يعظمونه فإنهم يسومون هذا النص سوم العذاب: قتلاً وطعناً وسفكاً وتأويلاً وتحريفاً وجحوداً وإنكاراً حتى تسلم لهم قاعدة إمامهم الذي يعظمونه. أهل السنة ما يعرفون هذا ولا فيهم شيء من هذا؛ جميع الناس يؤخذ من قولهم ويترك؛ ولذلك نحن أخذنا من قول أبي بكر وتركنا، وأخذنا من قول عمر وتركنا، وأخذنا من قول عثمان وعلي وتركنا، أليس كذلك؟ بل نحن مجمعون على أن قول الصحابي إذا خالف قول رسول الله فإن قول الصحابي مردود عليه. لا يجوز أن نقدم بين يدي الله ورسوله لا قولاً ولا عقلاً ولا مذهباً ولا رأياً ولا استحساناً ولا غير ذلك من الأمور، إنما عمدتنا ما صح عن رسول الله صلى الله عليه وعلى آله وصحبه وسلم. فإذن لا يجوز أن نعظّم إماماً من الأئمة فنجعله هو مصدر الولاء ومصدر البراء ومصدر الأخذ ومصدر العطاء: من أحبه أحببناه ومن انتسب له فهو حبيبنا ومن عاداه عاديناه، وكل ما يقوله فهو الحق الذي لا أحق منه، وكل قول عارض قول إمامنا فهو الباطل الذي لا أبطل منه. هذا هو سبب الفُرقة في هذه الأمة، وهو تعظيم الأشخاص وتقديس الأشخاص الذين ليسوا هم بمعصومين. أهل السنة مذهبهم بريء من هذا كله، لا يعظمون إلا شخصاً واحداً وهو المعصوم صلى الله عليه وسلم؛ وأما بقية أقوال العلماء والحكماء مهما بلغوا في العلم والحكمة فإنها موقوفة على موافقة الحق، موافقة قول رسول الله صلى الله عليه وسلم. أنتم فهمتموني ولا لا؟"], "fr": ["Parmi leurs règles et leurs fondements : les gens de la Sunna n&#x27;ont pas d&#x27;imam vénéré dont ils prendraient la parole et laisseraient ce qui lui est contraire, sauf le Prophète (que Dieu le bénisse et le salue). Les gens de la Sunna et de la communauté n&#x27;ont pas d&#x27;imam vénéré dont ils prennent la parole et dont ils laissent ce qui la contredit, hormis le Prophète (que Dieu le bénisse et le salue), car de chacun on prend et on laisse la parole, sauf la parole du Législateur (que Dieu le bénisse et le salue). Cette caractéristique est propre aux gens de la Sunna et de la communauté seuls ; sinon toute communauté, toute secte, ne prend que les paroles de ses maîtres et des fondateurs de sa secte, et s&#x27;appuie sur leurs principes sans regarder si elles concordent avec le Livre et la Sunna ou s&#x27;y opposent. Bien plus : si un texte contredit une règle héritée de celui qu&#x27;ils vénèrent, ils soumettent ce texte à la torture : meurtre, coups, effusion de sang, interprétation, déformation, reniement et négation, jusqu&#x27;à ce que la règle de l&#x27;imam qu&#x27;ils vénèrent soit sauve pour eux.", "Les gens de la Sunna ne connaissent pas cela, et il n&#x27;y a rien de cela chez eux : de tous les gens, on prend la parole et on la laisse. C&#x27;est pourquoi nous avons pris de la parole d&#x27;Abû Bakr et laissé ; nous avons pris de la parole de &#x27;Omar et laissé ; nous avons pris de la parole de &#x27;Othmân et de &#x27;Alî et laissé, n&#x27;est-ce pas ? Bien plus, nous sommes unanimes que la parole du compagnon, si elle contredit la parole du Messager de Dieu, est rejetée. Il ne nous est pas permis de « devancer Dieu et Son Messager » ni par une parole, ni par une raison, ni par une doctrine, ni par une opinion, ni par un jugement de convenance, ni par quoi que ce soit d&#x27;autre : notre pilier est ce qui est authentique du Messager de Dieu, que Dieu le bénisse, lui, sa famille et ses compagnons, et le salue.", "Il ne nous est donc pas permis de vénérer un imam parmi les imams en en faisant la source de la loyauté et de la désaffection, la source du prendre et du donner : « celui qui l&#x27;aime, nous l&#x27;aimons ; celui qui s&#x27;y rattache est notre ami ; celui qui lui est hostile, nous lui sommes hostiles ; tout ce qu&#x27;il dit est la vérité, il n&#x27;y a pas de vérité plus vraie, et toute parole qui s&#x27;oppose à celle de notre imam est le faux, il n&#x27;y a pas de faux plus faux ». C&#x27;est la cause de la division dans cette communauté : la vénération des personnes et leur sanctification, alors qu&#x27;elles ne sont pas infaillibles. La doctrine des gens de la Sunna est innocente de tout cela : ils ne vénèrent qu&#x27;une seule personne, l&#x27;infaillible (que Dieu le bénisse et le salue). Quant au reste des paroles des savants et des sages, quelque degré de science et de sagesse qu&#x27;ils aient atteint, elles dépendent de leur accord avec la vérité, l&#x27;accord avec la parole du Messager de Dieu (que Dieu le bénisse et le salue). Vous m&#x27;avez compris, n&#x27;est-ce pas ?"]}, {"id": "r10", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 10: الحرص على الجماعة والائتلاف", "tf": "Règle 10 : L'attachement à la communauté et à l'union", "ar": ["ومن القواعد: أهل السنة يحرصون على الجماعة والائتلاف ويحذّرون ويدعون إلى نبذ أسباب الفرقة والاختلاف. وهذا لأن الله عز وجل يقول: ﴿واعتصموا بحبل الله جميعاً ولا تفرقوا﴾، ويقول الله عز وجل: ﴿ولا تكونوا من المشركين من الذين فرقوا دينهم وكانوا شيعاً﴾، ويقول النبي صلى الله عليه وسلم: «وستفترق أمتي»، الحديث. فإذن الدين مبني على ماذا؟ على الوحدة: اتحاد الكلمة واتحاد الصف واتحاد القوة، وعلى الائتلاف وعلى نبذ جميع أسباب الفرقة والاختلاف. لو نظرت إلى سائر الفرق، أقسم بالله ثم أقسم بالله ثم أقسم بالله أنك تجد أنها أحرص على التفريق منها على الاجتماع؛ كل الفرق، كل الفرق دائماً تحرص على التفريق أكثر من حرصها على الاجتماع إلا أهل السنة والجماعة، فإنهم دائماً يحرصون على وحدة الكلمة واتحاد القوة، ممتثلين في ذلك قول النبي عليه الصلاة والسلام: «المؤمن للمؤمن كالبنيان يشد بعضه بعضاً» وشبّك بين أصابعه، ويقول النبي صلى الله عليه وسلم: «المسلم أخو المسلم». فنحن لا بد أن نحقق مبدأ البنيان الواحد والجسد الواحد إذا اشتكى منه عضو تداعى له سائر الجسد بالسهر والحمى. قلّب طرفك في فرق الدنيا الآن تجد أن أكثرهم يحرصون على التفريق، وما فعل بعض الجماعات في بعض الدول عنا ببعيد؛ فهم لا يحرصون على اتحاد الكلمة ولا على وحدة الصف ولا على لمّ الشمل ولا على قطع دابر أسباب الخلاف، بل هم نار أو بنزين يزاد على نار، وحطب يلقى في جوف نار مضطرمة. أهل السنة لا؛ ولذلك أهل السنة هم الفرقة الوحيدة الذين يدعون إلى وجوب طاعة الحاكم، طبعاً في غير معصية الله، تحقيقاً للوحدة والائتلاف ونبذاً لأسباب الفرقة والاختلاف. ولذلك قال الإمام الطحاوي رحمه الله: «ونتبع السنة والجماعة، ونجتنب الشذوذ والخلاف والفرقة»."], "fr": ["Les gens de la Sunna sont attachés à la communauté et à l&#x27;union, mettent en garde contre les causes de la division et de la divergence et appellent à les rejeter. Cela parce que Dieu, le Puissant et Majestueux, dit : « Et cramponnez-vous tous ensemble à la corde de Dieu, et ne vous divisez pas. » Et Dieu dit : « Et ne soyez pas parmi les associateurs, parmi ceux qui ont fractionné leur religion et sont devenus des sectes. » Et le Prophète (que Dieu le bénisse et le salue) dit : « Ma communauté se divisera… », le hadith. La religion est donc bâtie sur quoi ? Sur l&#x27;unité : l&#x27;union de la parole, l&#x27;union des rangs, l&#x27;union de la force, sur l&#x27;entente et sur le rejet de toutes les causes de division et de divergence.", "Si tu regardes les autres sectes, je jure par Dieu, puis je jure par Dieu, puis je jure par Dieu que tu les trouveras plus soucieuses de diviser que de rassembler. Toutes les sectes, toutes, sont toujours plus soucieuses de diviser que de rassembler, sauf les gens de la Sunna et de la communauté, qui sont toujours soucieux de l&#x27;unité de la parole et de l&#x27;union de la force, mettant en pratique la parole du Prophète (que Dieu le bénisse et le salue) : « Le croyant pour le croyant est comme un édifice dont les parties se soutiennent les unes les autres » — et il entrelaça ses doigts —, et sa parole : « Le musulman est le frère du musulman. » Nous devons donc réaliser le principe de l&#x27;édifice unique et du corps unique : lorsqu&#x27;un membre souffre, le reste du corps répond par la veille et la fièvre. Tourne ton regard parmi les sectes du monde maintenant : tu trouveras que la plupart sont soucieuses de diviser. Et ce qu&#x27;ont fait certains groupes dans certains pays n&#x27;est pas loin de nous : ils ne se soucient ni de l&#x27;union de la parole, ni de l&#x27;unité des rangs, ni de la réunion des cœurs, ni de couper les causes de la divergence : ils sont feu ou essence jeté sur un feu, bois jeté dans un feu ardent.", "Les gens de la Sunna, non. C&#x27;est pourquoi les gens de la Sunna sont la seule secte qui appelle à l&#x27;obligation d&#x27;obéir au gouvernant, bien sûr dans ce qui n&#x27;est pas désobéissance à Dieu, par réalisation de l&#x27;union et de l&#x27;entente et rejet des causes de division et de divergence. C&#x27;est pourquoi l&#x27;imam at-Tahâwî, que Dieu lui fasse miséricorde, a dit : « Nous suivons la Sunna et la communauté, et nous évitons la déviance, la divergence et la division. »"]}, {"id": "r11", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 11: لا يخوضون بعقولهم المجردة في الغيبيات", "tf": "Règle 11 : Ils ne plongent pas dans l'invisible avec leurs raisons nues", "ar": ["ومن قواعدهم وأصولهم: أهل السنة لا يتخوضون بعقولهم المجردة في الأبواب الغيبية. معي يا محمد ولا رايح؟ أهل السنة والجماعة لا يتخوضون بعقولهم المجردة في أبواب الغيبيات مطلقاً، بل عقولهم في باب الغيب تابعة للنقل، تقف عند حدود النقل، تمشي إذا قال لها النقل: امشِ، وتقف إذا قال لها النقل: قف. فعقول أهل السنة في باب الغيبيات لا تتجاوز النقل أبداً؛ لأن باب الغيب لا مدخل للعقول ولا للأقيسة ولا للآراء ولا لأقوال الرجال فيه، وإنما نثبت في باب الغيب ما أثبته النص وننفي ما نفاه النص، وما لم يأتِ النص لا بإثباته ولا بنفيه فإنه لا حق لأحد أن يثبته أو ينفيه بلا برهان ولا حجة. أما سائر الطوائف فإن من أسباب ضلالها إقحام ماذا؟ إقحام عقولها الضعيفة في استكشاف ما وراء الغيب، فحينئذ ضلوا وخابوا وخسروا."], "fr": ["Les gens de la Sunna ne plongent pas, avec leurs raisons nues, dans les chapitres de l&#x27;invisible. Vous êtes avec moi, Muhammad, ou vous partez ailleurs ? Les gens de la Sunna et de la communauté ne plongent absolument pas dans les chapitres de l&#x27;invisible avec leurs raisons nues : bien plus, leur raison, dans le chapitre de l&#x27;invisible, suit la transmission : elle s&#x27;arrête aux limites de la transmission, elle marche quand la transmission lui dit « marche », elle s&#x27;arrête quand la transmission lui dit « arrête-toi ». La raison des gens de la Sunna, dans le chapitre des affaires invisibles, ne dépasse jamais la transmission, car le chapitre de l&#x27;invisible n&#x27;a pas d&#x27;entrée pour les raisons, les analogies, les opinions ni les paroles des hommes : nous y affirmons ce que le texte a affirmé, nous y nions ce que le texte a nié, et ce sur quoi le texte n&#x27;est venu ni par affirmation ni par négation, personne n&#x27;a le droit de l&#x27;affirmer ou de le nier sans preuve ni argument.", "Quant aux autres sectes, l&#x27;une des causes de leur égarement est d&#x27;avoir lancé quoi ? Leurs raisons faibles dans l&#x27;exploration de ce qui est au-delà de l&#x27;invisible : alors elles se sont égarées, ont déçu et perdu."]}, {"id": "r12", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 12: الثبات على الحق", "tf": "Règle 12 : La fermeté sur la vérité", "ar": ["ومن الأصول أيضاً: أهل السنة ثابتون على الحق لا تغيرهم السنون ولا تعصف بهم الأهواء والفتن. أهل السنة والجماعة ثابتون، لا تغيرهم السنون ــ أو السنين، لغتان جائزتان ــ ولا تعصف بهم الأهواء والفتن. ولذلك هم الفرقة الوحيدة الذين ثبتوا على معتقداتهم منذ بعث الله نبيه صلى الله عليه وسلم إلى أن ينتهي آخر أمر الطائفة المنصورة، وهم عقيدة واحدة على قلب رجل واحد وكلمة واحدة؛ بينما لو قلّبت طرفك في كثير من الفرق لوجدت أنها كانت فرقة ثم انقسمت إلى فرقتين وكل فرقة انقسمت إلى أربع وكل واحدة انقسمت إلى ست حتى صارت الفرقة الواحدة فيها مئات الفرق التي تنتسب إليها كالرافضة والمعتزلة والخوارج. هذا الانقسام دليل على ماذا؟ على ضعف الأصول التي بُنيت عليها هذه الفرق عقائدها، ودليل على أنهم ليسوا على الحق؛ لأن الحق لا يتعدد، الحق واحد. أما أهل السنة فهم فرقة واحدة لأن الحق معهم والحق ما يتعدد؛ ما ينقسم أهل السنة إلى حنبلية وشافعية، هذه مذاهب فقهية فقط، لكن في مدرسة العقيدة كلهم أهل سنة وجماعة، كلهم أهل سنة وجماعة. فهذا الثبات على طول السنين، وتباعد الأمصار، واختلاف الديار، وتقلب الأحوال، وكثرة الفتن والقلاقل والزلازل؛ ومع ذلك أهل السنة ثابتون على أصولهم، ثابتون على عقائدهم، لا يتزعزعون؛ مرت عليهم أعاصير الفتن وهم رسوا في الأرض أشد من رسوخ الجبال الرواسي فيها. هذا دليل على إيش يا جماعة؟ على أنه الحق. أما الفرق الثانية فناهيك عن شرذمتها وفرقتها حتى صار بعضهم يكفّر بعضاً وهم ينتسبون إلى فرقة واحدة."], "fr": ["Parmi les fondements encore : les gens de la Sunna sont fermes sur la vérité ; les années ne les changent pas, et les passions et les épreuves ne les emportent pas. Les gens de la Sunna et de la communauté sont fermes : les années ne les changent pas et les passions et épreuves ne les emportent pas. C&#x27;est pourquoi ils sont la seule secte qui est restée ferme sur ses croyances depuis que Dieu a envoyé Son Prophète (que Dieu le bénisse et le salue) jusqu&#x27;à ce que prenne fin le dernier de la secte secourue : une seule croyance, comme un seul cœur d&#x27;homme, une seule parole. Alors que si tu tournes ton regard parmi beaucoup de sectes, tu trouves qu&#x27;elle était une secte, puis s&#x27;est divisée en deux, chacune des deux s&#x27;est divisée en quatre, chacune en six, jusqu&#x27;à ce que la même secte compte des centaines de sectes qui s&#x27;y rattachent, comme les Rafidites, les Mu&#x27;tazilites et les Kharijites. Cette division est une preuve de la faiblesse des fondements sur lesquels ces sectes ont bâti leurs croyances, et une preuve qu&#x27;elles ne sont pas sur la vérité, car la vérité ne se multiplie pas : la vérité est une.", "Quant aux gens de la Sunna, ils sont une seule secte, car la vérité est avec eux, et la vérité ne se multiplie pas. Les gens de la Sunna ne se divisent pas en hanbalites et chaféites : ce sont seulement des écoles de jurisprudence ; mais dans l&#x27;école de la croyance, tous sont des gens de la Sunna et de la communauté. Tous sont des gens de la Sunna et de la communauté. Voilà cette fermeté à travers la longueur des années, l&#x27;éloignement des régions, la différence des pays, le changement des situations, l&#x27;abondance des épreuves, des troubles et des séismes : et malgré cela, les gens de la Sunna restent fermes sur leurs fondements, fermes sur leurs croyances, sans vaciller. Les ouragans des épreuves ont passé sur eux, et ils se sont enracinés dans la terre plus fermement que les montagnes massives. C&#x27;est une preuve de quoi, mes frères ? Qu&#x27;ils sont sur la vérité. Quant aux autres sectes, ne parlons pas de leur dispersion et de leur division, jusqu&#x27;à ce que certains en viennent à déclarer les autres mécréants alors qu&#x27;ils se rattachent à une seule secte."]}, {"id": "r13", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 13: حبهم وبغضهم خالص لله", "tf": "Règle 13 : Leur amour et leur haine sont purs pour Dieu", "ar": ["ومن أصولهم أيضاً وخصائصهم: أهل السنة والجماعة بغضهم وحبهم خالصاً لله عز وجل. أهل السنة والجماعة حبهم وبغضهم خالص لوجه الله عز وجل؛ فهم إن أحبوا يحبون لله، وإن أبغضوا يبغضون لله، وإن والَوا أو عادَوا يوالون ويعادون لله، وإن أعطوا أو منعوا فإنما يعطون ويمنعون لله عز وجل؛ لا يدخلون في هذا الباب بالشهوات والآراء والموافقات العرقية أو النظرات العصبية، كل ذلك لا حظّ له في مذهبهم. ولذلك قال الإمام الصابوني رحمه الله تعالى: «ويتحابون في الدين ويتباغضون فيه»؛ فهم يحب بعضهم بعضاً في الدين، وإذا أبغض بعضهم بعضاً فإنما يبغضه على قدر ما معه من المخالفة. فإذن ليس حبهم وبغضهم وولاؤهم وبراؤهم على مجرد شعارات زائفة أو قوميات تافهة أو عصبيات مارقة."], "fr": ["Parmi leurs fondements et leurs caractéristiques encore : l&#x27;amour et la haine des gens de la Sunna et de la communauté sont purs pour Dieu, le Puissant et Majestueux. Leur amour et leur haine sont purs, pour la face de Dieu, le Puissant et Majestueux : s&#x27;ils aiment, ils aiment pour Dieu ; s&#x27;ils haïssent, ils haïssent pour Dieu ; s&#x27;ils s&#x27;allient ou sont hostiles, ils s&#x27;allient et sont hostiles pour Dieu ; s&#x27;ils donnent ou refusent, ils donnent et refusent pour Dieu, le Puissant et Majestueux. Ils n&#x27;entrent pas dans ce chapitre par les passions, les opinions, les accords ethniques ou les regards fanatiques : tout cela n&#x27;a aucune part dans leur doctrine. C&#x27;est pourquoi l&#x27;imam as-Sâbûnî, que Dieu lui fasse miséricorde, a dit : « Ils s&#x27;aiment dans la religion et se haïssent en elle » : ils s&#x27;aiment les uns les autres dans la religion, et si certains se haïssent, ils ne haïssent qu&#x27;à la mesure de ce qu&#x27;il y a de contraire. Leur amour, leur haine, leur loyauté et leur désaffection ne reposent donc pas sur de simples slogans trompeurs, des nationalismes futiles ou des fanatismes dévoyés."]}, {"id": "r14", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 14: التسليم المطلق للنص", "tf": "Règle 14 : La soumission absolue au texte", "ar": ["طيب، ومن أصولهم وقواعدهم: أهل السنة والجماعة يسلّمون للحق المؤيَّد بالنص التسليم المطلق. فأهل السنة هم الطائفة الوحيدة الذين اختصوا بالتسليم المطلق لنصوص الوحيين، فلا يقدمون عليهما عقلاً ولا رأياً ولا مذهباً ولا قياساً ولا ذوقاً ولا مزاجاً ولا دنيا ولا عزاً ولا منصباً ولا رضا حاكم ولا استحساناً ولا وجداناً ولا رؤى أو منامات؛ إذا جاءهم النص مباشرة يطأطئون رؤوسهم ويقولون: سمعنا وأطعنا، تحقيقاً لقول الله عز وجل: ﴿إنما كان قول المؤمنين إذا دُعوا إلى الله ورسوله ليحكم بينهم أن يقولوا سمعنا وأطعنا﴾. أما الطوائف الثانية فإنهم إذا ذُكرت عندهم النصوص التي تثبت وحدانية الله اشمأزت قلوبهم، والتي تثبت صفات الله نفرت نفوسهم، والتي تثبت عدالة الصحابة لَوَوا برؤوسهم يمنة ويسرة؛ أما أهل السنة فيقولون: سمعنا وأطعنا. فإذا وجدت في قلبك معارضة فانتبه فإنك على شفا خطر، وإذا وجدت في قلبك تسليماً مطلقاً للحق والدليل فهذه من نعمة الله عليك فاشدد عليها بيديك."], "fr": ["Parmi leurs fondements et leurs règles : les gens de la Sunna et de la communauté se soumettent à la vérité, appuyée par le texte, d&#x27;une soumission absolue. Les gens de la Sunna sont la seule secte qui se soit distinguée par la soumission absolue aux textes des deux révélations : ils ne leur préfèrent ni raison, ni opinion, ni doctrine, ni analogie, ni goût, ni humeur, ni monde, ni gloire, ni poste, ni agrément d&#x27;un gouvernant, ni jugement de convenance, ni état intérieur, ni visions ou songes. Lorsque le texte leur vient directement, ils baissent la tête et disent : « Nous avons entendu et obéi », en réalisation de la parole de Dieu : « La seule parole des croyants, lorsqu&#x27;on les appelle à Dieu et à Son Messager pour qu&#x27;Il juge entre eux, est de dire : nous avons entendu et obéi. »", "Quant aux autres sectes, lorsque tu mentionnes devant elles les textes qui établissent l&#x27;unicité de Dieu, leurs cœurs se crispent ; ceux qui établissent les attributs de Dieu, leurs âmes se rebutent ; ceux qui établissent la droiture des compagnons, elles tournent la tête à droite et à gauche. Mais les gens de la Sunna disent : « Nous avons entendu et obéi. » Si donc tu trouves dans ton cœur de l&#x27;opposition, prends garde : tu es au bord d&#x27;un danger. Et si tu trouves dans ton cœur une soumission absolue à la vérité et à la preuve, c&#x27;est une grâce de Dieu sur toi : serre-la de tes mains."]}, {"id": "r15", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 15: كل أصل أصَّلوه فهو حق", "tf": "Règle 15 : Tout fondement qu'ils ont établi est vrai", "ar": ["ومن أصولهم وخصائصهم: كل أصل أصّله أهل السنة فهو الحق الذي لا أحق منه. كل أصل أصّله أهل السنة فهو الحق الذي لا أحق منه؛ لأن أهل السنة لا يستنبطون أصلاً ولا يقررون قاعدة ولا يحررون ضابطاً إلا وقبل ذلك قد بحثوا فيما يؤيده من الأدلة من الكتاب والسنة؛ فهم استدلوا قبل أن يتمذهبوا، هم استدلوا قبل أن يقولوا. وأما سائر الطوائف فإنهم تمذهبوا وقالوا وأصّلوا ثم بحثوا، إيش؟ ثم صاروا يبحثون عن الأدلة التي تتفق مع أصولهم المقررة عندهم. ولذلك تجد أصول الطوائف الأخرى منها ما هو حق مقبول ومنها ما هو مجمل ومنها ما هو باطل محض؛ أما أهل السنة فأتحداك من هنا إلى أن أموت، لأني بعد الموت ما لي تصرف، أن تأتيني بأصل أصّله أهل السنة على خلاف الحق؛ أتحداك! لكنني أستطيع أن أذكر لك الآن جملاً كثيرة من أصول الخوارج على خلاف الحق، أصول المعتزلة على خلاف الحق، أصول الجهمية على خلاف الحق، أصول القدرية والجبرية على خلاف الحق؛ فإذن جميع ما خص الله به أهل السنة أن جميع أصولهم متفقة مع الحق ومتسقة معه كل الاتساق."], "fr": ["Parmi leurs fondements et leurs caractéristiques : tout fondement que les gens de la Sunna ont établi est la vérité, il n&#x27;y a pas de vérité plus vraie. Car les gens de la Sunna ne déduisent aucun fondement, n&#x27;établissent aucune règle et ne fixent aucun critère sans avoir auparavant cherché ce qui l&#x27;appuie dans les preuves du Livre et de la Sunna : ils ont argumenté avant de se donner une doctrine, ils ont argumenté avant de parler. Quant aux autres sectes, elles se sont donné une doctrine, ont parlé et fondé, puis se sont mises à chercher les preuves qui s&#x27;accordent avec leurs fondements établis chez elles.", "C&#x27;est pourquoi tu trouves que les fondements des autres sectes sont en partie vérité acceptée, en partie ambigus, en partie faux pur. Quant aux gens de la Sunna, je te défie, d&#x27;ici jusqu&#x27;à ma mort — car après la mort je n&#x27;ai plus de pouvoir d&#x27;agir — de m&#x27;apporter un fondement que les gens de la Sunna auraient établi contre la vérité. Je te défie ! Mais je peux, moi, te citer maintenant de nombreux fondements des Kharijites contraires à la vérité, des Mu&#x27;tazilites contraires à la vérité, des Jahmites contraires à la vérité, des Qadarites et des Jabrites contraires à la vérité. C&#x27;est donc l&#x27;une des grâces de Dieu pour les gens de la Sunna que tous leurs fondements soient conformes à la vérité et en parfaite harmonie avec elle."]}, {"id": "r16", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 16: لا يقبلون الألفاظ المجملة قبل الاستفصال", "tf": "Règle 16 : Ils n'acceptent pas les expressions ambiguës sans détail", "ar": ["ومن أصولهم وقواعدهم: أهل السنة والجماعة لا يقبلون الألفاظ المجملة قبل الاستفصال. أهل السنة والجماعة لا يقبلون الألفاظ المجملة قبل الاستفصال. وأنا أجزم أن بعض الألفاظ قد تكون صعبة على بعض الإخوان، لكن بعضها إن شاء الله واضحة عنده. والمراد بالألفاظ المجملة أي الألفاظ التي تحتمل الحق والباطل. فجميع الطوائف يا إخواني، على حسب الدراسة والاستقراء، ليس هوى وشهوة، جميع الطوائف كلها تقبل اللفظ المجمل ولا تستفصل فيه، بل وتردّ نصوص الكتاب والسنة والدلالات الصحيحة بسبب تعارضها مع هذه الألفاظ المجملة؛ فهم يعتمدون ويبنون عقائدهم على الألفاظ المجملة. وأضرب لكم مثالاً واحداً: لو سألنا سائل وقال: لماذا أنكر المعتزلة جميع صفات الله الواردة في الكتاب والسنة؟ لماذا جميع المعتزلة أنكروا صفات الرب عز وجل الواردة في السنة؟ الجواب: أنكروا ذلك بسبب لفظ مجمل اعتمدوه قبل أن يفصّلوا فيه ويعرفوا وجه الحق والباطل، وهو أن من يوصف بشيء فإنه جسم، والجسمية ممتنعة على الله؛ فإذن ردّوا جميع الصفات حتى ينفوا لفظ الجسم عن الله. سبحان الله! يردون الحق الناصع الواضح من أجل مراعاة لفظ مجمل يحتمل الحق والباطل. أهل السنة ما تجد عندهم هذا؛ هم لا يقبلون الألفاظ المجملة مطلقاً لأن فيها باطلاً والباطل ما يقبل، ولا يردون الألفاظ المجملة مطلقاً لأن فيها حقاً والحق لا يرد؛ إذن ماذا يفعلون؟ يستفصلون ويفصّلون ويميزون حتى يتبين الحق فيقبل من الباطل فيرد. هذه القاعدة وين تجدها بالله؟ في أي مذهب؟ في مذهب أهل السنة والجماعة. وللعبد الضعيف رسالة اسمها «رسالة في بيان قاعدة أهل السنة والجماعة في الألفاظ المجملة»، لأن أغلب من ضل في باب الاعتقاد إنما بسبب اعتماده على ماذا؟ على ألفاظ مجملة. الأشاعرة لماذا نفوا صفة العلو عن الله؟ لماذا؟ لأن العلو جهة والجهة ممتنعة على الله. طيب، لفظ الجهة فيه حق وباطل، لماذا لا تفصّل أيها الأشعري فيه حتى تعرف الحق فتقبله من الباطل فترده؟ لا، بنى عقيدته على هذا اللفظ المجمل، فلما لم يتفق معه ردّ أدلة تربو على الألف دليل؛ علو الله ثابت بأكثر من ألف دليل يردها كلها مراعاة للفظ مجمل يحتمل الحق والباطل. ولذلك جعل الإمام ابن القيم رحمه الله الألفاظ المجملة طاغوتاً في كتابه «الصواعق المرسلة»، فكسره طاغوتاً من الطواغيت: الألفاظ المجملة."], "fr": ["Parmi leurs fondements et leurs règles : les gens de la Sunna et de la communauté n&#x27;acceptent pas les expressions ambiguës avant d&#x27;en demander le détail. Je suis certain que certaines expressions peuvent être difficiles pour certains frères, mais certaines, s&#x27;il plaît à Dieu, sont claires pour eux. Par « expressions ambiguës » (al-alfâz al-mujmala), on entend les expressions qui peuvent porter la vérité et le faux. Toutes les sectes, mes frères, d&#x27;après l&#x27;étude et l&#x27;induction, non d&#x27;après la passion, toutes acceptent l&#x27;expression ambiguë sans en demander le détail ; bien plus, elles rejettent les textes du Livre et de la Sunna et les indications correctes à cause de leur opposition avec ces expressions ambiguës : elles bâtissent leurs croyances sur les expressions ambiguës.", "Je vous donne un exemple. Si l&#x27;on nous demandait : pourquoi les Mu&#x27;tazilites ont-ils nié tous les attributs de Dieu mentionnés dans le Livre et la Sunna ? Pourquoi tous les Mu&#x27;tazilites ont-ils nié les attributs du Seigneur, le Puissant et Majestueux, mentionnés dans la Sunna ? Réponse : ils l&#x27;ont nié à cause d&#x27;une expression ambiguë qu&#x27;ils ont adoptée avant d&#x27;en demander le détail et de reconnaître la part du vrai et du faux : « Celui qui est décrit par quelque chose est un corps, et la corporéité est impossible pour Dieu. » Ils ont donc rejeté tous les attributs pour nier de Dieu le mot « corps ». Gloire à Dieu ! Ils rejettent la vérité éclatante et évidente par égard pour une expression ambiguë qui peut porter la vérité et le faux. Chez les gens de la Sunna, tu ne trouves pas cela : ils n&#x27;acceptent pas les expressions ambiguës absolument, car il y a en elles du faux, et le faux ne s&#x27;accepte pas ; et ils ne rejettent pas les expressions ambiguës absolument, car il y a en elles du vrai, et le vrai ne se rejette pas. Que font-ils donc ? Ils demandent le détail, ils détaillent et distinguent jusqu&#x27;à ce que la vérité apparaisse : on accepte alors le vrai et l&#x27;on rejette le faux. Où trouves-tu cette règle, par Dieu ? Dans quelle doctrine ? Dans la doctrine des gens de la Sunna et de la communauté. J&#x27;ai moi-même, le faible serviteur, une épître intitulée : « Épître sur l&#x27;exposé de la règle des gens de la Sunna et de la communauté concernant les expressions ambiguës », car la plupart de ceux qui se sont égarés dans le chapitre de la croyance l&#x27;ont fait pour s&#x27;être appuyés sur quoi ? Sur des expressions ambiguës.", "Pourquoi les Acharites ont-ils nié l&#x27;attribut de l&#x27;élévation (al-&#x27;ulûw) pour Dieu ? Pourquoi ? Parce que l&#x27;élévation est une direction, et la direction est impossible pour Dieu. Or l&#x27;expression « direction » contient du vrai et du faux : pourquoi ne détailles-tu pas, ô acharite, pour connaître la vérité et l&#x27;accepter, et le faux et le rejeter ? Non : il a bâti sa croyance sur cette expression ambiguë, et comme elle ne s&#x27;accordait pas avec lui, il a rejeté des preuves qui dépassent le millier : l&#x27;élévation de Dieu est établie par plus de mille preuves, et il les rejette toutes par égard pour une expression ambiguë qui peut porter la vérité et le faux. C&#x27;est pourquoi l&#x27;imam Ibn al-Qayyim, que Dieu lui fasse miséricorde, a fait des expressions ambiguës un taghout dans son livre « Les foudres lancées » (as-Sawâ&#x27;iq al-mursala) : il l&#x27;a brisé, considérant les expressions ambiguës comme l&#x27;un des taghouts."]}, {"id": "r17", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 17: يأمرون بالاتباع وينهون عن الابتداع", "tf": "Règle 17 : Ils ordonnent le suivi et interdisent l'innovation", "ar": ["ومن الأصول كذلك: أهل السنة والجماعة يأمرون بالاتباع وينهون عن الابتداع. ممتثلين في ذلك قول الله عز وجل: ﴿الذين يتبعون الرسول النبي الأمي﴾ الآية والآية بعدها، وممتثلين أيضاً قول الله عز وجل: ﴿وما آتاكم الرسول فخذوه وما نهاكم عنه فانتهوا﴾، وممتثلين قول الله عز وجل: ﴿أم لهم شركاء شرعوا لهم من الدين ما لم يأذن به الله﴾، وممتثلين قول النبي صلى الله عليه وسلم: «من أحدث في أمرنا هذا ما ليس منه فهو رد»، وقوله صلى الله عليه وسلم: «وإياكم ومحدثات الأمور فإن كل محدثة بدعة وكل بدعة ضلالة» أو كما قال صلى الله عليه وسلم. فإذا رأيت العالم يهوّن في أمر البدع فاعلم أنه على غير جادة أهل السنة والجماعة؛ لو كان من أهل السنة لشدّد تشديداً بليغاً في الإنكار على البدع وأهل البدع. ولذلك نجد تميّعاً من بعض العلماء الذين ينتسبون لأهل السنة؛ نجد منهم تميّعاً على بدع الموالد، بدع أعياد الميلاد، بدع الأذكار الجماعية، بدع الحلق الصوفية والأذكار الصوفية، نجد منهم تميّعاً ليس بمقبول في مذهب أهل السنة والجماعة. أهل السنة يأمرون بالاتباع ويغلّظون ويشددون فيه، وينهون عن الابتداع في الدين والإحداث وإحداث ما ليس منه فيه."], "fr": ["Parmi les fondements encore : les gens de la Sunna et de la communauté ordonnent le suivi et interdisent l&#x27;innovation. En mettant en pratique la parole de Dieu : « Ceux qui suivent le Messager, le Prophète illettré… », le verset et celui qui suit ; et la parole de Dieu : « Ce que le Messager vous donne, prenez-le, et ce qu&#x27;il vous interdit, abstenez-vous-en » ; et la parole de Dieu : « Ont-ils des associés qui leur ont légiféré en religion ce que Dieu n&#x27;a pas permis ? » ; et la parole du Prophète (que Dieu le bénisse et le salue) : « Quiconque introduit dans notre affaire que voici ce qui n&#x27;en fait pas partie, cela est rejeté » ; et sa parole : « Prenez garde aux choses nouvellement introduites : toute chose nouvellement introduite est une innovation, toute innovation est un égarement », ou comme il l&#x27;a dit.", "Si tu vois donc un savant minimiser l&#x27;affaire des innovations, sache qu&#x27;il n&#x27;est pas sur la voie des gens de la Sunna et de la communauté : s&#x27;il était des gens de la Sunna, il serait extrêmement sévère dans le blâme des innovations et des gens d&#x27;innovation. C&#x27;est pourquoi nous constatons une mollesse chez certains savants qui se rattachent aux gens de la Sunna, à l&#x27;égard des innovations des célébrations de la naissance du Prophète (al-mawlid), des fêtes d&#x27;anniversaire, des invocations collectives, des cercles soufis et des invocations soufies : nous trouvons chez eux de la mollesse. Cela n&#x27;est pas accepté dans la doctrine des gens de la Sunna et de la communauté. Les gens de la Sunna ordonnent le suivi et sont fermes et sévères à ce sujet, et interdisent l&#x27;innovation dans la religion, l&#x27;introduction de ce qui n&#x27;en fait pas partie."]}, {"id": "r18", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 18: الدعوة إلى الدين كله", "tf": "Règle 18 : L'appel à la religion tout entière", "ar": ["ومن قواعدهم وأصولهم: أهل السنة والجماعة يدعون إلى الدين كله من غير تفصيل ولا استثناء. فدعوتهم لله شاملة للدين كله في كل شيء؛ في العقائد وفي العبادات وفي السلوك والآداب والأخلاق وفي كل مناحي الحياة وأمورها. ويحذّر أهل السنة والجماعة دائماً من النظرة التجزيئية للدين: هذا دين للعقائد، هذا للشرائع، هذا لعلماء العقيدة؛ لا، أهل السنة والجماعة تجد في مذهبهم جميع ما يتعلق بأمر المسلم في أمر دينه ودنياه، وفي أمر عقيدته وشريعته وفي أخلاقه؛ ولذلك لا تجد غالباً كتاباً من كتب أهل السنة إلا وتجد مصنفيها يذكرون الدعوة إلى الأخلاق الطيبة الحسنة. فأهل السنة يدعون إلى الواجبات وإلى السنن، ويدعون إلى ترك المحرمات وإلى ترك المكروهات، ويدعون إلى معالي الأخلاق وترك سفسافها، ويدعون إلى الأمر بالمعروف والنهي عن المنكر، ويستفيدون من وسائل الدعوة كل جديد منها إذا لم يخالف شيئاً من أدلة الكتاب والسنة، ويدعون إلى إحياء السنن وإلى إماتة البدع، ويدعون إلى إقامة شرائع الله، شريعة الله عز وجل، وإلى التحاكم إليها والحكم بها، ويدعون إلى طاعة الحكام في غير معصية الله ويحرّمون الخروج عليهم إلا بشرطه المعروف عند أهل السنة. فإذن لا تجد منحى من مناحي الحياة، عقيدة أو شريعة أو سلوكاً أو أدباً، إلا ولأهل السنة فيه تقرير وعقيدة؛ هذا يدل على أنهم يحققون به قول الله عز وجل: ﴿يا أيها الذين آمنوا ادخلوا في السلم كافة﴾، يعني خذوا الدين كله؛ فلا يجوز للإنسان أن يأمر ببعض الكتاب ويكفر ببعض: ﴿أفتؤمنون ببعض الكتاب وتكفرون ببعض﴾، أو أن يدعو إلى جملة من الكتاب ولا يدعو إلى الجملة الأخرى؛ لا بد أن تكون الدعوة متكاملة لكل أجزاء الدين ولكل أطرافه عقيدة وشريعة وسلوكاً."], "fr": ["Parmi leurs règles et leurs fondements : les gens de la Sunna et de la communauté appellent à la religion tout entière, sans détail ni exception. Leur appel pour Dieu englobe la religion tout entière, en toute chose : dans les croyances, dans les adorations, dans le comportement, les convenances et les mœurs, et dans tous les aspects et affaires de la vie. Les gens de la Sunna et de la communauté mettent toujours en garde contre la vue fragmentaire de la religion : « ceci est pour la croyance, ceci pour les lois, ceci pour les savants de la croyance » : non. Tu trouves dans leur doctrine tout ce qui concerne l&#x27;affaire du musulman dans sa religion et sa vie, dans sa croyance, sa loi et ses mœurs. C&#x27;est pourquoi tu ne trouves généralement aucun livre des gens de la Sunna sans que ses auteurs mentionnent l&#x27;appel aux bonnes mœurs.", "Les gens de la Sunna appellent aux obligations et aux sunnas, appellent à abandonner les interdits et les actes détestables, appellent aux nobles mœurs et à abandonner les bas-fonds, appellent à ordonner le convenable et à interdire le blâmable, et profitent de tout ce qui est nouveau parmi les moyens de la prédication tant qu&#x27;il ne contredit aucune preuve du Livre et de la Sunna ; ils appellent à faire revivre les sunnas et à faire mourir les innovations, appellent à établir les lois de Dieu, le Puissant et Majestueux, à y recourir en jugement et à juger par elles ; ils appellent à obéir aux gouvernants dans ce qui n&#x27;est pas désobéissance à Dieu, et interdisent de se soulever contre eux sauf dans la condition connue chez les gens de la Sunna. Tu ne trouves donc aucun aspect de la vie, croyance, loi, comportement ou convenance, sans que les gens de la Sunna y aient une détermination et une croyance. Ils réalisent ainsi la parole de Dieu : « Ô vous qui avez cru, entrez tous dans la paix (as-silm) », c&#x27;est-à-dire : prenez la religion tout entière. Il n&#x27;est pas permis à l&#x27;homme d&#x27;ordonner une partie du Livre et de mécroire à une autre : « Croyez-vous à une partie du Livre et mécroyez-vous à une autre ? » ; ni d&#x27;appeler à une partie du Livre sans appeler à l&#x27;autre : l&#x27;appel doit être complet, pour toutes les parties de la religion et tous ses aspects, croyance, loi et comportement."]}, {"id": "r19", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 19: يخطِّئون ولا يكفِّرون إلا بتحقق الشروط وانتفاء الموانع", "tf": "Règle 19 : Ils déclarent fautif sans déclarer mécréant, sauf conditions remplies", "ar": ["ومن أصول أهل السنة والجماعة والقواعد المقررة فيها: أهل السنة يخطّئون ولا يكفّرون إلا إذا ثبتت الشروط وانتفت الموانع. فليس أهل السنة بحريصين الحرص الكامل على تكفير المخالفين، لا؛ فإن باب التكفير بلا علم ولا هدى ولا برهان باب خطير، وآثاره وعواقبه وقيمه. فإذن أهل السنة يحرصون على أن يقولوا: أخطأت، ضللت، ابتعدت عن طريق الصواب؛ لكن لا يحرصون على أن يكفّروا المخالف لهم إلا إذا ثبت كفره يقيناً قاطعاً مع ثبوت الشروط، بعد ثبوت الشروط وانتفاء الموانع. أما الفرق الأخرى فإنها حريصة على تكفير مخالفيها من أدنى شبهة ومن أدنى مخالفة، وكأن التكفير عندهم وجبة شهية يتسابقون عليها."], "fr": ["Parmi les fondements des gens de la Sunna et les règles établies chez eux : les gens de la Sunna déclarent fautif mais ne déclarent pas mécréant, sauf lorsque les conditions sont remplies et les empêchements écartés. Les gens de la Sunna ne sont pas avides de déclarer mécréants les opposants, absolument pas : car le chapitre de la déclaration de mécréance, sans science, sans guidée ni preuve, est un chapitre dangereux, avec ses conséquences, ses suites et son prix. Les gens de la Sunna tiennent donc à dire : tu t&#x27;es trompé, tu t&#x27;es égaré, tu t&#x27;es éloigné de la voie de la justesse ; mais ils ne tiennent pas à déclarer mécréant celui qui s&#x27;oppose à eux, sauf si sa mécréance est établie avec certitude, de façon définitive, après que les conditions sont remplies et les empêchements écartés. Quant aux autres sectes, elles sont avides de déclarer mécréants leurs opposants pour la moindre ambiguïté, la moindre contradiction ; la déclaration de mécréance est chez elles un plat délicieux dont elles se disputent à la course."]}, {"id": "r20", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 20: يقولون الحق ويرحمون الخلق", "tf": "Règle 20 : Ils disent la vérité et ont miséricorde envers les créatures", "ar": ["ومن أصول أهل السنة والجماعة: أهل السنة يقولون الحق ويرحمون الخلق. فهم يقولون بالحق كما أخذ النبي صلى الله عليه وسلم على صحابته العهد؛ قال: «وعلى أن نقول بالحق حيث كنا لا نخاف في الله لومة لائم». ومع قولهم للحق فهم لا يعنّفون، ولا يقولون الحق بأخلاق سيئة، وإنما قولهم للحق من باب الرحمة والنصح. ولذلك لا ينبغي للإنسان إذا أراد أن يرحم أحداً أن يسكت عن قول الحق له؛ بل من كمال رحمتك به أن تقول الحق له وأن توجهه على ما تراه حقاً وصواباً. فإذن ليس قول الحق عند أهل السنة مفرداً عن رحمة الخلق."], "fr": ["Parmi les fondements des gens de la Sunna et de la communauté : ils disent la vérité et ont miséricorde envers les créatures. Ils disent la vérité comme le Prophète (que Dieu le bénisse et le salue) a pris l&#x27;engagement de ses compagnons : « … et que nous dirions la vérité où que nous soyons, sans craindre, pour Dieu, le blâme d&#x27;un blâmeur. » Et en disant la vérité, ils ne sont pas violents et ne la disent pas avec de mauvaises manières : leur parole de vérité relève de la miséricorde et du conseil. C&#x27;est pourquoi il ne convient pas que l&#x27;homme qui veut avoir miséricorde de quelqu&#x27;un se taise sur la vérité à son égard : bien plus, la perfection de ta miséricorde envers lui est de lui dire la vérité et de l&#x27;orienter vers ce que tu vois comme vérité et justesse. Chez les gens de la Sunna, dire la vérité n&#x27;est donc pas séparé de la miséricorde envers les créatures."]}, {"id": "r21", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 21: العناية بتحقيق المصالح ودرء المفاسد", "tf": "Règle 21 : Réaliser les intérêts et écarter les méfaits", "ar": ["ومن أصول أهل السنة والجماعة: أهل السنة والجماعة يعتنون بتحقيق المصالح ودرء المفاسد. وهذا واضح وضوح الشمس في مذهب أهل السنة والجماعة في كثير من عقائدهم المقررة، وذلك لأنهم يعلمون أن الشريعة جاءت بتقرير المصالح وتكميلها، وتعطيل المفاسد وتقليلها، وجاءت بتحصيل أعلى المصلحتين بتفويت أدناهما، وبدفع أشد المفسدتين بارتكاب أخفهما. في كثير من عقائد أهل السنة والجماعة ترى ذلك الأمر واضحاً، ولا تجده في العقائد الأخرى إلا نادراً."], "fr": ["Parmi les fondements des gens de la Sunna et de la communauté : ils s&#x27;attachent à réaliser les intérêts et à écarter les méfaits. Cela est clair comme le soleil dans la doctrine des gens de la Sunna et de la communauté, dans beaucoup de leurs croyances établies, car ils savent que la loi est venue pour établir et parfaire les intérêts, pour supprimer et réduire les méfaits, pour obtenir le plus grand des deux biens en laissant échapper le moindre, et pour repousser le plus grave des deux maux en commettant le plus léger. Dans beaucoup de croyances des gens de la Sunna et de la communauté, tu vois cela clairement ; et tu ne le trouves dans les autres croyances que rarement."]}, {"id": "r22", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 22: الصلاة والحج والجهاد خلف الأئمة برّهم وفاجرهم", "tf": "Règle 22 : Prière, pèlerinage et jihad derrière les imams, pieux ou pervers", "ar": ["ومن أصولهم: أهل السنة والجماعة يصلون الجمعة والجماعات والأعياد، ويقيمون الحج والجهاد خلف الأئمة، أبراراً كانوا أو فجاراً. وهذا لا تجده في كثير من مذاهب أهل القبلة، وهذا أصل من أصول أهل السنة؛ لا تجد كتاباً يذكر العقيدة على وجه الإجمال والتفصيل إلا ويقرر باباً اسمه «باب السمع والطاعة»؛ هذا لا تجده إلا في أهل السنة والجماعة. أياً كان هذا الإمام، براً كان أو فاجراً؛ فإذا لم تؤدَّ الجُمَع والجماعات ولم يقم علم الجهاد إلا خلف هذا الإمام [كلمة غير واضحة في التفريغ] فإننا نقيمها خلفه، بل إنه لا يتخلف عن إقامة الجمع والجماعات خلفه إلا مبتدع، كما نص على ذلك الإمام أحمد رحمه الله وغيره. ولذلك كان الإمام أحمد وغيره يصلون خلف أئمة الجهمية وهم يقولون بخلق القرآن، يقومون ويعتقدون ولاية المأمون مع أنه يقول بخلق القرآن."], "fr": ["Parmi leurs fondements : les gens de la Sunna et de la communauté accomplissent la prière du vendredi, les prières en groupe et les fêtes, et font le pèlerinage et le jihad derrière les imams, qu&#x27;ils soient pieux ou pervers. Cela, tu ne le trouves pas dans beaucoup de doctrines des gens de la qibla. C&#x27;est l&#x27;un des fondements des gens de la Sunna : tu ne trouves aucun livre exposant la croyance, en résumé ou en détail, sans qu&#x27;il établisse un chapitre appelé « chapitre de l&#x27;écoute et de l&#x27;obéissance » : cela, tu ne le trouves que chez les gens de la Sunna et de la communauté, quel que soit cet imam, pieux ou pervers. Si les vendredis et les prières en groupe ne s&#x27;accomplissent, et si l&#x27;étendard du jihad ne se dresse, que derrière cet imam [mot inintelligible dans la transcription], nous les accomplissons derrière lui. Bien plus, seul un innovateur s&#x27;abstient d&#x27;accomplir les vendredis et les prières en groupe derrière lui, comme l&#x27;ont précisé l&#x27;imam Ahmad, que Dieu lui fasse miséricorde, et d&#x27;autres. C&#x27;est pourquoi l&#x27;imam Ahmad et d&#x27;autres priaient derrière les imams jahmites, alors qu&#x27;ils disaient que le Coran est créé : ils priaient et reconnaissaient l&#x27;autorité d&#x27;al-Ma&#x27;mûn, bien qu&#x27;il disait que le Coran est créé."]}, {"id": "r23", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 23: يقرنون العلم بالعمل", "tf": "Règle 23 : Ils lient la science à l'action", "ar": ["ومن أصول أهل السنة وعلاماتهم: أهل السنة يقرنون العلم بالعمل والعمل بالعلم. لا يفرّقون بين علم وعمل، لماذا؟ لأنهم أهل الصراط المستقيم، ﴿صراط الذين أنعمت عليهم من النبيين والصديقين والشهداء والصالحين﴾. وبذلك باينوا كثيراً من الفرق؛ فإن أهل الفرق بعضهم عنده علم ولا يقرنه بعمل، يعرفونه كما يعرفون أبناءهم لكنهم لا يعملون به، وبعضهم يتخبطون في الأعمال بلا برهان ولا نور من الله عز وجل. أهل السنة يتعلمون ثم يقرنون هذا العلم بالعمل، ويذمّون من انفرد علمه عن عمل كما ذمّه الله عز وجل في قوله: ﴿يا أيها الذين آمنوا لم تقولون ما لا تفعلون * كبر مقتاً عند الله أن تقولوا ما لا تفعلون﴾، وممتثلين قوله عز وجل: ﴿أتأمرون الناس بالبر وتنسون أنفسكم وأنتم تتلون الكتاب أفلا تعقلون﴾. فإذن لا ينفرد في مذهب أهل السنة علم عن عمل ولا عمل عن علم."], "fr": ["Parmi les fondements des gens de la Sunna et leurs signes distinctifs : ils lient la science à l&#x27;action et l&#x27;action à la science. Ils ne séparent pas science et action, car ils sont les gens de la voie droite, « la voie de ceux que Dieu a comblés de Ses bienfaits : les prophètes, les véridiques, les martyrs et les justes ». Par là, ils se sont distingués de beaucoup de sectes : parmi les gens de ces sectes, certains ont la science sans la lier à l&#x27;action, ils la connaissent comme ils connaissent leurs fils, mais n&#x27;agissent pas en conséquence ; certains se débattent dans les œuvres sans preuve ni lumière de Dieu, le Puissant et Majestueux. Les gens de la Sunna apprennent puis lient cette science à l&#x27;action, et blâment celui dont la science est séparée de l&#x27;action, comme Dieu, le Puissant et Majestueux, l&#x27;a blâmé dans Sa parole : « Ô vous qui avez cru, pourquoi dites-vous ce que vous ne faites pas ? C&#x27;est une grande abomination auprès de Dieu que de dire ce que vous ne faites pas » ; et dans Sa parole : « Ordonnez-vous aux gens la piété et vous oubliez-vous vous-mêmes, alors que vous récitez le Livre ? Ne raisonnez-vous donc pas ? » Dans la doctrine des gens de la Sunna, la science n&#x27;est donc jamais séparée de l&#x27;action, ni l&#x27;action de la science."]}, {"id": "r24", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 24: التدين لله بتوقير السلف الصالح", "tf": "Règle 24 : La vénération des pieux prédécesseurs", "ar": ["ومن أصولهم وقواعدهم: أهل السنة متفقون على التدين لله عز وجل بتوقير السلف الصالح. فلا تجد طائفة تحترم الصحابة كأهل السنة والجماعة. هل الرافضة يحترمون الصحابة؟ الخوارج يحترمون الصحابة؟ المعتزلة الذين يقول قائلهم: لو يشهد عليّ بن أبي طالب عندي في حزمة قَتّ ما قبلتُ شهادته، هل هذا بالله وقّر السلف الصالح؟ الذين يقولون: لماذا تربطوننا بأفهام قوم قد ماتوا؟ دعونا نفهم الدين على مقتضيات ومخترعات ومكتشفات عصرنا القرن العشرين؛ هل هؤلاء يوقرون السلف؟ فلذلك لا تجد طائفة من الطوائف تعظّم السلف وتوقرهم التوقير العظيم وتنزلهم منزلتهم إلا أهل السنة والجماعة، وطوبى لهم وهم معهم في الجنة بإذن الله عز وجل، لأن من أحب قوماً حُشر معهم، ونشهد الله على محبتهم جميعاً ونسأل الله أن يحشرنا في زمرتهم. فإذن هذه قاعدة وأصل، ممتثلين في ذلك قول الله عز وجل: ﴿والذين جاؤوا من بعدهم﴾، يعني نحن، ﴿يقولون ربنا اغفر لنا ولإخواننا الذين سبقونا بالإيمان ولا تجعل في قلوبنا غلاً للذين آمنوا ربنا إنك رؤوف رحيم﴾. من أي طائفة تعتمد هذه الآية والعمل بها ديناً تدين الله عز وجل به؟ إنهم أهل السنة والجماعة؛ يعني إذا التلاب الرافضة هم اللي بيعملون بها ولا الخوارج ولا غيره؟ لا، وإنما هم أهل السنة والجماعة، رفع الله قدرهم ومنازلهم في الدنيا والآخرة."], "fr": ["Parmi leurs fondements et leurs règles : les gens de la Sunna sont unanimes à pratiquer la religion devant Dieu par la vénération des pieux prédécesseurs. Tu ne trouves aucune secte qui respecte les compagnons comme les gens de la Sunna et de la communauté. Les Rafidites respectent-ils les compagnons ? Les Kharijites respectent-ils les compagnons ? Les Mu&#x27;tazilites, dont l&#x27;un a dit : « Même si &#x27;Alî ibn Abî Tâlib témoignait en ma faveur, avec un fagot de bois, je n&#x27;accepterais pas son témoignage » : est-ce là, par Dieu, vénérer les pieux prédécesseurs ? Ceux qui disent : « Pourquoi nous liez-vous aux compréhensions de gens morts ? Laissez-nous comprendre la religion selon les exigences, les inventions et les découvertes de notre époque, le XXe siècle » : ces gens-là vénèrent-ils les salaf ? Tu ne trouves donc aucune secte qui exalte les salaf et les vénère de cette grande vénération et les place à leur rang, sauf les gens de la Sunna et de la communauté. Heureux soient-ils : ils seront avec eux au Paradis, avec la permission de Dieu, car « celui qui aime un peuple est rassemblé avec lui », et nous prenons Dieu à témoin de notre amour pour eux tous, et nous Lui demandons de nous rassembler dans leur cortège. C&#x27;est donc une règle et un fondement, en mettant en pratique la parole de Dieu : « Et ceux qui sont venus après eux » (c&#x27;est-à-dire nous) « disent : Notre Seigneur, pardonne-nous ainsi qu&#x27;à nos frères qui nous ont devancés dans la foi, et ne mets dans nos cœurs aucune rancœur envers ceux qui ont cru. Notre Seigneur, Tu es Compatissant, Miséricordieux. » Quelle secte met en pratique ce verset et en fait une religion devant Dieu ? Seraient-ce les Rafidites ? Les Kharijites ou d&#x27;autres ? Non : ce sont les gens de la Sunna et de la communauté, que Dieu élève leur rang et leurs demeures en ce monde et dans l&#x27;autre."]}, {"id": "r25", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 25: تنزيل العقل منزلته", "tf": "Règle 25 : Placer la raison à son rang", "ar": ["ومن قواعدهم وأصولهم: أهل السنة والجماعة ينزّلون العقل منزلته المناسبة فلا إفراط فيه ولا تفريط. فلا إفراط كما فعله المعتزلة والفلاسفة الذين عبدوا العقل عبادة وجعلوه إلهاً؛ فأي شيء تقوله عقولهم فهو الحق الذي لا أحق منه، ويا ويل النص إذا سوّلت له نفسه أن يخالف العقل، فإنهم يضربون النص في وجهه ويلقونه خارجاً ويعتمدون عقولهم. فالدين عندهم ما قررته عقولهم، والشريعة عندهم ما استحسنته عقولهم؛ ولذلك عند المعتزلة أصل من أصولهم الخمسة هو أصل التحسين والتقبيح، أليس كذلك؟ يعني ما معناه: ما حسّنه العقل فهو الحسن شرعاً وإن لم يدل عليه دليل، وما قبّحه العقل فهو القبيح شرعاً وإن تواترت الأدلة على تحسينه؛ فإذن هم لا ينظرون إلى دليل ولا ينظرون إلى نص، وإنما ينظرون إلى ما تقرره عقول هؤلاء؛ اتخذوا عقولهم آلهة، فعندهم إفراط في مسألة العقل. بينما نجد بعض الطوائف منهم الأشاعرة وغيرهم قد عطّلوا وظيفة العقل، فقالوا: مسكين هذا العقل، لا يستطيع أن يدرك حسن الأشياء ولا قبحها؛ هؤلاء عطّلوا وظيفة العقل؛ لا هؤلاء أصابوا ولا هؤلاء أصابوا. أهل السنة ينزّلون العقل منزلته؛ فيقولون: الله جل وعلا خلق هذه الغريزة عارفة بحسن الأشياء وقبحها، ولكن لا شأن لهذه الغريزة في تشريعها؛ التشريع مستمد من الله. لكن كون العقل يعرف أن هذا حسن وهذا قبيح هذا شيء ركّبه الله فيه، هذه وظيفة من وظائفه؛ لماذا نلغي وظيفته؟ لكن لا شأن للعقل في تشريع الأمور لأن التشريع يفتقر إلى إذن الله عز وجل الشرعي. فالشريعة ليست ما قررها العقل بل الشريعة ما قرره النص وإن جاء العقل بخلافه، إن سلّمنا وجود تعارض بين النقل والعقل أصلاً؛ أنتم معي في هذا ولا لا؟ فإذن أعظم طائفة احترمت العقل هي الطائفة التي تنزّله منزلته، فلا تحمّله ما لا يطيق من أمور الغيب ولا تدخله فيما لا يليق، لا تحمّله ما لا يطيق ولا تدخله فيما لا يليق به؛ وهم أهل السنة والجماعة. يا سلام على هذا المذهب يا شيخ! الحمد لله أن من اتباعه نعمة عظيمة، والله نعمة والله بس ما نقدر قدرها. بدأنا نعرف عظمة ما عندنا من الحق لما وجدنا تلك القنوات التي يتولاها أهل البدع وكيف يفعلون بأنفسهم من الباطل؛ أصبح الإنسان يعرف الحق الذي عنده ونعمة الله عليه."], "fr": ["Parmi leurs règles et leurs fondements : les gens de la Sunna et de la communauté placent la raison à son rang convenable, sans excès ni manque. Sans excès, comme l&#x27;ont fait les Mu&#x27;tazilites et les philosophes, qui ont adoré la raison d&#x27;une adoration et en ont fait un dieu : tout ce que disent leurs raisons est la vérité, il n&#x27;y a pas de vérité plus vraie ; et malheur au texte s&#x27;il se met en tête de contredire la raison : ils le frappent au visage, le jettent dehors et s&#x27;appuient sur leurs raisons. La religion est, chez eux, ce que leurs raisons ont décidé, et la loi est ce que leurs raisons ont jugé bon. C&#x27;est pourquoi, chez les Mu&#x27;tazilites, l&#x27;un de leurs cinq fondements est le fondement de l&#x27;embellissement et de l&#x27;enlaidissement par la raison (at-tahsîn wa t-taqbîh) : ce que la raison a embelli est beau en droit même sans preuve, et ce que la raison a enlaidi est laid en droit même si les preuves se sont succédé pour l&#x27;embellir. Ils ne regardent donc ni preuve ni texte, mais ce que décident leurs raisons : ils ont pris leurs raisons pour dieux. Ils ont donc excédé en la matière de la raison.", "À l&#x27;inverse, nous trouvons que certaines sectes, dont les Acharites et d&#x27;autres, ont suspendu la fonction de la raison : ils ont dit : « Pauvre raison, elle ne peut percevoir ni la beauté des choses ni leur laideur. » Ceux-là ont suspendu la fonction de la raison. Ni ceux-ci n&#x27;ont eu raison, ni ceux-là. Les gens de la Sunna placent la raison à son rang : ils disent : Dieu, Exalté, a créé cet instinct connaissant la beauté et la laideur des choses, mais cet instinct n&#x27;a rien à voir avec leur législation : la législation vient de Dieu. Que la raison sache que ceci est beau et ceci laid, c&#x27;est une chose que Dieu a placée en elle, l&#x27;une de ses fonctions : pourquoi annuler sa fonction ? Mais la raison n&#x27;a aucun rôle dans la législation des affaires, car la législation requiert l&#x27;autorisation légale de Dieu, le Puissant et Majestueux. La loi n&#x27;est pas ce que la raison a décidé, mais ce que le texte a décidé, même si la raison vient à l&#x27;encontre, à supposer même qu&#x27;il existe une contradiction entre la transmission et la raison — êtes-vous avec moi sur ce point ? La secte qui a le plus respecté la raison est donc celle qui la place à son rang : elle ne la charge pas de ce qu&#x27;elle ne peut supporter des affaires de l&#x27;invisible, et ne la fait pas entrer dans ce qui ne lui convient pas. Ne la charge pas de ce qu&#x27;elle ne peut supporter, et ne la fais pas entrer dans ce qui ne lui convient pas : ce sont les gens de la Sunna et de la communauté. Quelle belle doctrine, ô cheikh ! Louange à Dieu, c&#x27;est une grande grâce que de la suivre, par Dieu, une grâce dont nous n&#x27;estimons pas la valeur. Nous avons commencé à connaître la grandeur de la vérité que nous avons lorsque nous avons trouvé ces chaînes tenues par les gens d&#x27;innovation et ce qu&#x27;ils font d&#x27;eux-mêmes de faux : l&#x27;homme en est venu à connaître la vérité qu&#x27;il a et la grâce de Dieu sur lui."]}, {"id": "r26", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 26: النصيحة للموافق والمخالف", "tf": "Règle 26 : Le conseil envers l'allié et l'opposant", "ar": ["ومن أصولهم أيضاً: أهل السنة يدينون بالنصيحة للموافق والمخالف. لماذا؟ لأنهم يعتمدون قول النبي صلى الله عليه وسلم: «الدين النصيحة». قلنا: لمن يا رسول الله؟ قال: «لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم». ويقول النبي صلى الله عليه وسلم: «وإذا استنصحك فانصح له». فهم لا يحرمون النصح أحداً كائناً من وافقهم أو خالفهم؛ فهم ينصحون الجميع من غير استثناء."], "fr": ["Parmi leurs fondements : les gens de la Sunna professent le conseil envers l&#x27;allié et l&#x27;opposant. Pourquoi ? Parce qu&#x27;ils s&#x27;appuient sur la parole du Prophète (que Dieu le bénisse et le salue) : « La religion est le conseil. » Nous dîmes : « Pour qui, ô Messager de Dieu ? » Il dit : « Pour Dieu, Son Livre, Son Messager, les imams des musulmans et leur communauté. » Et le Prophète dit : « Et s&#x27;il te demande conseil, conseille-le. » Ils ne refusent donc le conseil à personne, qu&#x27;il leur soit d&#x27;accord ou opposé : ils conseillent tous, sans exception."]}, {"id": "r27", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 27: موافقة الفطرة السليمة والعقل الصريح", "tf": "Règle 27 : Concordance avec la nature saine et la raison claire", "ar": ["ومن أصولهم العقدية أيضاً: أهل السنة والجماعة في جميع أصولهم ومذاهبهم متفقون مع الفطرة السليمة والعقل الصريح. أهل السنة والجماعة في كل أصولهم ومذاهبهم متفقون مع الفطرة السليمة والعقل الصريح؛ ولذلك نحن نستدل على كثير من عقائد أهل السنة والجماعة بقولنا: دل عليها النقل والعقل والفطرة، أليس كذلك؟ لأنه المذهب الوحيد الذي يتفق مع الفطرة. لكن والله العظيم لو أذكر لكم بعض مذاهب الخوارج، ولا بعض مذاهب الجهمية في الله عز وجل، لأمسكتَ رأسك؛ أيُتصوَّر أن عبداً من عباد الله يقول هذا الكلام في الله؟ نعم وُجد، لكن لا نريد أن نذكر شيئاً من ذلك؛ وإلا فهم يصفون الله بصفات تنفر منها الفطرة حتى فطرة العوام؛ لما تُعلَّم يجد في فطرته نفوراً من هذا الكلام. أما مذاهب أهل السنة فمهما عرضتها تجد انشراحاً وقبولاً لأنها متفقة مع الفطرة كل الاتفاق؛ ليس ثمة عقيدة تنافر الفطرة إلا عند من فسدت عقيدته، فإنه إذا عُرضت عليه مذاهب أهل السنة ينفر منها، ولا غرابة في ذلك فقد قال الله عز وجل: ﴿وإذا تتلى عليهم آياتنا بينات تعرف في وجوه الذين كفروا المنكر﴾؛ لكن الذين آمنوا قال فيهم: ﴿وإذا تليت عليهم آياته زادتهم إيماناً﴾."], "fr": ["Parmi leurs fondements en matière de croyance encore : les gens de la Sunna et de la communauté, dans tous leurs fondements et doctrines, concordent avec la nature saine (al-fitra) et la raison claire. C&#x27;est pourquoi nous argumentons pour beaucoup de croyances des gens de la Sunna en disant : la transmission, la raison et la nature en témoignent, n&#x27;est-ce pas ? Parce que c&#x27;est la seule doctrine qui s&#x27;accorde avec la nature. Mais, par Dieu le Grand, si je vous mentionnais certaines doctrines des Kharijites, ou certaines doctrines des Jahmites sur Dieu, le Puissant et Majestueux, vous vous prendriez la tête : est-il imaginable qu&#x27;un serviteur de Dieu dise cela de Dieu ? Oui, cela existe ; mais nous ne voulons rien en mentionner. Ils décrivent Dieu par des attributs que la nature rebute, même la nature des gens du commun : celui qui apprend trouve en sa nature une aversion pour ces paroles. Quant aux doctrines des gens de la Sunna, quelle que soit la façon dont tu les présentes, tu trouves ouverture et acceptation, car elles concordent entièrement avec la nature. Il n&#x27;y a pas de croyance qui rebute la nature, sinon chez celui dont la croyance est corrompue : quand on lui présente les doctrines des gens de la Sunna, il les rebute, et il n&#x27;y a là rien d&#x27;étonnant, car Dieu dit : « Et lorsque Nos versets clairs leur sont récités, tu reconnais sur les visages de ceux qui ont mécru le rejet. » Mais ceux qui ont cru, il dit d&#x27;eux : « Et lorsque Ses versets leur sont récités, ils augmentent leur foi. »"]}, {"id": "r28", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 28: الوضوح والبيان واليسر في تقرير العقائد", "tf": "Règle 28 : Clarté et simplicité dans l'exposé des croyances", "ar": ["ومن أصولهم العقدية أيضاً: أهل السنة يعتمدون في تقرير عقائدهم على الوضوح والبيان والسهولة واليسر، لا يحرصون على تعقيد الألفاظ كما تفعله الطوائف الأخرى. يا شيخ، والله في بعض كتب الطوائف نقرؤها ولا نفقه منها شيئاً أبداً. طيب، إذا كان طلبة العلم إذا قرؤوا هذه كتب هذه الطوائف لا يفهمون، فكيف يُطلب من عوامهم أن يفهموا؟ وقد سألت بعض مشايخنا: لماذا يعمد أصحاب هذه الفرق إلى تعقيد الألفاظ؟ قال: لأنهم لا يأتون بحق فلا يريدون أتباعهم أن يفهموا. لكن أهل السنة لأنهم لا يأتون إلا بالحق فهم يوضحون العبارة توضيحاً يفهمه من ليس من أهل الاختصاص، يفهمه الكبير والصغير والعالم والجاهل ويفهمه الذكر والأنثى؛ لماذا؟ لأن عقيدتهم أصلاً مبنية على ماذا؟ على الحنيفية السمحة، والله عز وجل يقول في كتابه: ﴿ولقد يسّرنا القرآن للذكر فهل من مدّكر﴾. فأهل السنة لما كانت عقيدتهم مبنية على كتاب وصفه الله بأنه يسير سهل، صارت عقائدهم يسيرة سهلة سمحة واضحة ظاهرة، لا سيما إذا أُعطيت يعني شيئاً من الشرح أو حظها من الشرح، عقائد واضحة. لكن اقرأ في كتب الفلاسفة؛ افتح كتاباً من كتب الرازي القديمة، أو كتب أبي المعالي الجويني القديمة، واقرأ فيها؛ افتح بعض كتب المعتزلة العقدية واقرأ فيها؛ والله ستفغر فاك، عبارات صعبة مغلقة تحتاج في فهم المفردة إلى أسابيع فضلاً عن فهم المعلومة التي ذُكرت في هذه المفردة أصلاً. لماذا؟ لأنهم لا يريدون من أتباعهم أن يفهموا ما يقولون. أنا وقع في يدي كتاب من كتب الإسماعيلية إذ كنت مدرساً في نجران ذاك الزمان، فلما قرأته أنا ما فهمت إلا «بسم الله الرحمن الرحيم»، ثم بعدها كأنها طلاسم سحرية وخطوط متداخلة وكلام غير واضح وغير مفهوم أبداً، لا تدري ماذا يريد؛ هو يدخلك في وادٍ ثم يصعد بك إلى جبل ثم ينزلك في بحر ثم أنت لا تدري ماذا يريد. فأتباعهم يشتكون من صعوبة تلك الألفاظ؛ ولذلك يسمون حقائق عقائدهم عقائد الخاصة، وأما ما يفهمه سائر أتباعهم فإنها عقائد العامة."], "fr": ["Parmi leurs fondements en matière de croyance encore : les gens de la Sunna s&#x27;appuient, pour établir leurs croyances, sur la clarté, l&#x27;explication, la simplicité et la facilité ; ils ne tiennent pas à compliquer les expressions comme le font les autres sectes. Cheikh, par Dieu, dans certains livres de ces sectes, nous lisons sans rien comprendre du tout. Or si les étudiants en sciences religieuses lisent ces livres et ne comprennent pas, comment demander à leurs gens du commun de comprendre ? J&#x27;ai demandé à certains de nos cheikhs : pourquoi les gens de ces sectes s&#x27;attachent-ils à compliquer les expressions ? Il a dit : parce qu&#x27;ils n&#x27;apportent pas de vérité, et ne veulent donc pas que leurs suiveurs comprennent.", "Mais les gens de la Sunna, parce qu&#x27;ils n&#x27;apportent que la vérité, rendent l&#x27;expression claire d&#x27;une clarté que comprend celui qui n&#x27;est pas spécialiste : le comprennent le grand et le petit, le savant et l&#x27;ignorant, l&#x27;homme et la femme. Pourquoi ? Parce que leur croyance est bâtie sur la religion droite et facile (al-hanîfiyya as-samha), et Dieu, le Puissant et Majestueux, dit dans Son Livre : « Nous avons rendu le Coran facile pour la remémoration : y a-t-il quelqu&#x27;un pour se rappeler ? » Les gens de la Sunna, puisque leur croyance est bâtie sur un livre que Dieu a décrit comme facile et aisé, ont des croyances faciles, aisées, tolérantes, claires, évidentes, surtout lorsqu&#x27;on leur donne un peu d&#x27;explication, ou leur part d&#x27;explication. Mais lis dans les livres des philosophes : ouvre un livre d&#x27;ar-Râzî parmi les anciens, ou d&#x27;Abû l-Ma&#x27;âlî al-Juwaynî parmi les anciens, et lis-y ; ouvre certains livres de croyance des Mu&#x27;tazilites et lis-y : par Dieu, tu resteras bouche bée : des expressions difficiles, verrouillées, qui demandent des semaines pour comprendre un seul mot, sans parler de comprendre l&#x27;information qui a été mentionnée dans ce mot. Pourquoi ? Parce qu&#x27;ils ne veulent pas que leurs suiveurs comprennent ce qu&#x27;ils disent.", "Un livre des Ismaéliens m&#x27;est tombé entre les mains lorsque j&#x27;étais enseignant à Najrân en ce temps-là ; en le lisant, je n&#x27;ai compris que « Au nom de Dieu, le Tout Miséricordieux, le Très Miséricordieux », puis après cela, c&#x27;était comme des talismans de sorcellerie, des lignes entremêlées et un discours peu clair, absolument incompréhensible : tu ne sais pas ce qu&#x27;il veut, il t&#x27;entraîne dans une vallée, puis te fait monter sur une montagne, puis te fait descendre dans une mer, et tu ne sais toujours pas ce qu&#x27;il veut. Leurs suiveurs se plaignent de la difficulté de ces expressions : c&#x27;est pourquoi ils appellent les réalités de leurs croyances « les croyances de l&#x27;élite » (al-&#x27;aqâ&#x27;id al-khâssa), et ce que comprennent le reste de leurs suiveurs, « les croyances du commun » (al-&#x27;âmma)."]}, {"id": "r29", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 29: لوازم الأدلة لا تكون إلا حقاً", "tf": "Règle 29 : Les implications des preuves ne sont que vérité", "ar": ["أهل السنة لا يجعلون لوازم الأدلة إلا حقاً. أهل السنة والجماعة لا يجعلون لوازم الأدلة إلا حقاً، وهذه الخصيصة لا تجدها إلا في مذهب أهل السنة والجماعة. وأما سائر أهل البدع فإنهم يجعلون لوازم باطلة تلزم من قول الله ورسوله صلى الله عليه وسلم، وبسبب تلك اللوازم التي افترضتها عقولهم يردّون دلالة النص؛ مثل قول الأشاعرة في قول الله عز وجل: ﴿الرحمن على العرش استوى﴾ قالوا: لو كان استوى على العرش فإن ذلك يلزم منه أننا لو أبعدنا العرش عن الرب لسقط الله. هم يقولون كذا، والله مدوّن في كتبهم. هذا اللازم من أين جاؤوا به؟ من إيش؟ من عقولهم. فهم يجعلون لوازم باطلة على النص، فتحملهم تلك اللوازم على إنكار دلالة النص؛ وهذا بريء منه مذهب أهل السنة والجماعة. فأهل السنة والجماعة لا يفهمون من لوازم الأدلة إلا كل حق، لا يمكن أبداً أن تجد كلمة واحدة عن أهل السنة والجماعة على خلاف ذلك."], "fr": ["Les gens de la Sunna ne font des implications des preuves que de la vérité. Les gens de la Sunna et de la communauté ne font des implications des preuves (lawâzim al-adilla) que de la vérité. Cette caractéristique, tu ne la trouves que dans la doctrine des gens de la Sunna et de la communauté. Quant au reste des gens d&#x27;innovation, ils font des implications fausses découler de la parole de Dieu et de Son Messager (que Dieu le bénisse et le salue), et à cause de ces implications que leurs raisons ont supposées, ils rejettent l&#x27;indication du texte. Par exemple, la parole des Acharites sur la parole de Dieu : « Le Tout-Miséricordieux s&#x27;est établi sur le Trône » : ils disent que s&#x27;Il s&#x27;était établi sur le Trône, il en découlerait que si nous éloignions le Trône du Seigneur, Dieu tomberait. Ils disent cela, par Dieu, et c&#x27;est consigné dans leurs livres. D&#x27;où ont-ils tiré cette implication ? De quoi ? De leurs raisons. Ils attribuent donc au texte des implications fausses, et ces implications les poussent à nier l&#x27;indication du texte. Cela, la doctrine des gens de la Sunna et de la communauté en est innocente : les gens de la Sunna ne comprennent des implications des preuves que du vrai, et il est impossible de trouver une seule parole des gens de la Sunna et de la communauté qui soit contraire à cela."]}, {"id": "r30", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 30: ما يخرج به العبد من دائرة أهل السنة", "tf": "Règle 30 : Ce qui fait sortir du cercle des gens de la Sunna", "ar": ["قاعدة أخيرة: يخرج العبد عن دائرة أهل السنة بمخالفة أصل، أو عقيدة مجمع عليها، أو في طرق التلقي. إذا خالف أحد من الناس شيئاً من هذه الأمور الثلاثة فهو خارج عن دائرة أهل السنة. فالذي يقرر في عقيدته أصلاً على خلاف ما أصّله أهل السنة فليس هو من أهل السنة والجماعة، والذي يعتقد عقيدة على خلاف ما أجمع عليه أهل السنة فهو ليس من أهل السنة والجماعة، والذي يتلقى العقائد على خلاف ما تلقاه أهل السنة والجماعة فليس هو من أهل السنة والجماعة. هذه جمل من الفرقان الذي يميز الإنسان به بين أهل السنة والجماعة ممن عداهم. والله أعلم، وصلى الله وسلم على نبينا."], "fr": ["L&#x27;homme sort du cercle des gens de la Sunna en contredisant un fondement, ou une croyance faisant l&#x27;objet d&#x27;un consensus, ou les voies de réception (de la science). Si quelqu&#x27;un contredit l&#x27;une de ces trois choses, il sort du cercle des gens de la Sunna. Celui qui établit dans sa croyance un fondement contraire à ce que les gens de la Sunna ont fondé n&#x27;est pas des gens de la Sunna et de la communauté ; celui qui croit une croyance contraire à ce sur quoi les gens de la Sunna se sont unanimement accordés n&#x27;est pas des gens de la Sunna et de la communauté ; et celui qui reçoit les croyances à l&#x27;inverse de ce que les gens de la Sunna et de la communauté ont reçu n&#x27;est pas des gens de la Sunna et de la communauté.", "Voilà un ensemble de critères de discernement par lesquels l&#x27;homme distingue les gens de la Sunna et de la communauté de ceux qui ne le sont pas.", "Et Dieu sait mieux. Que Dieu prie et salue notre Prophète."]}]};const C=D.ch,N=C.length;let cur=0,mode='both';
