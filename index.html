rt de saine croyance pour un homme qui ne prend pas ses croyances du Livre selon la compréhension des salaf de la communauté.", "<b>Cinquième exemple.<\/b> Voyez, mes frères : tous les Acharites, absolument tous, disent à propos de « Et subsistera la Face de ton Seigneur » que « la face » désigne l&#x27;essence. Faux : les compagnons sont unanimes qu&#x27;elle désigne une Face réelle, propre à Dieu, qui Lui convient. Dieu dit : « Bien plutôt, Ses deux mains sont déployées. » Les Acharites disent : ce sont le bienfait et le pouvoir. Faux : les salaf sont unanimes que ce sont deux mains réelles, propres à Dieu, qui conviennent à Sa majesté et à Sa grandeur. « Notre Seigneur descend » : les Acharites disent : c&#x27;est l&#x27;ordre de notre Seigneur qui descend, ou un ange, ou une miséricorde. Faux ! Les salaf sont unanimes que c&#x27;est une descente divine qui convient à Sa majesté et à Sa grandeur. Et ainsi dans tous les versets.", "Dieu dit : « Et Ma miséricorde embrasse toute chose. » Les Acharites et les gens d&#x27;innovation disent : la miséricorde, c&#x27;est la volonté de faire du bien. Faux ! C&#x27;est une miséricorde qui convient à la majesté et à la grandeur de Dieu. Le Prophète dit : « … jusqu&#x27;à ce que le Seigneur de la Puissance y pose Son pied » et, dans une version, « y pose Son pied ». Les gens d&#x27;innovation disent : le « pied », c&#x27;est un groupe de gens. Faux ! C&#x27;est le pied de Dieu, d&#x27;une manière qui Lui convient, Puissant et Majestueux. Nous n&#x27;entrons pas dans ce chapitre en interprétant par nos opinions ni en imaginant par nos passions, car « rien n&#x27;est semblable à Lui, et Il est l&#x27;Audient, le Clairvoyant ». Voilà une règle qui anéantit toutes les croyances des gens d&#x27;innovation."]}, {"id": "p2d", "g": "الأصل الثاني: فهم السلف", "gf": "Deuxième principe : la compréhension des salaf", "ta": "أي فهم نقصد؟ وصلة الأصلين", "tf": "Quelle compréhension ? Le lien entre les deux principes", "ar": ["إذن الأخذ بالكتاب والسنة على مقتضى فهم سلف الأمة أصلان متلازمان، لا ينفكان أبداً عن بعضهما. فتجد أن أغلب من ضل قد يكون سبب ضلاله عدم أخذه بالكتاب والسنة أصلاً، أو يكون سبب ضلاله ليس لأنه لم يأخذ بالكتاب والسنة، لا، ولكن لأنه فهم الكتاب والسنة على مقتضى فهمه هو، ليس على مقتضى فهم سلف الأمة.", "فإن قلتَ: وأي فهم تقصد؟ أقول: اسمع، أقصد الفهم المتفق عليه لا المختلف فيه. فمتى ما اتفق السلف على فهم في نصوص الصفات، في نصوص العقائد، فالواجب على من بعدهم أن يعتمد فهمهم ولا يجتهد بفهم جديد. لكن هناك أشياء من النصوص يسيرة، تُعدُّ على الأصابع، اختلف فهم السلف رحمهم الله تعالى فيها، كقول الله عز وجل: ﴿يوم يكشف عن ساق﴾؛ فمنهم من قال: أي عن الشدة والكرب، ومنهم من قال: بل المقصود بها ساق الله عز وجل. لكن اسمعوا: الجميع متفقون على إثبات الساق لله عز وجل على ما يليق بجلاله وعظمته، لكنهم اختلفوا: هل من جملة الأدلة التي تدل على هذه الصفة هذه الآية أم لا؟ فإذن هم لم يختلفوا في صفة الساق، ولكن اختلفوا هل هذه الآية من جملة الأدلة التي تدل على هذه الصفة أم لا. فقط."], "fr": ["Ainsi, prendre le Livre et la Sunna conformément à la compréhension des salaf de la communauté constitue deux principes indissociables, qui ne se séparent jamais l&#x27;un de l&#x27;autre. Tu trouveras que la plupart de ceux qui se sont égarés ont pour cause de leur égarement soit de n&#x27;avoir pas pris du tout le Livre et la Sunna, soit, non pas de ne les avoir pas pris, mais de les avoir compris selon leur propre compréhension et non selon celle des salaf de la communauté.", "Si tu dis : « Mais de quelle compréhension parles-tu ? » Je réponds : écoute, j&#x27;entends la compréhension sur laquelle on s&#x27;accorde, non celle sur laquelle on diverge. Dès que les salaf se sont accordés sur une compréhension des textes des attributs et des textes de croyance, il est obligatoire pour ceux qui viennent après eux de s&#x27;appuyer sur leur compréhension et de ne pas se livrer à un effort personnel pour une compréhension nouvelle. Mais il existe quelques textes, peu nombreux, qu&#x27;on compte sur les doigts, sur lesquels la compréhension des salaf, que Dieu leur fasse miséricorde, a divergé. Par exemple la parole de Dieu : « Le jour où l&#x27;on découvrira le tibia (sâq) ». Certains ont dit : il s&#x27;agit de la dureté et de l&#x27;épreuve ; d&#x27;autres ont dit : il s&#x27;agit bien du sâq de Dieu, le Puissant et Majestueux. Mais écoutez : tous s&#x27;accordent à affirmer le sâq pour Dieu, d&#x27;une manière qui convient à Sa majesté et à Sa grandeur. Ils ont divergé seulement sur la question de savoir si ce verset fait partie des preuves de cet attribut ou non. Ils n&#x27;ont donc pas divergé sur l&#x27;attribut du sâq, mais sur le fait de savoir si ce verset fait partie des preuves de cet attribut. C&#x27;est tout."]}, {"id": "p3a", "g": "الأصل الثالث: عدم إقحام العقل في الغيب", "gf": "Troisième principe : ne pas plonger la raison dans l'invisible", "ta": "تقرير الأصل الثالث ومثال الجوال", "tf": "Énoncé du troisième principe et exemple du téléphone", "ar": ["فإن قلتَ: وهل يكفي هذان الأصلان؟ فأقول: لا يكفيان، لا بد من الأصل الثالث أيضاً. الأصل الثالث وهو كمال تلك الأصول وجمالها وتاجها وثمرتها وشرط الأمان فيها، وهو: ألّا ندخل عقولنا في أمور الغيب. أبسطها على اللسان: ألّا نقحم عقولنا فيما وراء الغيب.", "انتبه من هذا العقل! الله عز وجل لما خلق هذا العقل، انتبهوا لي أرجوكم، لما خلق هذا العقل جعل لمدركاته حدوداً وطاقات؛ لا يزال تفكيره سليماً ما دام داخل حدوده وطاقاته. لكن متى ما أخرجته وأردت أن تستكشف به أمراً خارج حدود طاقاته وقدراته فإنه لن يرجع لك إلا بالخيبة والحيرة والتيه والشكوك والأوهام والخيالات والعقائد الباطلة.", "قالوا: اضرب مثالاً. طيب، مثل الجوال: خلّ العقل مثل الجوال. الجوال له منطقة استقبال، استقباله يكون سليماً ما دام داخل هذه المنطقة؛ لكن لو طلّعته ورحت البر، أخرجته عن منطقة استقباله، هل سيستقبل شيئاً؟ حديدة لا نفع فيها! يموت الميت في البر وجواله معه في مخبأ، ما يقدر لا يتصل عليه أحد ولا يتصل على أحد. هذا مثل العقل: العقل لما خلقه الله جعل له منطقة استقبال، وهي الأشياء المرئية المحسوسة. لكن الله أخفى عوالم غيبية كثيرة عن هذا العقل، وجعل من العقيدة أن نؤمن بتلك الأشياء الغيبية. فبعض الناس يريد بعقله أن يستكشف هذه الأشياء الغيبية، فإذا لم يجد لها أثراً عاد وكفر بها.", "فكثير من الناس كفر بالملائكة، لماذا؟ لأن عقله ما... وين الملائكة؟ وين يا الربع الملائكة؟ وينها؟ وين الملائكة؟ لا نراها ولا ندركها بحواسنا، ما في عقول تدركها، إذن ما في شيء اسمه عالم ملائكة! الله عليك مرة ملائكة، ما عاد فيه! قال: ما في ملائكة. طيب، والقرآن مليء باسم الملائكة؟ قال: الملائكة في القرآن والسنة معناها قوى الخير في الإنسان. قوى الخير في الإنسان! طيب والشياطين؟ قال: الشياطين هل ندركهم بعقولنا؟ الجواب: لا. طيب، أنا ما أؤمن إلا بما أدركه بعقلي وأراه بعيني، لا تقل لي غيبيات، أنا ما عندي غيبيات. في أشياء محسوسة أدركها أهلاً وسهلاً، ما أراها ما أؤمن بها. هؤلاء هم العقلانيون الذين لا يؤمنون إلا بالأشياء المحسوسة. ولذلك قالوا: إذن ما في شياطين. وإبليس مبسوط عليهم هم، عطّلوا الشياطين. قالوا: شياطين ما في، وملائكة ما في. طيب يا معشر الجن والإنس، شياطين الإنس والجن، شو نسوي بهذه الآيات؟ قالوا: الشياطين في الكتاب والسنة معناها قوى الشر في الإنسان، فقوى الخير هم الملائكة وقوى الشر هي الشياطين. شوف كيف! وسبب هذا الضلال ما هو؟ أنهم حاولوا بعقولهم استكشاف ما وراء الغيب.", "هذا خطر جداً يا إخواني! ما أقول: عطّل عقلك ولُفّه في كيس نايلون ولا تفكر، لا، فكّر وأبدع بعقلك، لكن ما وراء الغيب من المسائل العقدية مما أخفاه الله عنا، إياك ثم إياك أن تسمح لعقلك أن يسبح فيه، فإنه لن يرجع بشيء، انتبه، بل سيرجع لك بالضلال."], "fr": ["Si tu dis : « Ces deux principes suffisent-ils ? » Je réponds : non, il faut aussi le troisième principe. Il est la perfection de ces principes, leur beauté, leur couronne, leur fruit et la condition de sécurité en eux. Quel est-il ? Dis-le simplement : ne pas faire entrer nos raisons dans les affaires de l&#x27;invisible (al-ghayb). Ne pas lancer nos raisons dans ce qui est au-delà de l&#x27;invisible.", "Prends garde à cette raison ! Écoutez-moi, je vous en prie : lorsque Dieu a créé cette raison, Il a donné à ce qu&#x27;elle perçoit des limites et des capacités. Sa pensée reste saine tant qu&#x27;elle est dans ses limites et ses capacités. Mais dès que tu la fais sortir et que tu veux, par elle, explorer une affaire hors des limites de ses capacités, elle ne te reviendra qu&#x27;avec la déception, la perplexité, l&#x27;errance, les doutes, les illusions, les imaginations et les croyances vaines.", "Ils disent : donne un exemple. Eh bien, prenons le téléphone portable : que la raison soit comme un portable. Le portable a une zone de réception ; sa réception est bonne tant qu&#x27;il est dans cette zone. Mais si tu le sors et pars dans le désert, hors de sa zone de réception, recevra-t-il quoi que ce soit ? Ce n&#x27;est qu&#x27;un morceau de fer sans utilité ! Un homme meurt dans le désert avec son portable caché sur lui : personne ne peut l&#x27;appeler, et lui ne peut appeler personne. Ainsi est la raison : lorsque Dieu l&#x27;a créée, Il lui a donné une zone de réception, qui est l&#x27;ensemble des choses visibles et perceptibles. Mais Dieu a caché à cette raison de nombreux mondes invisibles, et Il a fait partie de la croyance que nous croyions à ces choses invisibles.", "Or certaines gens veulent, par leur raison, explorer ces choses invisibles ; s&#x27;ils n&#x27;en trouvent aucune trace, ils reviennent et y mécroient. Beaucoup de gens ont mécru aux anges. Pourquoi ? Parce que leur raison ne les a pas atteints : « Où sont-ils, les anges, les gars ? Où sont-ils ? Nous ne les voyons pas, nous ne les percevons pas par nos sens, aucune raison ne les perçoit : il n&#x27;y a donc rien qui s&#x27;appelle un monde d&#x27;anges. » Mais le Coran mentionne les anges ? « Les anges, dans le Coran et la Sunna, signifient les forces du bien chez l&#x27;homme. » Et les diables ? « Les percevons-nous par nos raisons ? Non. Moi, je ne crois qu&#x27;à ce que ma raison perçoit et que je vois de mes yeux. Ne me parle pas d&#x27;invisible, je n&#x27;ai pas d&#x27;invisible. Les choses perceptibles, bienvenue ; ce que je ne vois pas, je n&#x27;y crois pas. » Voilà les rationalistes, qui ne croient qu&#x27;aux choses perceptibles. C&#x27;est pourquoi ils ont dit : il n&#x27;y a pas de diables. Et Iblis est ravi d&#x27;eux : ils ont suspendu les diables, ils ont dit : pas de diables et pas d&#x27;anges.", "Bon, ô assemblée des djinns et des hommes, que faire de ces versets sur les diables des hommes et des djinns ? Ils disent : « Les diables, dans le Livre et la Sunna, signifient les forces du mal chez l&#x27;homme. Les forces du bien, ce sont les anges, et les forces du mal, ce sont les diables. » Voyez comment, et quelle est la cause de cet égarement : ils ont essayé, par leurs raisons, d&#x27;explorer ce qui est au-delà de l&#x27;invisible.", "C&#x27;est très dangereux, mes frères. Je ne dis pas : désactive ta raison, enveloppe-la dans un sac plastique et ne réfléchis pas. Non : réfléchis, et crée avec ta raison. Mais ce qui est au-delà de l&#x27;invisible dans les questions de croyance, de ce que Dieu nous a caché, prends garde, et encore prends garde, à permettre à ta raison d&#x27;y nager : elle n&#x27;en reviendra avec rien. Attention : elle te reviendra avec l&#x27;égarement."]}, {"id": "p3b", "g": "الأصل الثالث: عدم إقحام العقل في الغيب", "gf": "Troisième principe : ne pas plonger la raison dans l'invisible", "ta": "نماذج من إنكار الغيب بالعقل", "tf": "Exemples de négation de l'invisible par la raison", "ar": ["ولذلك فتحوا قبر الكافر لم يجدوا فيه عذاباً، فتحوا قبر المؤمن لم يجدوا فيه نعيماً، لم يدركوه بعقولهم، إذن أنكرنا عذاب القبر! روح! طيب، يأجوج ومأجوج والسد وذو القرنين؟ قالوا: يا شيخ، وينك عن جوجل إيرث؟ كل نقطة في الأرض سجّلها، لا شفنا لا يأجوج ولا ماجوج ولا السد. طيب، الحل يا الربع؟ أنكرها! الله الله الله! طيب، وغيره وكلها روح أنكروا: الملائكة أنكروا، الرسل أنكروا، الجنة أنكروا، النار أنكروا، وجود الله أنكروا، أسماءه أنكروا، صفاته أنكروا. سببه أنهم حاولوا بعقولهم الصغيرة ذات الإدراك العاجز المحدود أن يستكشفوا ما أخفاه الله عز وجل من الغيب. هذا خطير على عقيدتنا، ترى! انتبهوا! كل من ضل إنما سبب ضلاله قد يكون هو محاولة إقحام العقل في هذا.", "اسمعوا ماذا يقول الأشاعرة، نص كلامهم كذا. يقولون: لو أثبتنا أن الله استوى... يا إخواني، والله اسمحوا لي أقول هذا الكلام، بس أبي أضرب لكم مثالاً، وإلا والله قلوبنا ما تطيق هذا الكلام لأنه سخرية بالله، لكن اسمعوا ماذا يقولون. يقولون: نحن ننكر الاستواء على العرش. ليه؟ قالوا: عقولنا ما تسمح بإثباته. يا شيخ، كيف ما تسمح بإثباته؟ قال: لو أن الله استوى على العرش لاستلزم ذلك أن يكون هو محتاجاً للعرش، ولاستلزم ذلك أننا لو أبعدنا العرش عن الله لسقط الرب. إذن ماذا نفعل؟ ماذا يفعلون؟ أنكروا صفة الاستواء! سبع آيات من القرآن يثبت الله فيها أنه استوى، أنكروها! وسبب إنكارها أنهم حاولوا بعقولهم استكشاف كيفية هذا الاستواء. ولو أنهم سلّموا للدليل وأذعنوا له وقبلوا ما جاءهم عن الله ورسوله وقالوا: آمنا وصدقنا وسمعنا وأطعنا وأذعنّا ــ ﴿فلا وربك لا يؤمنون حتى يحكموك فيما شجر بينهم ثم لا يجدوا في أنفسهم حرجاً مما قضيت ويسلموا تسليماً﴾. احذروا من هذا العقل! لا تُدخلوه فيما أخفاه الله من عوالم الغيب."], "fr": ["C&#x27;est pourquoi ils ont ouvert la tombe de l&#x27;infidèle sans y trouver de châtiment, ils ont ouvert la tombe du croyant sans y trouver de félicité : ils ne l&#x27;ont pas perçu par leurs raisons, donc nous nions le châtiment de la tombe. Allez ! Et Gog et Magog, et le rempart de Dhû l-Qarnayn ? Ils disent : « Cheikh, où en es-tu avec Google Earth ? Chaque point de la terre y est enregistré. Nous n&#x27;avons vu ni Gog, ni Magog, ni le rempart. » Alors la solution, les gars ? Nie-les ! Quelle horreur… Et tout le reste : ils ont nié les anges, nié les messagers, nié le Paradis, nié l&#x27;Enfer, nié l&#x27;existence de Dieu, nié Ses noms, nié Ses attributs. La cause : ils ont voulu, par leurs petites raisons à la perception faible et limitée, explorer ce que Dieu, le Puissant et Majestueux, a caché de l&#x27;invisible. C&#x27;est dangereux pour notre croyance, faites attention.", "Tout égaré, la cause de son égarement peut bien être la tentative d&#x27;introduire la raison dans cela. Écoutez ce que disent les Acharites, voici leurs propres termes. Ils disent, à propos de l&#x27;établissement (istiwâ&#x27;) de Dieu : — frères, pardonnez-moi de dire cela, je ne le fais que pour donner un exemple, car autrement nos cœurs ne supportent pas ces paroles, qui sont une moquerie envers Dieu — mais écoutez ce qu&#x27;ils disent. Ils disent : nous nions l&#x27;établissement sur le Trône. Pourquoi ? Ils disent : nos raisons ne permettent pas de l&#x27;affirmer. « Cheikh, comment cela ? » Ils disent : si Dieu s&#x27;était établi sur le Trône, cela impliquerait qu&#x27;Il a besoin du Trône, et que si nous éloignions le Trône de Dieu, le Seigneur tomberait. Alors que font-ils ? Ils nient l&#x27;attribut de l&#x27;établissement : sept versets du Coran où Dieu affirme qu&#x27;Il s&#x27;est établi, ils les nient. Et la cause de leur négation : ils ont voulu, par leurs raisons, explorer la modalité de cet établissement.", "S&#x27;ils s&#x27;étaient soumis à la preuve, s&#x27;étaient inclinés devant elle et avaient accepté ce qui leur est venu de Dieu et de Son Messager, en disant : « Nous avons cru, nous avons déclaré véridique, nous avons entendu et obéi, nous nous soumettons »… « Non, par ton Seigneur ! Ils ne croiront pas tant qu&#x27;ils ne t&#x27;auront pas pris pour juge de leurs différends, puis ne ressentiront dans leurs cœurs aucune gêne de ce que tu auras décidé, et ne se soumettront pleinement. » Gardez-vous de cette raison : ne l&#x27;introduisez pas dans ce que Dieu a caché des mondes de l&#x27;invisible."]}, {"id": "p3c", "g": "الأصل الثالث: عدم إقحام العقل في الغيب", "gf": "Troisième principe : ne pas plonger la raison dans l'invisible", "ta": "عالم الغيب أكبر من عالم الشهادة", "tf": "L'invisible est plus vaste que le visible", "ar": ["فإن قلتَ: أيهما أكبر، عالم الشهادة ولا عالم الغيب؟ أقول: يا أخي، عالم الشهادة إنما هو قطرة في بحر عالم الغيب. عالم الشهادة إنما ترى أنت الأرض والغلاف الجوي والنجوم، لكن هذه قطرة في بحر هذا الكون الذي أخفاه الله عز وجل عنك. ولذلك الله دائماً يبدأ بالإيمان بعلمه بالغيب، قال: ﴿عالم الغيب والشهادة﴾، يبدأ الله به دائماً لأن الغيب أكبر مما ترونه أيها الناس. بل يكفيك أن من الغيب كرسيَّ الله عز وجل: ﴿وسع كرسيه السماوات والأرض﴾. لا تُدخل عقلك: ما هو الكرسي؟ موضع قدمي الرب على ما يليق بجلاله وعظمته. هذا الكرسي يقول النبي صلى الله عليه وسلم فيه: ما السماوات السبع والأرضون السبع بالنسبة للكرسي، الذي هو موضع القدمين، بس، إلا كحلقة ألقيت في صحراء.", "عالم الغيب أكبر يا جماعة، عالم الغيب أكبر! عقلك ذا صغير، لا تحمّله أن يستكشف عالم الغيب، ترى والله بيضيع عقلك وبيجيب لك العقائد الفاسدة الضالة. ولذلك سبب نجاة أهل السنة أنهم يسلّمون للدليل، ما يدخلون بعقولهم في مسائل الغيب. آمنوا بالملائكة: آمنا. وينهم؟ وين مستقرهم؟ كيف حقيقتهم؟ لماذا لا نراهم؟ مالي دخل! الله قال لي: آمن، آمنت، بس خلاص، لا تدخلني في غيرها.", "هذا مثل قصة المصري، الشاب المصري ذاك، تسمعون بها: لما جاءهم مستشرق وقال: أتؤمنون بهذا الباب؟ قالوا: نعم. قال: لماذا تؤمنون به؟ قالوا: لأننا نراه. قال: أتؤمنون بهذا المصباح؟ قالوا: نعم. قال: لماذا تؤمنون به؟ قالوا: لأننا نراه. قال: أتؤمنون بالطاولة، بالكرسي، بالأرض، بالجدران، بالنوافذ؟ قالوا: نعم. قال: علة إيمانكم بها؟ قالوا: لأنا نراها. قال: طيب، هل تؤمنون بالله؟ قالوا: نعم. قال: كيف، ونحن أنتم لا ترونه؟ هذه حجته. فقام شاب مصري في مؤخرة القاعة، قال: يا أستاذ، يا دكتور، يا فخامة الدكتور! دكتور، أأنت لك عقل؟ هل تريد مني أن أؤمن بأن لك عقلاً يا دكتور؟ قال: نعم. قال: أرني عقلك، أنا ما أرى عقلك، أنا أرى جمجمة وعيوناً وأنفاً وأذنين، وين عقلك؟ قال: هنا. قال: وينه؟ عطني إياه، طلّعه! أنا ما... إذن أنت مجنون يا دكتور، ولا عقل لك، والمجنون لا يقبل كلامه.", "لأنه ليس طريق الإيمان هو المشاهدة فقط؛ لا، المشاهدة طريق واحد من طرق الإيمان، لكن هناك طريق آخر وهو طريق الوحي. فكل ما أخبرك به الوحي من الغيب فيجب عليك أن تؤمن به، سواء أدركته بعينك أو لم تدركه، أدركته ببصرك أو لم تدركه، أدركته بعقلك أو لم تدركه؛ لا شأن لك بذلك كله، لأن الذي أخبرك بهذا الأمر الغيبي هو الله، ومن أصدق من الله قيلاً، ومن أصدق من الله حديثاً."], "fr": ["Si tu dis : lequel est le plus grand, le monde du visible ou le monde de l&#x27;invisible ? Je dis : mon frère, le monde du visible n&#x27;est qu&#x27;une goutte dans la mer du monde de l&#x27;invisible. Du monde du visible, tu vois la terre, l&#x27;atmosphère, les étoiles ; mais ce n&#x27;est qu&#x27;une goutte dans la mer de cet univers que Dieu t&#x27;a caché. C&#x27;est pourquoi Dieu commence toujours par la mention de Sa science de l&#x27;invisible : « Connaisseur de l&#x27;invisible et du visible ». Dieu commence toujours par lui parce que l&#x27;invisible est plus grand que ce que vous voyez, ô gens. Il te suffit que fasse partie de l&#x27;invisible l&#x27;Escabeau (al-kursî) de Dieu, le Puissant et Majestueux : « Son Escabeau embrasse les cieux et la terre. » N&#x27;introduis pas ta raison : qu&#x27;est-ce que l&#x27;Escabeau ? C&#x27;est le lieu où se posent les deux pieds du Seigneur, d&#x27;une manière qui convient à Sa majesté et à Sa grandeur. Le Prophète (que Dieu le bénisse et le salue) dit de cet Escabeau que les sept cieux et les sept terres, comparés à l&#x27;Escabeau qui est le lieu des deux pieds, ne sont qu&#x27;un anneau jeté dans un désert.", "Le monde de l&#x27;invisible est plus vaste, mes frères ; ta raison est petite : ne la charge pas d&#x27;explorer le monde de l&#x27;invisible. Par Dieu, ta raison se perdra et te rapportera les croyances corrompues et égarées. C&#x27;est pourquoi la cause du salut des gens de la Sunna est qu&#x27;ils se soumettent à la preuve et n&#x27;entrent pas, avec leurs raisons, dans les questions de l&#x27;invisible. Ils ont cru aux anges : nous avons cru. Où sont-ils ? Où est leur demeure ? Quelle est leur réalité ? Pourquoi ne les voyons-nous pas ? Cela ne me regarde pas. Dieu m&#x27;a dit : crois ; j&#x27;ai cru, c&#x27;est tout. Ne m&#x27;entraîne pas dans autre chose.", "C&#x27;est comme l&#x27;histoire du jeune Égyptien, vous en avez entendu parler : un orientaliste vint à eux et dit : « Croyez-vous à cette porte ? » Ils dirent : « Oui. » Il dit : « Pourquoi y croyez-vous ? » Ils dirent : « Parce que nous la voyons. » Il dit : « Croyez-vous à cette lampe ? » « Oui. » « Pourquoi ? » « Parce que nous la voyons. » « Croyez-vous à la table, à la chaise, au sol, aux murs, aux fenêtres ? » « Oui. » « La cause de votre foi en elles ? » « Que nous les voyons. » « Bien. Croyez-vous en Dieu ? » « Oui. » « Comment, alors que vous ne Le voyez pas ? » Voilà son argument.", "Un jeune Égyptien se leva alors au fond de la salle et dit : « Monsieur, docteur, Votre Excellence le docteur, as-tu un esprit (raison) ? » — « Veux-tu que je croie que tu as un esprit, docteur ? » — « Oui. » — « Montre-moi ton esprit : je ne le vois pas. Je vois un crâne, des yeux, un nez, deux oreilles ; où est ton esprit ? » — « Ici. » — « Où ? Sors-le-moi. Alors tu es fou, docteur, tu n&#x27;as pas d&#x27;esprit ; et le fou, sa parole n&#x27;est pas acceptée. »", "Car la voie de la foi n&#x27;est pas la seule vision : la vision est l&#x27;une des voies de la foi, mais il y a une autre voie, la voie de la Révélation. Tout ce que la Révélation t&#x27;annonce de l&#x27;invisible, tu dois y croire, que tu l&#x27;aies perçu de tes yeux ou non, de ta vue ou non, de ta raison ou non ; cela ne te regarde pas, car Celui qui t&#x27;a informé de cette affaire invisible est Dieu, et qui est plus véridique que Dieu en parole, qui est plus véridique que Dieu en discours ?"]}, {"id": "p3d", "g": "الأصل الثالث: عدم إقحام العقل في الغيب", "gf": "Troisième principe : ne pas plonger la raison dans l'invisible", "ta": "خلاصة الأصول الثلاثة والإيمان بالغيب قبل الشهادة", "tf": "Synthèse des trois principes et foi en l'invisible", "ar": ["هذه الأصول الثلاثة يا جماعة، أرجوكم! سني سلفي اللي بيدين بهذه الأصول. أغلب ضلال الناس، كل ضلال الناس، حتى الكفار، كل من ضل على وجه هذه الأرض: إما أنه لم يأخذ من الكتاب والسنة، أو أنه لم يفهم الكتاب والسنة على فهم سلف الأمة، أو أنه حاول أن يُدخل عقله الضعيف في تكييف أو بيان حقيقة شيء مما أخفاه الله عز وجل عنه. إذن هذه ثلاثة أصول هي أصول الاعتقاد الصحيح. تبقى التفاصيل والعقائد هذه لها طلبة العلم. المهم الآن أن العامة والشباب لا بد أن يُغرز في قلوبهم هذه الأصول الثلاثة، وهي: أولاً: ألّا نأخذ معتقداتنا إلا من الكتاب والسنة. اثنين: ألّا نفهم الكتاب والسنة في مسائل الاعتقاد إلا على فهم سلف الأمة. ثلاثة: ألّا نخوض بعقولنا فيما وراء الغيب.", "عقيدتنا مبنية على غيبيات ولا لا؟ عقيدتنا مبنية على الإيمان بالله، والإيمان به من الغيب؛ عقيدتنا مبنية على الإيمان بأسمائه وصفاته وهي من الغيب؛ عقيدتنا مبنية على الإيمان بالملائكة وكتبه ورسله واليوم الآخر والقدر واللوح المحفوظ وعذاب القبر ونعيمه، وكلها إيش؟ أمور غيبية. ولذلك لا يكلّفك الله أن تؤمن إلا بما هو غيبي؛ لكن بعد ظهور هذا الأمر الغيبي تؤمن بعدها، ما ينفعك إيمانك.", "الله أمرنا أن نؤمن بيوم القيامة، ومن الناس من يتأخر إيمانه حتى تقوم الساعة، ﴿لا ينفع نفساً إيمانها﴾. الآن أنت مطلوب يوم أنها غيب، لكن عقب ما شفتها توّك بتؤمن؟ ما تنفع! ﴿لا ينفع نفساً إيمانها لم تكن آمنت من قبل أو كسبت في إيمانها خيراً﴾. أنت مأمور بالإيمان بأن الشمس ستطلع من مغربها يوماً من الأيام؛ كثير من الناس سيتأخر إيمانه حتى يراها، بعدها ما ينفع، ما ينفع. ﴿يا ليتنا نُرد ولا نكذب بآيات ربنا﴾ بعد أن شاهدوا وعاينوا حقيقة الأمور الغيبية التي كانوا يؤمرون بالإيمان بها؛ بعد مشاهدتها انقلبت من كونها غيباً إلى شهادة، ثم ماذا؟ ما عاد ينفع الإيمان، خلاص. يوم صارت شهادة تؤمنون! أنا لا أطالبك أن تؤمن بأن في يدي ماءً لأنك تشاهده، كيف أطالبك بالإيمان به؟ لكن أطالبك أن تؤمن بأن لي بيتاً في الدلم لأنه أمر غيبي أنت ما تشاهده. الإيمان النافع هو الإيمان بالأمور الغيبية قبل أن تكون مشاهدة؛ فبعد مشاهدتها سوف يؤمن الجميع، ولكنه ساعة لا ينفع أحداً إيمانه."], "fr": ["Ces trois principes, les gars, je vous en prie. Le sunnite salafi qui professe ces principes… La plus grande part de l&#x27;égarement des gens, tout l&#x27;égarement des gens, même les mécréants, quiconque s&#x27;est égaré sur la surface de cette terre : soit il n&#x27;a pas pris du Livre et de la Sunna, soit il n&#x27;a pas compris le Livre et la Sunna selon la compréhension des salaf de la communauté, soit il a tenté d&#x27;introduire sa raison faible dans la modalité ou l&#x27;exposé de la réalité de ce que Dieu, le Puissant et Majestueux, lui a caché. Voilà donc les trois principes de la croyance correcte. Restent les détails des croyances, qui sont l&#x27;affaire des étudiants en sciences religieuses. L&#x27;essentiel, c&#x27;est qu&#x27;il faut graver ces trois principes dans le cœur des gens du commun et des jeunes : premièrement, ne prendre nos croyances que du Livre et de la Sunna ; deuxièmement, ne comprendre le Livre et la Sunna en matière de croyance que selon la compréhension des salaf de la communauté ; troisièmement, ne pas plonger avec nos raisons dans ce qui est au-delà de l&#x27;invisible.", "Notre croyance est-elle fondée sur l&#x27;invisible, oui ou non ? Notre croyance est fondée sur la foi en Dieu, et la foi en Lui relève de l&#x27;invisible ; notre croyance est fondée sur la foi en Ses noms et Ses attributs, qui relèvent de l&#x27;invisible ; notre croyance est fondée sur la foi aux anges, aux livres, aux messagers, au Jour dernier, au destin, à la Tablette préservée, au châtiment et à la félicité de la tombe : toutes sont des affaires invisibles. C&#x27;est pourquoi Dieu ne te charge de croire qu&#x27;à l&#x27;invisible ; mais lorsque cette chose invisible est apparue, si tu y crois alors, ta foi ne te sert plus.", "Dieu nous a ordonné de croire au Jour de la résurrection. Certains retardent leur foi jusqu&#x27;à ce que l&#x27;Heure se lève : alors « sa foi ne profitera pas à une âme ». Aujourd&#x27;hui, on te demande de croire parce que c&#x27;est invisible ; mais après l&#x27;avoir vue, tu ne feras que croire sans que cela ne serve : « sa foi ne profitera pas à une âme qui n&#x27;avait pas cru auparavant ou qui n&#x27;avait pas acquis de bien par sa foi ». Tu es ordonné de croire que le soleil se lèvera un jour de son couchant ; beaucoup de gens retarderont leur foi jusqu&#x27;à ce qu&#x27;ils le voient, et après cela cela ne servira plus. « Ah ! si l&#x27;on nous renvoyait, nous ne traiterions pas de mensonge les versets de notre Seigneur ! » Ils auront vu et constaté la réalité des choses invisibles auxquelles on leur ordonnait de croire ; après leur observation, elles sont passées de l&#x27;invisible au visible, et alors la foi ne sert plus : le jour où elles sont devenues observables, vous croyez. Je ne te demande pas de croire que j&#x27;ai de l&#x27;eau dans la main, car tu la vois : comment te demander d&#x27;y croire ? Mais je te demande de croire que j&#x27;ai une maison à ad-Dilam, car c&#x27;est une affaire invisible que tu ne vois pas. La foi utile est la foi aux affaires invisibles avant qu&#x27;elles soient observées ; après leur observation, tous croiront, mais à l&#x27;heure où la foi ne profite à personne."]}, {"id": "p3e", "g": "الأصل الثالث: عدم إقحام العقل في الغيب", "gf": "Troisième principe : ne pas plonger la raison dans l'invisible", "ta": "وصية للدعاة: العبرة بالكيف لا بالكم", "tf": "Conseil aux prédicateurs : la qualité, non la quantité", "ar": ["يقول النبي صلى الله عليه وسلم: «لا تقوم الساعة حتى يُرفع العلم ويظهر الجهل». وهذا دليل على كثرة انشغال الناس بأمورهم الخاصة الدنيوية أو العامة؛ ولكن لو أنها كانت محاضرة قصص، أو رجل سيضرب لهم قصصاً من نسج خياله أو من واقعه، فلربما رأيت المسجد قد امتلأ، وهذا يدل على ضعف التأصيل العلمي في كثير من الناس.", "ولذلك لا تيأسوا يا طلبة العلم من قلة الحاضرين عندكم، ولا يدخل قلوبكم شيء من القنوط من واقع الناس؛ بل على الإنسان أن يبذل وأن يقدّم وأن يجتهد ولو لم يحضر عنده إلا واحد، ولا ندري عن البركة في أي طالب ستكون. وإن المتقرر في قواعد أهل السنة والجماعة أن العبرة بالكيف لا بالكم. ولذلك قد طلب العلم على أبي العباس بن تيمية رحمه الله تعالى أشخاص كثر، وطلب كثر، ولكن لم ينتفع ابن تيمية في نشر علمه كما انتفع بابن القيم رحمه الله تعالى. فإذن لا تدري عن أي طلابك فيه البركة؛ فعلى الإنسان أن يبذل ولا ينتظر النتائج. وعلى الداعية أن يدل الناس على الخير ولا شأن له في أن يستمعوا هم هذا الخير أو يتقبلوه أو يمتثلوه، ﴿إن عليك إلا البلاغ﴾. وهذا ليس من شأن الدعاة بل من شأن كثير من الأنبياء؛ يقول النبي صلى الله عليه وسلم: «ويأتي النبي ومعه الرجل والرجلان، ويأتي النبي وليس معه أحد». فهل هذا دليل على أن هذا النبي قصّر في جوانب دعوته؟ الجواب: لا، ولكن الناس لم يستجيبوا.", "وأجمع العلماء على أن الهداية التي يملكها الداعية إنما هي هداية الدلالة والإرشاد فقط، وأما هداية التوفيق والإلهام فإنها إلى من؟ إلى الله عز وجل. فأنا أوصي نفسي وأوصي معاشر الدعاة أن يقدموا ما يستطيعونه للناس، وألّا يبخلوا على أمة محمد صلى الله عليه وسلم بكلمة يقولونها لله؛ فلعل هذه الكلمة تنقذ أمة وتنقذ أجيالاً قادمة، والإنسان في حال قولها لم يسمعه إلا واحد. فلا شأن لك بالناس؛ والله عز وجل لن يسألك يوم القيامة: لم لم يحضر عندك الناس؟ لم لم يجتمع الناس في محاضرتك؟ وإنما سيسألك عن العلم الذي شرح الله صدرك له وعلّمك إياه: لم لم تعلّمه للناس؟"], "fr": ["Le Prophète (que Dieu le bénisse et le salue) dit : « L&#x27;Heure ne viendra pas avant que la science soit enlevée et que l&#x27;ignorance apparaisse. » C&#x27;est une preuve de la multitude d&#x27;occupations des gens à leurs affaires particulières, mondaines ou générales. Mais s&#x27;il s&#x27;agissait d&#x27;une conférence de récits, ou d&#x27;un homme qui raconterait des histoires nées de son imagination ou de la réalité, tu verrais peut-être la mosquée pleine. Cela montre la faiblesse de l&#x27;enracinement scientifique chez beaucoup de gens.", "C&#x27;est pourquoi ne désespérez pas, étudiants en sciences religieuses, du petit nombre de ceux qui assistent chez vous, et que rien du découragement n&#x27;entre dans vos cœurs à cause de la réalité des gens. Bien plus, l&#x27;homme doit donner, offrir et s&#x27;efforcer, même s&#x27;il n&#x27;y a chez lui qu&#x27;un seul auditeur : nous ne savons pas chez lequel de ses élèves sera la bénédiction. Il est établi dans les règles des gens de la Sunna et de la communauté que ce qui compte est la qualité, non la quantité. Ainsi, de nombreuses personnes ont étudié auprès d&#x27;Ibn Taymiyya, que Dieu lui fasse miséricorde, et beaucoup ont demandé la science, mais Ibn Taymiyya n&#x27;a pas tiré pour la diffusion de sa science le profit qu&#x27;il a tiré d&#x27;Ibn al-Qayyim, que Dieu lui fasse miséricorde. Tu ne sais donc pas chez lequel de tes élèves est la bénédiction : l&#x27;homme doit donner sans attendre de résultats. Le prédicateur doit indiquer aux gens le bien, et il n&#x27;a pas à s&#x27;occuper de savoir s&#x27;ils l&#x27;écoutent, l&#x27;acceptent ou le mettent en pratique : « Il ne t&#x27;incombe que la transmission. » Et cela n&#x27;est pas le propre des prédicateurs : c&#x27;est le cas de beaucoup de prophètes. Le Prophète (que Dieu le bénisse et le salue) dit : « Un prophète viendra avec lui… un homme ou deux hommes, et un prophète viendra et il n&#x27;aura personne avec lui. » Est-ce une preuve que ce prophète a failli dans quelque aspect de sa prédication ? Non, mais les gens n&#x27;ont pas répondu.", "Les savants sont unanimes que la guidée que possède le prédicateur est seulement la guidée d&#x27;indication et de direction ; quant à la guidée d&#x27;assistance et d&#x27;inspiration, elle appartient à qui ? À Dieu, le Puissant et Majestueux. Je me recommande donc à moi-même, et je recommande aux prédicateurs de donner aux gens ce qu&#x27;ils peuvent, et de ne pas être avares envers la communauté de Muhammad (que Dieu le bénisse et le salue) d&#x27;une parole qu&#x27;ils disent pour Dieu : peut-être cette parole sauvera-t-elle une communauté et des générations à venir, alors même qu&#x27;au moment de la dire, un seul l&#x27;a entendue. Ne te soucie pas des gens : Dieu, le Puissant et Majestueux, ne te demandera pas au Jour de la résurrection : « Pourquoi les gens n&#x27;ont-ils pas assisté chez toi ? Pourquoi ne se sont-ils pas réunis à ta conférence ? » Il te demandera au sujet de la science dont Il a ouvert ta poitrine et qu&#x27;Il t&#x27;a enseignée : pourquoi ne l&#x27;as-tu pas enseignée aux gens ?"]}, {"id": "k0", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "مقدمة الخصائص: تعريفها ومن هم أهل السنة", "tf": "Introduction : définition des caractéristiques, qui sont les gens de la Sunna", "ar": ["موضوع محاضرتنا أيها الأحباب عن خصائص أهل السنة والجماعة رحمهم الله تعالى. فإن قلتَ: وما معنى خصائص؟ فأقول: هو جمع مفرده خصيصة، وهي تلك المميزات التي تميّز بها أهل السنة والجماعة عن غيرهم من سائر الفرق. فإن قلتَ: ومن أهل السنة والجماعة؟ فأقول: هم الذين اجتمعوا على الأخذ بكتاب الله عز وجل وسنة رسوله صلى الله عليه وسلم باطناً وظاهراً، في الأقوال والاعتقادات والأعمال. فإذا كان الإنسان مقبلاً في اعتقاده على الكتاب والسنة فإنه من أهل السنة والجماعة، ومن الفرقة الناجية والطائفة المنصورة.", "فإن قيل لك: وما الذي يجعلنا نهتم بالتعرف على خصائص مذهب أهل السنة والجماعة في هذا الزمان؟ فأقول: ذلك لخفاء كثير من الحق عند قلوب كثير من الناس، ولوجود الخلط بين أهل السنة والجماعة ومن عداهم من أهل البدع؛ فإن كثيراً من الناس ليس عنده الفرقان الذي يستطيع به التمييز بين السني والصوفي، أو السني والبدعي، أو السني والأشعري، حتى أصبح كثير من الطوائف تدّعي أنها هي أهل السنة والجماعة. ولذلك مع خفاء الحق والتباس الأمور وضعف العلم نحتاج إلى معرفة الفرقان الذي به نستطيع أن نفرّق بين الحق والباطل، وبين الهدى والضلال، وبين المقبول من المردود، وبين المتبع من المبتدع. وهذا فرقان من آتاه الله عز وجل إياه فقد أراد الله عز وجل به خيراً كثيراً.", "ولذلك لما سُلب هذا الفرقان عند كثير من الأمم الماضية لم يستطيعوا أن يتعرفوا الفرقان بين الرسول والكاهن، والكاهن والرسول، والرسول والشاعر؛ فيأتيهم الرسول بالآيات البينات فيشتبه عليهم الأمر ويختلط، ثم يقولون: هذا ساحر، هذا كاهن، هذا شاعر. ﴿ومن لم يجعل الله له نوراً فما له من نور﴾. فنحن في هذا الزمن على وجه الخصوص أحوج ما نحتاج إلى أن نتعرف على تلك الأصول والقواعد والخصائص والمميزات التي إذا رأيناها منطبقة في شخص عرفنا أنه من أهل السنة والجماعة، وإذا رأينا الشخص يدعو إلى غيرها ويحثّ الناس على انتهاج أصول غيرها عرفنا أنه من دعاة الفتنة والبدع. إذن هذا من الفرقان الذي يجب على العلماء وعلى طلبة العلم أن يبينوه للناس.", "وتأتينا أسئلة كثيرة: فلان هل هو من أهل السنة أو عنده شيء من المخالفات؟ طيب، أنت أليس عندك أنت بنفسك الفرقان حتى تعرف من أحوال هذا الرجل ومن محاضراته ومن كلامه ما تستطيع أن تدخله تحت إحدى الطائفتين؟ إذا لم يكن عندك هذا الفرقان فهذه مشكلة خطيرة، ويزداد الخطر إذا كان السائل من المنتسبين للعلم؛ إذن كيف تكون عالماً وليس عندك فرقان في هذا؟"], "fr": ["Le sujet de notre conférence, chers amis, porte sur les caractéristiques (al-khaçâ&#x27;iç) des gens de la Sunna et de la communauté, que Dieu leur fasse miséricorde. Si tu dis : que signifie « caractéristiques » ? Je dis : c&#x27;est le pluriel de « khaçîça », ces traits distinctifs par lesquels les gens de la Sunna et de la communauté se distinguent des autres, de toutes les autres sectes.", "Si tu dis : qui sont les gens de la Sunna et de la communauté ? Je dis : ce sont ceux qui se sont unis dans l&#x27;adoption du Livre de Dieu, le Puissant et Majestueux, et de la Sunna de Son Messager (que Dieu le bénisse et le salue), intérieurement et extérieurement, dans les paroles, les croyances et les œuvres. Si donc l&#x27;homme se tourne, dans sa croyance, vers le Livre et la Sunna, il est des gens de la Sunna et de la communauté, de la secte sauvée et du groupe secouru.", "Si l&#x27;on te dit : qu&#x27;est-ce qui nous fait nous intéresser, à notre époque, à la connaissance des caractéristiques de la voie des gens de la Sunna et de la communauté ? Je dis : c&#x27;est le fait que la vérité reste cachée à beaucoup de cœurs, et qu&#x27;il existe une confusion entre les gens de la Sunna et de la communauté et les autres gens d&#x27;innovation. Beaucoup de gens n&#x27;ont pas le critère de discernement (al-furqân) qui leur permettrait de distinguer entre le sunnite et le soufi, le sunnite et l&#x27;innovateur, le sunnite et l&#x27;acharite, au point que beaucoup de sectes prétendent être les gens de la Sunna et de la communauté.", "C&#x27;est pourquoi, avec la dissimulation de la vérité, la confusion des affaires et la faiblesse de la science, nous avons besoin de connaître ce critère de discernement par lequel nous pouvons distinguer entre la vérité et le faux, la guidée et l&#x27;égarement, l&#x27;accepté et le rejeté, celui qui suit et l&#x27;innovateur. Ce critère, celui à qui Dieu le donne, Dieu lui a voulu un grand bien. Lorsqu&#x27;il a été retiré à beaucoup de nations passées, elles n&#x27;ont pas pu distinguer entre le messager et le devin, le devin et le messager, le messager et le poète : le messager leur venait avec les signes évidents, l&#x27;affaire se brouillait pour elles, et elles disaient : c&#x27;est un sorcier, un devin, un poète. « Celui à qui Dieu n&#x27;a pas donné de lumière n&#x27;a pas de lumière. »", "À notre époque en particulier, nous avons le plus grand besoin de connaître ces principes, ces règles, ces caractéristiques et ces traits distinctifs qui, lorsque nous les voyons réunis chez une personne, nous font savoir qu&#x27;elle est des gens de la Sunna et de la communauté ; et lorsque nous voyons une personne appeler à d&#x27;autres principes que ceux-là et exhorter les gens à suivre d&#x27;autres fondements, nous savons qu&#x27;elle est des appelants à la discorde et à l&#x27;innovation. Voilà donc le critère de discernement que les savants et les étudiants en sciences religieuses doivent expliquer aux gens. On nous pose beaucoup de questions : untel est-il des gens de la Sunna, ou a-t-il quelques infractions ? Mais toi-même, n&#x27;as-tu pas ce critère pour connaître, d&#x27;après la situation de cet homme, ses conférences et ses paroles, sous laquelle des deux catégories tu peux le classer ? Si tu n&#x27;as pas ce critère, c&#x27;est un grave problème, et le danger augmente si celui qui pose la question se rattache à la science. Comment peut-on être savant sans avoir de critère en cela ?"]}, {"id": "k00", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "حديث الافتراق: أمة الدعوة وأمة الإجابة", "tf": "Le hadith de la division : communauté d'appel et d'adhésion", "ar": ["فإن قلتَ: وما الذي يعنيه النبي صلى الله عليه وسلم بقوله: «وستفترق أمتي على ثلاث وسبعين فرقة كلها في النار إلا واحدة»؟ فنقول: الجواب: النبي صلى الله عليه وسلم يقصد بالأمة هنا أمة الإجابة لا أمة الدعوة. لأن العلماء قسّموا الأمة إلى قسمين: إلى أمة إجابة وأمة دعوة. أما أمة الدعوة فهم كل الذين... فهم الكفار الأصليون بعد بعثة النبي صلى الله عليه وسلم؛ فمن حين ما بُعث، فالذي لم يدخل في الإيمان به أصلاً هذا يسمى من أمته، ولكن من أمة الدعوة، يعني هم لم يستجيبوا للدعوة أصلاً. وأما الأمة الثانية، القسم الثاني من الأمة، فهم أمة الإجابة، وهم الذين أجابوا النبي صلى الله عليه وسلم وشهدوا أن لا إله إلا الله وأن محمداً رسول الله.", "إذن حديث الافتراق ليس في أمة الدعوة، حديث الافتراق ليس في اليهود في مخالفة اليهود والنصارى والسيخ والهندوس وسائر ملل الكفر؛ لا، حديث الافتراق يتكلم عن افتراق أمة الإجابة في نفسها. ولذلك الثلاث والسبعون فرقة هذه لا شأن لأمة الدعوة بها، وإنما أمة الإجابة، وهم أهل القبلة الذين يشهدون أن لا إله إلا الله وأن محمداً رسول الله، هم الذين سيفترقون على ثلاث وسبعين فرقة.", "فإن قلتَ: ومن الذي ينجو من هذه الفرق؟ فأقول: اثنتان وسبعون فرقة كلها في النار كما أخبر النبي صلى الله عليه وسلم، إلا فرقة واحدة، وهم أهل السنة والجماعة؛ هؤلاء هم الفرقة الناجية. وهذا يؤكد كلامي في أول المحاضرة: نحن نرى أن أمة الدعوة الآن الكفرة أكثر من المسلمين، فإذن أمة الإجابة بالنسبة لأمة الدعوة قليلة؛ أمة الإجابة ستنقسم إلى ثلاث وسبعين فرقة، اثنتان وسبعون كلها في النار وفرقة واحدة هي الناجية؛ إذن الناجون أقل أم الهالكون؟ الجواب: الهالكون أكثر، والناجون أقل؛ وقد كانوا إذا عُدّوا قليلاً فقد صاروا أقل من القليل. فإذن يجب على الإنسان أن يتعرف على الحق وأن يحمد ربه على انشراح صدره لقبوله، ويدعو ربه في سجوده وليله ونهاره أن يثبته على هذا الحق؛ إذ لو قلّبت طرفك من يمين وشمال ورأيت أحوال الناس على الكرة الأرضية لوجدت أن أغلبهم قد سُحب بساط الهداية من تحت أقدامهم فضلوا، وأنت مَنَّ الله عليك بالإسلام وهو أكبر نعمة، ثم أعطاك نعمة أخرى وهي أنك مسلم سني متبع لست بمبتدع، ثم شرح الله صدرك لنعمة ثالثة وهي محبة العلماء ومحبة حضور حلقات الخير ومحبة قراءة الكتب ومحبة اللقاءات الطيبة؛ أليست هذه نعماً تترى من الله عز وجل؟ والله نعم تترى تستحق الشكر؛ ولو بذلنا شكرنا لله عز وجل منذ ولدنا إلى أن تقبض الملائكة أرواحنا لما وافينا شكر جزء من أجزاء عشر نعمة من نعم الله عز وجل. فالحمد لله أولاً وآخراً وظاهراً وباطناً.", "وبعد هذه الإلماحة السريعة يسألنا سائل ويقول: هذه الفرق الثلاث والسبعون، خلافها في أي الأمور؟ الجواب: خلافها في الأمور العقدية، ولا شأن لهذا الحديث المسمى بحديث الافتراق بالأمور الفقهية. الأمور الفقهية هذه لا تدخل في الاختلاف المذموم بشروطه المعروفة عند الفقهاء رحمهم الله، وإنما الافتراق المذموم هو الاختلاف والافتراق في أمور العقائد. فإن قلتَ: وإذا كان الاختلاف يفضي بصاحبه إلى الكفر، أفيدخل الخلاف الكفري في هذه الثلاث والسبعين فرقة؟ الجواب: لا، وإنما الخلاف في هذه الثلاث والسبعين فرقة إنما هو الخلاف الموجب للفسق لا الموجب للكفر. ولذلك أخرج العلماء الرافضة من هذا الحديث لأن البدع التي وقعوا فيها صارت بدعاً كفرية؛ فإذن الرافضة صاروا من أمة الدعوة، ما عادوا من أمة الإجابة. وكذلك أخرج كثير من العلماء من أهل السنة والجماعة المتأخرين أخرجوا الجهمية، كما قال الإمام ابن القيم رحمه الله يحكي عن خمسمائة عالم من أهل السنة أنهم كفّروا الجهمية وأخرجوهم من حديث الافتراق المشهور؛ قال: «ولقد تقلّد كفرَهم خمسمائةٌ من علماء في البلدان». فإذن الجهمية خارجة من حديث الافتراق، أقصد الجهمية أتباع الجهم بن صفوان. فهذا دليل على أن الذي يدخل في هذا الحديث إنما هو من اختلف معنا وابتدع في الدين بدعة لا توجب له الكفر أو الخروج من الملة؛ فانتبهوا لهذا، لأن من ابتدع بدعة توجب كفره وتوجب له الخروج من الملة فهذا يخرج عن دائرة أمة الإجابة إلى أمة الدعوة.", "إذا علم هذا فلننتقل إلى أصل المحاضرة، وهي جمل من المميزات والخصائص التي اختص بها أهل السنة والجماعة رحمهم الله تعالى، لا تجدها موجودة في أي مذهب من هذه المذاهب الاثنتين والسبعين فرقة، لا تجدها موجودة ظاهرة واضحة بادية إلا في منهج أهل السنة والجماعة رحمهم الله تعالى. وهذه الخصائص عبارة عن جمل من قواعد وأصول تقرب من ثلاثين أصلاً، كل قاعدة وأصل منها يدل على خصيصة وميزة تميّز واختص بها أهل السنة والجماعة رحمهم الله. نسأل الله عز وجل أن يجعلنا وإياكم منهم، وأن يثبتنا على مذهبهم وعقيدتهم إلى أن نلقاه ونحن ثابتون عليه."], "fr": ["Si tu dis : que veut dire le Prophète (que Dieu le bénisse et le salue) par sa parole : « Ma communauté se divisera en soixante-treize sectes, toutes en Enfer sauf une » ? Je réponds : le Prophète entend par « communauté » ici la communauté d&#x27;adhésion (umma al-ijâba), non la communauté d&#x27;appel (umma ad-da&#x27;wa). Car les savants ont divisé la communauté en deux : la communauté d&#x27;adhésion et la communauté d&#x27;appel. La communauté d&#x27;appel, ce sont tous ceux qui n&#x27;ont pas… les mécréants d&#x27;origine après la mission du Prophète : depuis qu&#x27;il a été envoyé, celui qui n&#x27;est pas entré dans la foi en lui est dit de sa communauté, mais de la communauté d&#x27;appel, c&#x27;est-à-dire qu&#x27;ils n&#x27;ont pas répondu à l&#x27;appel du tout. La seconde catégorie de la communauté est la communauté d&#x27;adhésion : ceux qui ont répondu au Prophète (que Dieu le bénisse et le salue) et ont témoigné qu&#x27;il n&#x27;y a de divinité que Dieu et que Muhammad est le Messager de Dieu.", "Le hadith de la division ne concerne donc pas la communauté d&#x27;appel : il ne concerne pas les juifs, les chrétiens, les sikhs, les hindous et les autres mécréants. Le hadith de la division parle de la division de la communauté d&#x27;adhésion en elle-même. Ces soixante-treize sectes ne concernent pas la communauté d&#x27;appel, mais la communauté d&#x27;adhésion, c&#x27;est-à-dire les gens de la qibla qui témoignent qu&#x27;il n&#x27;y a de divinité que Dieu et que Muhammad est le Messager de Dieu : ce sont eux qui se diviseront en soixante-treize sectes.", "Si tu dis : qui parmi ces sectes est sauvé ? Je dis : soixante-douze sectes sont toutes en Enfer, comme le Prophète (que Dieu le bénisse et le salue) l&#x27;a annoncé, sauf une seule secte : ce sont les gens de la Sunna et de la communauté, la secte sauvée. Cela confirme ce que j&#x27;ai dit au début de la conférence : nous voyons que la communauté d&#x27;appel, les mécréants, est maintenant plus nombreuse que les musulmans ; la communauté d&#x27;adhésion est donc petite par rapport à la communauté d&#x27;appel. La communauté d&#x27;adhésion se divisera en soixante-treize sectes, soixante-douze en Enfer et une seule sauvée. Les sauvés sont-ils donc moins nombreux que les perdus ? Réponse : les perdus sont plus nombreux, et les sauvés sont moins nombreux ; et lorsqu&#x27;on les comptait, ils étaient peu, et ils sont devenus moins que peu.", "L&#x27;homme doit donc connaître la vérité, louer son Seigneur d&#x27;avoir ouvert sa poitrine pour l&#x27;accepter, et L&#x27;invoquer dans sa prosternation, la nuit et le jour, de l&#x27;y affermir. Car si tu tournais ton regard à droite et à gauche et observais la situation des gens sur le globe terrestre, tu verrais que la plupart ont vu le tapis de la guidée retiré sous leurs pieds et se sont égarés, tandis que toi, Dieu t&#x27;a fait la grâce de l&#x27;islam, et c&#x27;est la plus grande grâce ; puis Il t&#x27;a donné une autre grâce : tu es musulman, sunnite, suiveur, non innovateur ; puis Dieu a ouvert ta poitrine pour une troisième grâce : l&#x27;amour des savants, l&#x27;amour d&#x27;assister aux cercles du bien, l&#x27;amour de lire des livres, l&#x27;amour des bonnes rencontres. Ne sont-ce pas là des grâces qui se succèdent de Dieu, le Puissant et Majestueux ? Par Dieu, des grâces successives qui méritent gratitude : même si nous Lui rendions grâce, depuis notre naissance jusqu&#x27;à ce que les anges reprennent nos âmes, nous n&#x27;aurions pas acquitté la gratitude d&#x27;un dixième d&#x27;une seule des grâces de Dieu. Louange à Dieu au commencement et à la fin, extérieurement et intérieurement.", "Après cet aperçu rapide, quelqu&#x27;un nous demande : ces sectes, en quelles affaires divergent-elles ? Réponse : leur divergence porte sur les affaires de croyance ; ce hadith, qu&#x27;on appelle le hadith de la division, n&#x27;a rien à voir avec les affaires de jurisprudence. Les affaires de jurisprudence n&#x27;entrent pas dans la divergence blâmable, avec ses conditions connues des juristes, que Dieu leur fasse miséricorde ; la division blâmable est la divergence et la division dans les affaires de croyance.", "Si tu dis : si la divergence mène à la mécréance, la divergence mécréante entre-t-elle dans ces soixante-treize sectes ? Réponse : non. La divergence concernée par ces soixante-treize sectes est la divergence qui entraîne la perversité (fisq), non celle qui entraîne la mécréance. C&#x27;est pourquoi les savants ont fait sortir les Rafidites de ce hadith, car les innovations dans lesquelles ils sont tombés sont devenues des innovations mécréantes ; les Rafidites sont ainsi devenus de la communauté d&#x27;appel, non plus de la communauté d&#x27;adhésion. De même, beaucoup de savants des derniers siècles, parmi les gens de la Sunna et de la communauté, ont fait sortir les Jahmites. Comme l&#x27;imam Ibn al-Qayyim, que Dieu lui fasse miséricorde, rapporte que cinq cents savants des gens de la Sunna ont déclaré les Jahmites mécréants et les ont fait sortir du hadith de la division bien connu ; il dit : « Et leur mécréance, cinq cents savants dans les pays l&#x27;ont endossée. » Les Jahmites, je veux dire les disciples de Jahm ibn Safwân, sont donc hors du hadith de la division. C&#x27;est une preuve que celui qui entre dans ce hadith est celui qui a divergé de nous et innové dans la religion une innovation qui n&#x27;entraîne pas la mécréance ni la sortie de la religion. Faites attention à cela : celui qui innove une innovation qui entraîne sa mécréance et sa sortie de la religion sort du cercle de la communauté d&#x27;adhésion pour entrer dans la communauté d&#x27;appel.", "Cela étant su, passons au cœur de la conférence : un ensemble de traits distinctifs et de caractéristiques propres aux gens de la Sunna et de la communauté, que Dieu leur fasse miséricorde, que tu ne trouveras dans aucune de ces soixante-douze sectes, que tu ne trouveras manifestes, claires et apparentes que dans la méthode des gens de la Sunna et de la communauté. Ces caractéristiques sont un ensemble de règles et de fondements, environ trente, chaque règle et fondement indiquant une caractéristique et un trait par lesquels les gens de la Sunna et de la communauté, que Dieu leur fasse miséricorde, se distinguent. Nous demandons à Dieu, le Puissant et Majestueux, de faire de nous et de vous des leurs, de nous affermir sur leur voie et leur croyance jusqu&#x27;à ce que nous Le rencontrions en y étant fermes."]}, {"id": "r1", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 1: لا يأخذون معتقدهم إلا من الكتاب والسنة", "tf": "Règle 1 : Ils ne prennent leur croyance que du Livre et de la Sunna", "ar": ["القاعدة الأولى: أهل السنة والجماعة لا يأخذون معتقدهم إلا من الكتاب والسنة. وهذا أول أصل عند أهل السنة والجماعة، وقد خالفنا في ذلك كثير من الطوائف التي لا عدَّ لها ولا حصر. فلا تجد طوائف تقبل في أخذ أمور عقائدها من الكتاب والسنة؛ فمن الطوائف من يأخذ عقيدته من عقله، ومن الطوائف من يأخذ عقيدته من الأحاديث المكذوبة والمرويات الواهية الباطلة الموضوعة على النبي صلى الله عليه وسلم، ومن الطوائف من يأخذ عقيدته من موروثات آبائه وأسلافه وعادات قومه وأعرافهم وسلومهم، ومن الطوائف من يأخذ عقيدته من مواجيده وأذواقه واستحساناته وخلجاته ورغباته النفسية الشهوانية، ومن الطوائف من يأخذ عقائده من الرؤى والمنامات والأحلام. كل هذه الطوائف موجودة في العالم الإسلامي إلا أهل السنة والجماعة، فإنهم باجماعهم لا يمكن أبداً أن يتلقوا عقيدة من العقائد إلا وعليها دليلها وبرهانها والشاهد لصحتها من كتاب الله عز وجل أو سنة النبي صلى الله عليه وسلم.", "وقد شهدت الأدلة أن من استمسك بهما واعتصم بهما فإنه على الحق والهدى والنور. قال الله عز وجل: ﴿والذين يمسكون بالكتاب وأقاموا الصلاة إنا لا نضيع أجر المصلحين﴾، ويقول الله عز وجل: ﴿واعتصموا بحبل الله جميعاً﴾ وحبل الله كتابه وعهده وميثاقه ﴿ولا تفرقوا﴾، ويقول النبي صلى الله عليه وسلم: «لقد تركت فيكم ما إن تمسكتم به لن تضلوا: كتاب الله وسنتي»، أو كما قال عليه الصلاة والسلام، ويقول عليه الصلاة والسلام: «فإنه من يعش منكم فسيرى اختلافاً كثيراً فعليكم بسنتي وسنة الخلفاء الراشدين من بعدي، تمسكوا بها». والأدلة من الكتاب والسنة وأقوال السلف على صحة هذا الأصل وبيان هذه الخصيصة كثيرة جداً. فلا تجد طائفة من طوائف الثلاث والسبعين فرقة طائفة تأخذ كل معتقداتها من الكتاب والسنة إلا أهل السنة والجماعة فقط.", "فإذن إذا رأيت الإنسان يستدل على عقائده بعقله المجرد فاعلم أنه صاحب هوى وصاحب بدعة، مو من أهل السنة. وإذا رأيته يقرر عقيدة من العقائد بمجرد حلم رآه كالصوفية، أو منام رآه، فاعرف أنه من أهل البدع. وإذا رأيته يستدل على عقيدته بمواجيده وكشوفاته وخوارقه ومخاريقه فاعرف أنه من أهل البدع الخارجين عن دائرة أهل السنة والجماعة. وإذا رأيت الإنسان كلما ذكر عقيدة أيدها بآية أو أيدها بحديث فاعرف أنه من أهل السنة والجماعة. فإذن هذه أول خصيصة يا إخوة؛ فالوصية لي ولكم ولعموم المسلمين، حكاماً ومحكومين، رؤساء وشعوباً، أن نستمسك جميعاً ونعتصم بالكتاب والسنة، فإنه لا نجاة إلا بالاستمساك بهما والعضّ عليهما بالنواجذ؛ والأدلة في ذلك كثيرة كما ذكرت."], "fr": ["Les gens de la Sunna et de la communauté ne prennent leur croyance que du Livre et de la Sunna. C&#x27;est le premier principe chez les gens de la Sunna et de la communauté, et nous sont opposées en cela de nombreuses sectes, innombrables. Tu ne trouveras pas de sectes qui acceptent de prendre les affaires de leurs croyances du Livre et de la Sunna : certaines sectes prennent leur croyance de leur raison ; certaines la prennent de hadiths forgés, de récits faibles, faux et mensongèrement attribués au Prophète (que Dieu le bénisse et le salue) ; certaines la prennent de l&#x27;héritage de leurs pères et ancêtres, des coutumes, usages et traditions de leur peuple ; certaines la prennent de leurs états spirituels, de leurs goûts, de leurs jugements de convenance, de leurs élans intérieurs et de leurs désirs charnels ; certaines prennent leurs croyances des visions, des songes et des rêves. Toutes ces sectes existent dans le monde islamique, sauf les gens de la Sunna et de la communauté : ils sont, à l&#x27;unanimité, incapables de recevoir une croyance sans qu&#x27;elle ait sa preuve, son argument et le témoin de sa justesse tiré du Livre de Dieu, le Puissant et Majestueux, ou de la Sunna du Prophète (que Dieu le bénisse et le salue).", "Les preuves attestent que celui qui s&#x27;y attache et s&#x27;y accroche est sur la vérité, la guidée et la lumière. Dieu dit : « Et ceux qui se tiennent fermement au Livre et accomplissent la prière, Nous ne laisserons pas perdre la récompense des réformateurs. » Dieu dit : « Et cramponnez-vous tous ensemble à la corde de Dieu » (la corde de Dieu, c&#x27;est Son Livre, Son alliance et Son pacte) « et ne vous divisez pas. » Le Prophète (que Dieu le bénisse et le salue) dit : « J&#x27;ai laissé parmi vous ce qui vous empêchera de vous égarer si vous vous y attachez : le Livre de Dieu et ma Sunna », ou comme il l&#x27;a dit, sur lui la prière et la paix. Et il dit : « Celui d&#x27;entre vous qui vivra verra de nombreuses divergences ; attachez-vous donc à ma Sunna et à celle des califes bien guidés après moi, tenez-y fermement. » Les preuves du Livre et de la Sunna et les paroles des salaf sur la justesse de ce principe et l&#x27;explication de cette caractéristique sont très nombreuses.", "Tu ne trouveras donc, parmi les soixante-treize sectes, aucune secte qui prenne toutes ses croyances du Livre et de la Sunna, sauf les gens de la Sunna et de la communauté seuls. Si tu vois donc un homme argumenter pour ses croyances par sa seule raison, sache qu&#x27;il est un homme de passion et d&#x27;innovation, non des gens de la Sunna. Si tu le vois établir une croyance sur la seule base d&#x27;un rêve qu&#x27;il a vu, comme les soufis, ou d&#x27;une vision, sache qu&#x27;il est des gens d&#x27;innovation. Si tu le vois argumenter pour sa croyance par ses états spirituels, ses dévoilements, ses prodiges et ses tours de magie, sache qu&#x27;il est des gens d&#x27;innovation sortis du cercle des gens de la Sunna et de la communauté. Et si tu vois l&#x27;homme, chaque fois qu&#x27;il mentionne une croyance, l&#x27;appuyer d&#x27;un verset ou d&#x27;un hadith, sache qu&#x27;il est des gens de la Sunna et de la communauté.", "Voilà donc la première caractéristique, mes frères. La recommandation, pour moi et pour vous, et pour l&#x27;ensemble des musulmans, gouvernants et gouvernés, dirigeants et peuples, est de nous attacher tous au Livre et à la Sunna : il n&#x27;y a de salut que dans l&#x27;attachement à eux et le fait de les mordre avec les molaires. Les preuves en ce sens sont nombreuses, comme je l&#x27;ai mentionné."]}, {"id": "r2", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 2: يعتمدون في عقائدهم على فهم السلف الصالح", "tf": "Règle 2 : Ils s'appuient sur la compréhension des pieux prédécesseurs", "ar": ["القاعدة الثانية: أهل السنة يعتمدون في عقائدهم على فهم السلف الصالح. فلا يفتح أهل السنة الفهوم في الكتاب والسنة فكلٌّ يفهم كيفما شاء، لا؛ وإنما أهل السنة يقولون: لا يجوز لنا أن نفهم الكتاب والسنة إلا على مقتضى ما فهمه سلف الأمة. والمراد بسلف الأمة يعني سلف الزمان، وهم الصحابة والتابعون وتابعوهم من أهل القرون المفضلة. فلا يجوز لنا أن نفهم النصوص في الصفات، ولا النصوص في القدر، ولا النصوص في مرتكب الكبيرة، ولا النصوص الواردة في عدالة الصحابة وتوثيقهم، ولا النصوص الواردة في حقائق اليوم الآخر وغيرها إلا على ضوء ما فهمه الصحابة رضوان الله تعالى عليهم. لا ندخل في هذا الباب متأولين بآرائنا ولا متوهمين بأهوائنا؛ فإنه ما ثبتت قدم على طريق السنة إلا إذا كان عقل صاحبها متبعاً في فهمه لفهم السلف الصالح رحمهم الله. فمن أراد النجاة في هذا الباب فليحجب كل فهم عارض فهم أهل السنة والجماعة، أقصد عارض فهم السلف الصالح.", "ولو تأملت في هذه الأصول، هذين الأصلين، لاستنتجت منها أن دعوتنا معاشر أهل السنة والجماعة منطلقة من ثلاثة أصول: من الكتاب، ومن السنة، ومن فهم سلف الأمة. من حاد عن أصل منها فإنه خالع الربقة، مذهب أهل السنة من عنقه؛ لا أقول كافر، ولكن خالع الانتساب، خالع الانتساب من مذهب أهل السنة والجماعة. ولذلك نحن لا نصغي لأي مبتدع يأتينا على بدعته بدليل من الكتاب والسنة؛ لا نصغي له ولا نصدقه، لا أقصد لا نصدقه في الدليل، لكننا لا نصدقه في الاستدلال بالدليل، لأن الكتاب والسنة لا يدلان على شيء من البدع والمحدثات والمخالفات. ولذلك نقول للأشعري إذا فهم من قول الله عز وجل ﴿بل يداه مبسوطتان﴾ أن المراد باليد النعمة والقدرة: أخطأت أيها الأشعري، بل المراد بهما يدا ربنا حقيقة على الوجه اللائق به، لأن السلف إذا مروا على هذه الآية لم يكونوا يفهمون كما فهمتَ لما مرَّت عليها؛ وكل فهم خالف فهم السلف في مسائل العقيدة والعمل فإنه باطل. ونقول للمعتزلي إذا مر على قول الله عز وجل ﴿ما يأتيهم من ذكر من الرحمن محدث﴾، إذا قال لك المعتزلي إن المحدث هنا بمعنى مخلوق فقل: أخطأت في فهمك أيها المعتزلي، وفهمتَ هذه الآية على خلاف ما فهمه الصحابة؛ فإن الصحابة مجمعون على أن «محدث» هنا إنما تفيد الشيء الجديد ليس المخلوق. فإذن هو يريد أن يستدل على عقيدته الكفرية، أن القرآن مخلوق، بهذه الآية. فإذن ليس كل مبتدع يأتيك على بدعته بآية أو حديث تقبل مباشرة لأنه جاءك بالكتاب والسنة؛ لا، إياك! بل لا بد أن تنظر في فهمه لهذه الآية أو لهذا الحديث؛ فإن وافقته فهماً متفقاً مع مذهب أهل السنة، مع فهم أهل السنة والجماعة، فأهلاً وسهلاً، وهذا هو الحق وعلى العين والرأس، والحق يقبل ممن جاء به. وأما إن رأيته فهم النصوص على خلاف فهم السلف الصالح فيُضرب بقوله هو واستدلاله هو عرض الحائط؛ فقل: الدليل هذا الذي ذكرته لا يدل على ما فهمته.", "وهذه القاعدة وهذا الأصل له دلالته الكبيرة، وقد ألّفتُ فيها رسالة اسمها «تذكير الخلف بوجوب اعتماد فهم السلف لأدلة الكتاب والسنة». فإذن أدلة الكتاب والسنة ليست مرعى، كلٌّ يفهم فيها ما يشاء، لا، بل لا بد أن نكون في فهمنا متبعين، متبعون لا مبتدعين. ولذلك تجد الطوائف كلها عن بكرة أبيها، كل الطوائف لا تعتمد في فهم أدلتها وعقائدها على إيش؟ على فهم السلف الصالح، وإنما هو أمر اختصّ به فقط طائفة واحدة وفرقة واحدة وهي طائفة أهل السنة والجماعة، فهي التي لا تتجاوز ما فهمه السلف الصالح في مسائل العقيدة ونصوصها. يا رب اجعلنا منهم يا رب العالمين."], "fr": ["Les gens de la Sunna s&#x27;appuient, dans leurs croyances, sur la compréhension des pieux prédécesseurs (as-salaf as-sâlih). Les gens de la Sunna n&#x27;ouvrent pas les compréhensions dans le Livre et la Sunna, chacun comprenant comme il veut : non. Les gens de la Sunna disent : il ne nous est pas permis de comprendre le Livre et la Sunna autrement que conformément à ce que les salaf de la communauté ont compris. Par « salaf de la communauté », j&#x27;entends les salaf du temps : les compagnons, les successeurs et les successeurs des successeurs, les gens des meilleures générations.", "Il ne nous est pas permis de comprendre les textes sur les attributs, ni les textes sur le destin, ni les textes sur l&#x27;auteur de grand péché, ni les textes sur la droiture des compagnons et leur fiabilité, ni les textes sur les réalités du Jour dernier, et le reste, autrement qu&#x27;à la lumière de ce que les compagnons (que Dieu les agrée) en ont compris. Nous n&#x27;entrons pas dans ce chapitre en interprétant par nos opinions ni en imaginant par nos passions. Car aucun pied ne s&#x27;est affermi sur la voie de la Sunna, sinon lorsque la raison de son possesseur suivait, dans sa compréhension, la compréhension des pieux prédécesseurs, que Dieu leur fasse miséricorde. Celui qui veut le salut dans ce chapitre doit donc écarter toute compréhension qui s&#x27;oppose à celle des gens de la Sunna et de la communauté, je veux dire à celle des pieux prédécesseurs.", "Si tu médites ces deux fondements, tu en déduiras que notre appel, à nous, gens de la Sunna et de la communauté, part de trois sources : le Livre, la Sunna, et la compréhension des salaf de la communauté. Celui qui s&#x27;écarte de l&#x27;une d&#x27;elles est un homme qui a ôté de son cou le lien de la doctrine des gens de la Sunna — je ne dis pas qu&#x27;il est mécréant, mais qu&#x27;il a quitté l&#x27;appartenance à la doctrine des gens de la Sunna et de la communauté.", "C&#x27;est pourquoi nous n&#x27;écoutons aucun innovateur qui vient nous présenter son innovation avec une preuve du Livre et de la Sunna : nous ne l&#x27;écoutons pas et ne le croyons pas — je ne veux pas dire que nous ne le croyons pas dans la preuve, mais que nous ne le croyons pas dans sa manière d&#x27;argumenter par la preuve, car le Livre et la Sunna ne prouvent aucune des innovations, nouveautés et contradictions. C&#x27;est pourquoi nous disons à l&#x27;acharite, lorsqu&#x27;il comprend de la parole de Dieu « Bien plutôt, Ses deux mains sont déployées » que la « main » désigne le bienfait et le pouvoir : tu t&#x27;es trompé, ô acharite ; il s&#x27;agit bien des deux mains de notre Seigneur, réellement, d&#x27;une manière qui Lui convient, car les salaf, lorsqu&#x27;ils passaient sur ce verset, ne comprenaient pas comme tu as compris ; et toute compréhension qui contredit celle des salaf en matière de croyance et d&#x27;œuvre est fausse.", "Et nous disons au Mu&#x27;tazilite, lorsqu&#x27;il passe sur la parole de Dieu « Aucun rappel nouveau du Tout-Miséricordieux ne leur vient… » et qu&#x27;il dit que « muhdath » signifie « créé » : tu t&#x27;es trompé dans ta compréhension, ô Mu&#x27;tazilite ; tu as compris ce verset à l&#x27;inverse de ce qu&#x27;ont compris les compagnons, car les compagnons sont unanimes que « muhdath » signifie ici la chose nouvelle, non la chose créée. Il veut donc argumenter pour sa croyance mécréante que le Coran est créé par ce verset. Ce n&#x27;est pas tout innovateur qui vient avec un verset ou un hadith pour son innovation que l&#x27;on accepte aussitôt parce qu&#x27;il est venu avec le Livre et la Sunna : non, garde-t&#x27;en ! Il faut regarder sa compréhension de ce verset ou de ce hadith : si tu t&#x27;accordes avec lui sur une compréhension en accord avec la doctrine des gens de la Sunna et de la communauté, alors bienvenue, c&#x27;est la vérité, et sur l&#x27;œil et la tête, car la vérité est acceptée de celui qui l&#x27;apporte. Mais si tu vois qu&#x27;il comprend les textes à l&#x27;inverse de la compréhension des pieux prédécesseurs, sa parole et son argumentation sont jetées contre le mur ; dis : cette preuve que tu as mentionnée ne prouve pas ce que tu as compris.", "Ce principe a une grande portée, et j&#x27;ai composé à son sujet une épître intitulée : « Rappel aux successeurs de l&#x27;obligation de s&#x27;appuyer sur la compréhension des salaf pour les preuves du Livre et de la Sunna ». Les preuves du Livre et de la Sunna ne sont donc pas un pâturage où chacun comprend ce qu&#x27;il veut : il faut que nous soyons, dans notre compréhension, des suiveurs, non des innovateurs.", "Avant de commencer la règle suivante, le conférencier ajoute : c&#x27;est pourquoi tu trouves que toutes les sectes, de la première à la dernière, ne s&#x27;appuient pas pour comprendre leurs preuves et leurs croyances sur la compréhension des pieux prédécesseurs. C&#x27;est un trait propre à une seule secte, un seul groupe : les gens de la Sunna et de la communauté, qui ne dépassent pas ce que les pieux prédécesseurs ont compris des questions de croyance et de leurs textes. Ô Seigneur, fais de nous des leurs, Seigneur des mondes !"]}, {"id": "r3", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 3: وسط بين فرق الأمة", "tf": "Règle 3 : Un juste milieu entre les sectes de la communauté", "ar": ["القاعدة الثالثة: أهل السنة والجماعة وسط بين فرق الأمة كوسطية الأمة بين الأمم. وهذه القاعدة والخصيصة تبرز لك أن هناك وسطيتين: وسطية عامة ووسطية خاصة. أما الوسطية العامة فهي وسطية أمة الإسلام بين اليهود والنصارى، بين المغضوب عليهم والضالين؛ فتجد أن اليهود عندهم إفراط والنصارى عندهم تفريط، وأحياناً العكس، وتجد الأمة التي أخذت بزمام الوسطية هي أمة الإسلام. فمثلاً اليهود يعتقدون في عيسى عليه السلام ماذا؟ يعتقدون أنه كذاب ودعيّ وابن بغيّ، لعنهم الله؛ هذا تفريط كبير في حق الاعتقاد في هذا الرجل والنبي الكريم الصالح. بينما عارضهم النصارى فأفرطوا فجعلوه هو الله وابن الله وثالث ثلاثة؛ فلا هؤلاء أصابوا ولا هؤلاء أصابوا، هؤلاء فرّطوا والآخرون أفرطوا، وأمة توسطت وهي أمة الإسلام فقالوا: هو عبد الله ورسوله؛ فقولهم «عبد الله» رد على النصارى، وقولهم «ورسوله» رد على اليهود. لماذا؟ لأن الله جعل أمة الإسلام أمة وسطاً.", "وقد انبثقت من هذه الوسطية العامة وسطية صغرى تسمى وسطية خاصة، والمراد بها وسطية أهل السنة والجماعة بين فرق الأمة نفسها؛ فلا شأن للوسطية الخاصة بين يهود ونصارى وإنما بين بدع أو مبتدعين في نفس الأمة. إذا نظرت إلى هذه الفرق الثلاث والسبعين الواردة في الحديث، حديث معاوية وغيره، حديث الافتراق، تجد أنها في عقائدها كاليهود والنصارى: ففرقة في هذا الباب العقدي أفرطت، وفرقة فرّطت، وفرقة توسطت. هذه الوسطية لا تحلّ في جميع مسائل العقيدة إلا طائفة واحدة فقط وهم أهل السنة والجماعة. فأهل السنة والجماعة رحمهم الله هم المتوسطون دائماً وأبداً في جميع مسائل العقيدة وجميع مسائل الدين، فلا إفراط ولا تفريط؛ تصديقاً لقول الله عز وجل: ﴿وكذلك جعلناكم أمة وسطاً﴾. فالوسطية العامة تقتضي أن الأمة شهود على أعمال الأديان الأخرى، والوسطية الخاصة تقتضي أن أهل السنة هم الشهود على أعمال أهل البدع يوم القيامة؛ فهما وسطيتان، وقد وفقنا الله عز وجل للوسطية الأولى وللثانية، ونسأل الله أن يثبتنا على هذه الوسطية.", "جعلنا مسلمين فنحن من أهل الأمة الوسط، هذه وسطية عامة، وجعلنا في بلاد تربّينا واستنشقنا ومضغنا وهضمنا فيها مذهب أهل السنة والجماعة، مع حداثة سننا ونحن صغار: «الأصول الثلاثة»، «القواعد الأربع» في ابتدائي، وفي المتوسط «كتاب التوحيد» ثم يعود عليك مرة ثانية، «العقيدة الواسطية» و«الحموية» في المعهد، ثم «العقيدة والأديان المعاصرة». هذه نعمة تستوجب أن نحافظ عليها وألّا نترك أهل الفساد يعيثون في مناهجنا فساداً أو يعيثون في بلادنا فساداً. نسأل الله أن يعصمنا وولاتنا وعلماءنا وبلادنا من كل سوء وبلاء ومكروه.", "أغلب الفرق إما فرّطت وإما أفرطت، والفرقة الوسطى الثالثة توسطت، وهم أهل السنة والجماعة. ولذلك أهل السنة والجماعة وسط في باب الأسماء والصفات بين الممثلة الذين أفرطوا في جانب الإثبات حتى مثّلوا، وبين المعطّلة الذين أفرطوا في جانب التنزيه حتى عطّلوا. وكذلك أهل السنة والجماعة وسط في باب القدر بين الجبرية الذين سلبوا العبد قدرته واختياره، وبين القدرية الذين أخرجوا أن تكون أفعال العباد مخلوقة لله عز وجل. وأهل السنة والجماعة وسط في باب مرتكب الكبيرة في الدنيا وفي الآخرة بين المرجئة الذين قالوا: لا يضر مع الإيمان أي ذنب ولا ينقصه، وبين الوعيدية من المعتزلة والخوارج الذين قالوا: إن مرتكب الكبيرة يخرج من الدين بالكلية؛ فجانبوا السنة وتوسطوا. وأهل السنة وسط في باب أصحاب النبي صلى الله عليه وسلم وآل البيت بين الرافضة الذين غَلَوا في آل البيت حتى رفعوهم إلى مرتبة الألوهية وجَفَوا في الصحابة، وبين الخوارج الذين هم الناصبة الذين كفّروا كثيراً من الصحابة واستحلّوا دماءهم وديار المسلمين؛ فجاء أهل السنة وتوسطوا في عقيدتهم في هاتين الطائفتين. وأهل السنة وسط بين من عبد الله بالخوف فقط فقنط، وبين من عبد الله بالرجاء فقط فأمن؛ فجاء أهل السنة وقالوا: نعبد الله عز وجل بمزيج الخوف والرجاء، لأن خوفاً زائد رجاءً يساوي خشية؛ فإذن أهل السنة يعبدون الله بثلاثة أصول: بالحب، وبالخوف، وبالرجاء. وهكذا في مشوار طويل يدرسه علماء العقيدة ويدرسه طلاب المعتقد الصحيح في حلقات كدروس العقيدة، مشوار طويل تجد أن الفرق إما أخذت بطرف العصا والأخرى أخذت بالطرف الآخر وأهل السنة هم الذين توسطوا. وفي رسالة للعبد الضعيف اسمها «رسالة في بيان وسطية أهل السنة والجماعة بين فرق الأمة»."], "fr": ["Les gens de la Sunna et de la communauté sont un juste milieu entre les sectes de la communauté, à l&#x27;image de la médianité de la communauté parmi les nations. Cette règle et cette caractéristique font ressortir qu&#x27;il y a deux médianités : une médianité générale et une médianité particulière.", "La médianité générale, c&#x27;est la médianité de la communauté de l&#x27;islam entre les juifs et les chrétiens, entre ceux qui ont encouru la colère et les égarés. Tu trouves chez les juifs l&#x27;excès et chez les chrétiens le manque, et parfois l&#x27;inverse ; et la communauté qui a saisi les rênes de la médianité est la communauté de l&#x27;islam. Par exemple, que croient les juifs de Jésus, sur lui la paix ? Ils croient qu&#x27;il est un menteur, un faux et un fils d&#x27;une femme dépravée, que Dieu les maudisse. C&#x27;est un grand manquement dans la croyance à propos de cet homme, prophète généreux et vertueux. Les chrétiens, eux, se sont opposés à eux et sont tombés dans l&#x27;excès : ils en ont fait Dieu, le fils de Dieu et l&#x27;un des trois. Ni ceux-là n&#x27;ont eu raison, ni ceux-ci : ceux-ci ont manqué, les autres ont excédé, et la communauté a pris le juste milieu, la communauté de l&#x27;islam, qui a dit : il est le serviteur de Dieu et Son Messager. Leur parole « serviteur de Dieu » est une réponse aux chrétiens, et leur parole « et Son Messager » est une réponse aux juifs. Pourquoi ? Parce que Dieu a fait de la communauté de l&#x27;islam une communauté médiane.", "De cette médianité générale est issue une médianité plus petite, dite médianité particulière : la médianité des gens de la Sunna et de la communauté entre les sectes de la communauté elle-même. Elle n&#x27;a rien à voir avec les juifs et les chrétiens, mais avec les innovations ou les innovateurs dans la communauté même.", "Si tu regardes ces soixante-treize sectes mentionnées dans le hadith — le hadith de Mu&#x27;âwiya et d&#x27;autres, le hadith de la division — tu trouves que, dans leurs croyances, elles sont comme les juifs et les chrétiens : une secte, dans ce chapitre de croyance, a excédé, une autre a manqué, et une secte s&#x27;est tenue au milieu. Cette médianité, dans toutes les questions de croyance, nul n&#x27;y parvient, sauf une seule secte : les gens de la Sunna et de la communauté. Les gens de la Sunna et de la communauté, que Dieu leur fasse miséricorde, sont toujours et à jamais médians dans toutes les questions de croyance et dans toutes les questions de la religion : ni excès ni manque, en confirmation de la parole de Dieu : « Ainsi, Nous avons fait de vous une communauté médiane. »", "La médianité générale implique que la communauté est témoin des œuvres des autres religions, et la médianité particulière implique que les gens de la Sunna sont les témoins des œuvres des gens d&#x27;innovation le Jour de la résurrection. Ce sont donc deux médianités : Dieu nous a donné de réussir la première et la seconde, et nous Lui demandons de nous affermir sur cette médianité. Il nous a faits musulmans : nous sommes de la communauté médiane, c&#x27;est la médianité générale ; et Il nous a fait grandir dans un pays où nous avons respiré, mâché et digéré la doctrine des gens de la Sunna et de la communauté, dès notre jeune âge : « Les trois principes », « Les quatre règles » à l&#x27;école primaire, au collège « Le Livre de l&#x27;unicité », qui revient ensuite une seconde fois, puis « La Wâsitiyya » et « La Hamawiyya » à l&#x27;institut, puis « La croyance et les religions contemporaines ». C&#x27;est une grâce qui impose que nous la préservions et que nous ne laissions pas les gens de corruption semer la corruption dans nos programmes ou dans notre pays. Nous demandons à Dieu de nous préserver, ainsi que nos gouvernants, nos savants et nos pays, de tout mal, épreuve et chose détestable.", "La plupart des sectes ont soit manqué, soit excédé, et la troisième secte, la médiane, ce sont les gens de la Sunna et de la communauté. C&#x27;est pourquoi les gens de la Sunna et de la communauté sont médians :", "- dans le chapitre des Noms et des Attributs, entre les assimilateurs (al-mumaththila), qui ont excédé dans l&#x27;affirmation jusqu&#x27;à assimiler, et les négateurs (al-mu&#x27;attila), qui ont excédé dans la transcendance jusqu&#x27;à nier les attributs ;", "- de même dans le chapitre du destin, entre les Jabrites, qui ont ôté au serviteur son pouvoir et son choix, et les Qadarites, qui ont refusé que les actes des serviteurs soient créés par Dieu, le Puissant et Majestueux ;", "- dans le chapitre de l&#x27;auteur de grand péché, en ce monde et dans l&#x27;autre, entre les Murji&#x27;ites, qui ont dit qu&#x27;aucun péché ne nuit à la foi et ne la diminue, et les menacistes (al-wa&#x27;îdiyya) parmi les Mu&#x27;tazilites et les Kharijites, qui ont dit que l&#x27;auteur de grand péché sort entièrement de la religion : les gens de la Sunna ont pris le milieu ;", "- dans le chapitre des compagnons du Prophète (que Dieu le bénisse et le salue) et de sa famille, entre les Rafidites, qui ont exagéré à propos de la famille du Prophète jusqu&#x27;à les élever au rang de la divinité et ont été durs envers les compagnons, et les Kharijites, qui sont les Nawâsib, qui ont déclaré mécréants beaucoup de compagnons et ont tenu pour licite leur sang et les demeures des musulmans : les gens de la Sunna ont pris le milieu dans leur croyance sur ces deux groupes ;", "- dans l&#x27;adoration, entre celui qui adore Dieu par la seule crainte, qui désespère, et celui qui adore Dieu par la seule espérance, qui se croit en sécurité : les gens de la Sunna disent : nous adorons Dieu, le Puissant et Majestueux, par un mélange de crainte et d&#x27;espérance, car la crainte plus l&#x27;espérance égale la révérence. Les gens de la Sunna adorent donc Dieu par trois fondements : l&#x27;amour, la crainte et l&#x27;espérance.", "Et ainsi de suite, dans un long parcours qu&#x27;étudient les savants de la croyance et les étudiants de la saine croyance dans les cercles, comme les cours de croyance : tu trouves que les sectes ont saisi soit un bout du bâton, soit l&#x27;autre, et que les gens de la Sunna sont ceux qui ont pris le milieu. Et j&#x27;ai moi-même, le faible serviteur, une épître intitulée : « Épître sur l&#x27;exposé de la médianité des gens de la Sunna et de la communauté entre les sectes de la communauté »."]}, {"id": "r4", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 4: لا ينتسبون إلا إلى الإسلام والإيمان وما دل عليه دليل", "tf": "Règle 4 : Ils ne se rattachent qu'à l'islam, à la foi et à ce qu'une preuve indique", "ar": ["القاعدة التي بعدها: أهل السنة والجماعة لا ينتسبون إلا للإسلام أو الإيمان أو ما دل عليه دليل أو كان صفة راسخة فيهم، يعني صفة وقع عليها إجماعهم. ولذلك تجد أن التسمية لها دورها في منهج أهل السنة؛ فأهل السنة لا يدخلون تحت رايات عمية، أو عصبيات جاهلية، أو بيارق مذهبية، أو شعارات زائفة؛ لا، التسمية لها دورها الكبير؛ فهم لا يتسمون إلا بالإسلام والإيمان، وهي الأسماء التي ذكرها الله لهم في ماذا؟ في القرآن؛ فإذا سمعت الله يقول: ﴿يا أيها الذين آمنوا﴾ فاعلم أن أهل السنة يدخلون فيها دخولاً أولياً. أو ما دل عليه دليل كالطائفة المنصورة: «لا تزال طائفة من أمتي على الحق منصورة»، الفرقة الناجية؛ قالوا: من هم يا رسول الله؟ قال: «الجماعة» ــ في أحاديث الافتراق؛ أهل الحديث، أهل الأثر، السلف الصالح، أهل السنة والجماعة؛ كلها أسماء وقع عليها الدليل أو الإجماع أو كانت صفة راسخة فيهم. وهذا الأمر اختص به أهل السنة فقط.", "وأما ما عداهم من الفرق يا أحبابي فكل فرقة تختلف في انتسابها؛ فمنهم من ينتسب إلى بدعته التي شُهر بها مثل الخوارج نسبة إلى خروجهم على علي بن أبي طالب، ومن الفرق من ينتسب إلى مؤسس فرقته كالأشعرية نسبة إلى أبي الحسن الأشعري، والماتريدية نسبة إلى أبي منصور الماتريدي، والزيدية زوراً وكذباً وبهتاناً ينتسبون إلى زيد بن علي بن الحسين بن علي بن أبي طالب رضي الله عنه المعروف بزين العابدين وهو منهم براء، لكن ينتسبون له انتساباً؛ ومن الفرق من تنتسب إلى شيء حصل لمؤسسهم كالمعتزلة الذين ينتسبون إلى واصل بن عطاء لما اعتزل حلقة الإمام الحسن البصري رحمه الله. إذن جميع الفرق خالفت في هذا الأصل، وأما أهل السنة فلا ينتسبون لا إلى مؤسس فرقة ولا إلى غيره.", "فإن قلتَ: أوليس هناك طائفة يقال لهم الحنابلة، احتسبوه، الشافعي؟ نقول: هذه مذاهب فقهية لا شأن لها بالعقيدة، هذا انتساب فقهي لا عقدي. ولذلك ما تدرس، ما تقرأ: واختلف الحنابلة مع الشافعية في كتب الاعتقاد، ما في كتب الاعتقاد حنفي وشافعي وحنبلي، لا؛ هذه في كتب الفروع والفقه. أما في كتب الاعتقاد: سني، بدعي، جهمي، خارجي، معتزلي، أشعري. معي معي ولا لا يا إخوان؟ أهل السنة لا ينتسبون إلى أي اسم. ولذلك أنا أحذركم يا طلبة العلم: لا تنتسبوا ولا تنطّوا تحت أي شعار من شعارات الطوائف، لا تبليغي ولا إخواني ولا غيرها من هذه الطوائف؛ لا تنتسب إلى هذه الطوائف؛ إنما انتسابك إلى الكتاب والى السنة والى فهم سلف الأمة والى الطائفة المنصورة وأهل الحديث والأثر."], "fr": ["Les gens de la Sunna et de la communauté ne se rattachent qu&#x27;à l&#x27;islam, à la foi, ou à ce qu&#x27;une preuve indique, ou à ce qui est chez eux un trait bien ancré. C&#x27;est-à-dire un trait sur lequel s&#x27;est faite l&#x27;unanimité. C&#x27;est pourquoi tu trouves que la dénomination a son rôle dans la méthode des gens de la Sunna. Les gens de la Sunna n&#x27;entrent pas sous des bannières aveugles, ni des fanatismes de l&#x27;ère préislamique, ni des étendards doctrinaux, ni des slogans trompeurs : non, la dénomination a un grand rôle. Ils ne s&#x27;appellent que par l&#x27;islam et la foi, qui sont les noms que Dieu leur a donnés dans le Coran : lorsque tu entends Dieu dire « Ô vous qui avez cru », sache que les gens de la Sunna y entrent en premier lieu.", "Ou par ce qu&#x27;une preuve indique, comme « la secte secourue » : « Un groupe de ma communauté ne cessera d&#x27;être secouru, sur la vérité » ; « la secte sauvée » ; ils dirent : « Qui sont-ils, ô Messager de Dieu ? » Il dit : « Ils sont le groupe (al-jamâ&#x27;a) », dans les hadiths de la division ; les gens du hadith, les gens de la trace (al-athar), les pieux prédécesseurs, les gens de la Sunna et de la communauté : ce sont tous des noms sur lesquels une preuve ou le consensus s&#x27;est portée, ou qui sont un trait bien ancré chez eux. Cette particularité est propre aux gens de la Sunna seuls.", "Quant à toutes les autres sectes, mes chers, chaque secte diffère dans son rattachement. Certaines se rattachent à leur innovation par laquelle elles se sont fait connaître, comme les Kharijites, du fait de leur sortie contre &#x27;Alî ibn Abî Tâlib ; certaines se rattachent au fondateur de leur secte, comme les Acharites, d&#x27;après Abû l-Hasan al-Ach&#x27;arî, et les Maturidites, d&#x27;après Abû Mansûr al-Mâturîdî ; les Zaydites, à tort, par mensonge et calomnie, se rattachent à Zayd ibn &#x27;Alî ibn al-Husayn ibn &#x27;Alî ibn Abî Tâlib (que Dieu l&#x27;agrée), connu sous le nom de Zayn al-&#x27;Âbidîn, alors qu&#x27;il est innocent d&#x27;eux, mais ils se rattachent à lui par prétention ; certaines sectes se rattachent à un événement survenu à leur fondateur, comme les Mu&#x27;tazilites, qui se rattachent à Wâsil ibn &#x27;Atâ&#x27; lorsqu&#x27;il s&#x27;est retiré (i&#x27;tazala) du cercle de l&#x27;imam al-Hasan al-Basrî, que Dieu lui fasse miséricorde.", "Toutes les sectes ont donc contredit ce principe. Quant aux gens de la Sunna, ils ne se rattachent ni à un fondateur de secte ni à personne d&#x27;autre. Si tu dis : n&#x27;y a-t-il pas une secte appelée les Hanbalites, ou les Chaféites ? Nous disons : ce sont des écoles de jurisprudence qui n&#x27;ont rien à voir avec la croyance ; c&#x27;est un rattachement juridique, non doctrinal. C&#x27;est pourquoi tu ne lis pas que « les Hanbalites ont divergé avec les Chaféites » dans les livres de croyance : il n&#x27;y a pas, dans les livres de croyance, de hanafite, de chaféite ou de hanbalite ; cela se trouve dans les livres de branches et de jurisprudence. Dans les livres de croyance, il y a : sunnite, innovateur, jahmite, kharijite, mu&#x27;tazilite, acharite. Vous me suivez, mes frères ? Les gens de la Sunna ne se rattachent à aucun nom.", "C&#x27;est pourquoi je vous mets en garde, étudiants en sciences religieuses : ne vous rattachez pas et ne vous placez sous aucun slogan des slogans des sectes, ni « tablîghî », ni « ikhwânî », ni les autres de ces sectes. Ne vous rattachez pas à ces sectes : votre rattachement est au Livre, à la Sunna, à la compréhension des salaf de la communauté, à la secte secourue, aux gens du hadith et de la trace."]}, {"id": "r5", "g": "خصائص أهل السنة والجماعة", "gf": "Caractéristiques des gens de la Sunna et de la communauté", "ta": "القاعدة 5: يأخذون بأطراف الأدلة في المسألة الواحدة", "tf": "Règle 5 : Ils prennent toutes les extrémités des preuves dans une question", "ar": ["ومن خصائصهم كذلك، قاعدة: أهل السنة والجماعة يأخذون بأطراف الأدلة في المسألة الواحدة. أهل السنة والجماعة يأخذون بأطراف الأدلة كلها في المسألة الواحدة. وهذا مما اختص به أهل السنة والجماعة، وهو واضح وضوح الشمس في رائعة النهار لمن تأمل وتدبر مذهبهم. ولذلك الممثلة ضلوا في باب الأسماء والصفات لأنهم أخذوا بأدلة الإثبات فقط، ولكن تركوا أدلة التنزيه؛ وعكس ذلك المعطّلة فضلوا في باب الأسماء والصفات لأنهم أخذوا بأدلة التنزيه فقط، ولكن تركوا أدلة إثبات الصفات. فإذن سبب ضلال الطائفتين أنهم أخذوا بطرف من الأدلة في المسألة. انتم معي ولا؟", "فإذن إذا جئت تبحث مسألة فإن كنت تريد طريق الحق والهدى فاستجمع جميع النصوص الشرعية الواردة في هذه المسألة حتى تخرج منها بتصور واضح وصحيح. أما أهل السنة فإنهم في المسألة الواحدة ما ينظرون إلى دليل ولا إلى دليلين ولا إلى طرف أو جانب، وإنما يج
