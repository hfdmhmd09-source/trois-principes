<script>
const D={"ch": [{"id": "intro1", "g": "مقدمة المحاضرة", "gf": "Introduction", "ta": "افتتاح المحاضرة وخطر الانحراف العقدي بين الشباب", "tf": "Ouverture et danger des déviations de croyance chez les jeunes", "ar": ["السلام عليكم ورحمة الله وبركاته.", "الحمد لله رب العالمين، والصلاة والسلام على رسول الله الأمين، وعلى آله وأصحابه الطيبين الطاهرين، ومن تبعهم بإحسان إلى يوم الدين، أما بعد:", "فإن الله عز وجل لما بعث رسله وأنزل كتبه، كان من أعظم وظائف الرسل التي طُلبت منهم أن يقرروا مسائل الاعتقاد، وأن يبينوها للناس، وأن يوضحوها للعامة. فإن من أعظم ما ينبغي طلبه في هذه الحياة من المسائل العلمية مسائلَ العقيدة الصحيحة؛ فإن من كان ذا عقيدة صحيحة فهو في أمنٍ وأمانٍ بإذن الله عز وجل من الانخراط في شيء من الشهوات أو الشبهات التي تنتشر في هذا الزمان.", "وإنه لا يخفى على شريف علمكم أيها الإخوان أن فلذات أكبادنا في هذا الزمان كثيرٌ منهم صار ينخرط في بعض المذاهب الضالة، والأفكار المختلة، والآراء المعتلة؛ فصار منهم من ينكر وجود الله عز وجل، ويفتخر في وسائل التواصل الاجتماعي أنه ملحد. وهذا عددٌ ليس بالسهل؛ ولو أنكم قلّبتم صفحات وسائل التواصل الاجتماعي لرأيتم من ذلك عدداً كبيراً من شباب الأمة ينكرون الله عز وجل. يقولون: ليس هناك شيء اسمه الله، وليس هناك شيء اسمه الملائكة، وليس هناك شيء اسمه عذاب القبر ولا نعيم القبر، وليس هناك جنة ولا نار؛ وهم من أبناء المملكة. ولكن لأن هذه الشبهات وافقت قلباً خالياً من العقيدة الصحيحة ومن الأصول الصريحة، فتمكنت منه، والعياذ بالله.", "وهناك أناس من شبابنا أيضاً ممن تربَّوا في بلادنا وبين ظهرانينا ينكرون أحقية الإسلام أن يكون دين الله عز وجل؛ فاتجهت منهم طائفة فصاروا نصارى وعلقوا الصليب على صدورهم، وذهبت طائفة منهم إلى اليهود، ومنهم من صار ملحداً لا يؤمن بأي دين مطلقاً. وظهرت هذه الصور النشاز على الساحة، وما ذلك إلا بسبب ضعف معرفتهم بالعقيدة الصحيحة.", "فلا بد أن نركّز العقيدة الصحيحة في قلوبنا، وفي قلوب الناشئة، وفي قلوب شبابنا. هذه مسؤولية المشايخ والعلماء وطلبة العلم والخطباء في المساجد، والمعلم في مدرسته، والأب في بيته؛ هذه مسؤولية الجميع، لا بد أن تتكاتف فيها الجهود حتى نكون ممن شارك في زراعة هذه العقيدة في قلوب الناشئة. فما دامت عقيدة الناشئة سليمة، فوالله الذي لا إله إلا هو، لو أن الشبهات تنزل عليهم كزخات المطر ما تؤثر فيهم إن شاء الله، ما تؤثر فيهم أبداً.", "حتى إنه ناقشني قبل أيام بعضُ الناس من شبابنا في مسائل تتعلق بدين الرافضة: لماذا نكره الرافضة؟ لماذا نكفّر الرافضة؟ لماذا نلعن الرافضة؟ لماذا لا نعيش معهم إخواناً متآلفين؟ لا خلاف بيننا وبين دين الرافضة أبداً. وصار يسرد عليَّ هذه الأقاويل التي تنبئ عن خلو هذا القلب من الاعتقاد الصحيح.", "فلذلك يا معاشر العلماء ويا مشايخ وطلبة العلم والخطباء: اتقوا الله في ناشئة شباب الأمة، ركّزوا على مسائل الاعتقاد، نبّهوا الناس على مسائل الاعتقاد أول شيء. المسائل الفقهية لها دورها وسيأتي طرقها بإذن الله، لكن أهم شيء مسائل العقيدة. في منتدياتنا، وفي اجتماعاتنا، وفي لقاءاتنا، وفي احتفالاتنا، وفي ولائمنا الخاصة والعامة، لنطرق دائماً وأبداً مسائل الاعتقاد. فإن شبابنا في أمنٍ وأمان ما دامت عقيدتهم سليمة؛ ولكن متى ما زاغت وخلت قلوبهم عن هذا المعتقد الصافي فسوف تتخطفهم الشبهات، وتعصف بهم رياح الشهوات، فيغرقون في مستنقعات هذه المذاهب المنحرفة والأفكار المختلة المعتلة، والعياذ بالله."], "fr": ["Que la paix, la miséricorde de Dieu et Ses bénédictions soient sur vous.", "Louange à Dieu, Seigneur des mondes. Que la prière et la paix soient sur le Messager de Dieu, le digne de confiance, sur sa famille et ses compagnons, les bons et les purs, et sur ceux qui les ont suivis dans le bien jusqu&#x27;au Jour de la rétribution. Ceci dit :", "Lorsque Dieu, le Puissant et Majestueux, a envoyé Ses messagers et fait descendre Ses Livres, l&#x27;une des plus grandes missions confiées aux messagers a été d&#x27;établir les questions de croyance, de les expliquer aux gens et de les rendre claires pour tous. Car parmi les savoirs que l&#x27;on doit rechercher en priorité dans cette vie, il y a les questions de la croyance correcte. Celui qui possède une croyance correcte est, avec la permission de Dieu, à l&#x27;abri de tomber dans les désirs et les doutes qui se répandent à notre époque.", "Il n&#x27;échappe pas à votre noble science, frères, que beaucoup de nos enfants, aujourd&#x27;hui, s&#x27;engagent dans des doctrines égarées, des idées dérangées et des opinions viciées. Certains en viennent à nier l&#x27;existence de Dieu, le Puissant et Majestueux, et se glorifient sur les réseaux sociaux d&#x27;être athées. Ce n&#x27;est pas un petit nombre : si vous parcouriez les pages des réseaux sociaux, vous verriez beaucoup de jeunes de la communauté renier Dieu. Ils disent : « Il n&#x27;y a rien qui s&#x27;appelle Dieu, rien qui s&#x27;appelle anges, ni châtiment de la tombe ni félicité de la tombe, ni paradis ni enfer », et ce sont des fils du Royaume. Mais ces doutes ont rencontré un cœur vide de croyance correcte et de fondements clairs, et s&#x27;y sont installés, que Dieu nous en garde.", "Il y a aussi, parmi nos jeunes qui ont grandi dans notre pays, au milieu de nous, ceux qui nient que l&#x27;islam soit la religion de Dieu. Un groupe d&#x27;entre eux est devenu chrétien et porte la croix sur la poitrine ; un autre est allé vers les juifs ; d&#x27;autres sont devenus athées, ne croyant en aucune religion. Ces images discordantes sont apparues sur la scène uniquement à cause de la faiblesse de leur connaissance de la croyance correcte.", "Il faut donc enraciner la croyance correcte dans nos cœurs, dans le cœur des jeunes générations, dans le cœur de notre jeunesse. C&#x27;est la responsabilité des cheikhs, des savants, des étudiants en sciences religieuses, des prédicateurs dans les mosquées, de l&#x27;enseignant dans son école, du père dans sa maison. C&#x27;est la responsabilité de tous, et il faut unir les efforts pour compter parmi ceux qui ont participé à semer cette croyance dans le cœur des jeunes. Tant que la croyance des jeunes est saine, par Celui hors de qui il n&#x27;y a point de divinité, même si les doutes s&#x27;abattaient sur eux comme des averses, ils n&#x27;en seraient pas affectés, s&#x27;il plaît à Dieu, jamais.", "Il y a quelques jours, certains de nos jeunes ont discuté avec moi de questions relatives à la religion des Rafidites (chiites). Pourquoi les détestons-nous ? Pourquoi les déclarons-nous mécréants ? Pourquoi les maudissons-nous ? Pourquoi ne vivons-nous pas avec eux comme des frères, en bonne entente ? « Il n&#x27;y a aucun différend entre nous et la religion des Rafidites », disait-il, et il me débitait ces propos qui révèlent un cœur vide de croyance correcte.", "C&#x27;est pourquoi, ô assemblée des savants, des cheikhs, des étudiants et des prédicateurs, craignez Dieu à l&#x27;égard de la jeunesse de la communauté. Concentrez-vous sur les questions de croyance, alertez les gens sur ces questions avant toute chose. Les questions de jurisprudence ont leur rôle et nous les aborderons, s&#x27;il plaît à Dieu, mais le plus important, ce sont les questions de croyance. Dans nos forums, nos réunions, nos rencontres, nos fêtes, nos repas, privés et publics, abordons toujours et sans cesse les questions de croyance. Car nos jeunes restent en sécurité tant que leur croyance est saine ; mais dès qu&#x27;elle dévie et que leurs cœurs se vident de cette croyance pure, les doutes les emporteront, les vents des passions les secoueront, et ils s&#x27;enfonceront dans les marécages de ces doctrines déviantes et de ces idées dérangées, que Dieu nous en garde."]}, {"id": "intro2", "g": "مقدمة المحاضرة", "gf": "Introduction", "ta": "العقيدة أول دعوة الرسل وأساس قبول الأعمال", "tf": "La croyance, premier appel des messagers et fondement des œuvres", "ar": ["فالعقيدة العقيدة أولاً أيها المسلم! العقيدة العقيدة، أرجوكم، العقيدة! فإن أول ما يطرق مسامع الأمم من أنبيائها إنما هي الاعتقادات؛ أول ما يفتتح به الرسل دعوة أممهم هي العقيدة، ما يعلّمونهم أي شيء قبل العقيدة. لا بد من العقيدة أولاً. قال الله عز وجل: ﴿ولقد بعثنا في كل أمة رسولاً أن اعبدوا الله واجتنبوا الطاغوت﴾؛ هذه وظيفة الرسل: تقرير مسائل الاعتقاد. وكذلك يقول الله عز وجل: ﴿وما أرسلنا من قبلك من رسول إلا نوحي إليه أنه لا إله إلا أنا فاعبدون﴾. العقيدة أولاً! أول دعوة الرسل العقيدة.", "قال نوح لقومه: ﴿اعبدوا الله ما لكم من إله غيره﴾، وقال هود لقومه: ﴿اعبدوا الله ما لكم من إله غيره﴾ عقيدة، وقال صالح لقومه: ﴿اعبدوا الله ما لكم من إله غيره﴾، وقالها إبراهيم وشعيب والنبيون على الجميع صلاة الله عز وجل وسلامه؛ كلهم كلهم يفتتحون دعوتهم بالتوحيد: ﴿اعبدوا الله ما لكم من إله غيره﴾.", "وجميع الأعمال التي يفعلها الإنسان من صدقة وصلاة وزكاة وحج وعمرة، وتربية لحية، وبرٍّ بالوالدين، وتقصير ثياب، وقيام ليل، لا يقبل الله عز وجل منها شيئاً إلا إذا كان قائماً على عقيدة صحيحة. متى ما اختلت العقيدة يميناً وشمالاً فلو تقوم الليل كله ما يقبله الله منك، ولو تصوم النهار كل السنة ما يقبل الله عز وجل منك، ولو تتصدق بمالك ما يقبل الله منك. قال الله عز وجل: ﴿وما منعهم أن تُقبل منهم نفقاتهم إلا أنهم كفروا بالله وبرسوله﴾. ما دامت العقيدة مهتزة منحرفة ضالة، فمهما فعلت من الأفعال لا يقبلها الله عز وجل منك. فالتوحيد أساس العمل، أساس العمل؛ فأي عمل يتقرب به العبد إلى الله لم يقم على ساق التوحيد الصحيح فالله يجعله هباءً منثوراً.", "مهما اجتهد الإنسان في الأعمال والطاعات، إذا كانت على عقيدة فاسدة يجعلها الله هباءً منثوراً. يقول الله عز وجل: ﴿وقدمنا إلى ما عملوا من عمل فجعلناه هباءً منثوراً﴾، ويقول الله عز وجل: ﴿قل هل ننبئكم بالأخسرين أعمالاً * الذين ضل سعيهم في الحياة الدنيا وهم يحسبون أنهم يحسنون صنعاً * أولئك الذين كفروا بآيات ربهم ولقائه﴾. عندهم أعمال وعندهم اجتهادات، وهم يحسبون أنهم يحسنون صنعاً في هذه الحياة، ولكن لا يقبل الله عز وجل شيئاً من أعمالهم أبداً. لماذا؟ لأنها قامت على عقيدة باطلة فاسدة. فالله الله يا إخواني بالعقيدة!", "ولذلك يقول السلف: رُبَّ رجلٍ شاب شعره وانحنى ظهره ولم يقبل الله منه سجدة واحدة في حياته. سجدة واحدة ما قبلها الله، وهو طول حياته يسجد لله ويصلي مع المسلمين، ولكن الله ما يقبل منه سجدة واحدة؛ كبرت سنُّه، وشاب شعره، وانحنى ظهره، وما في سجدة واحدة يقبلها الله. لماذا؟ لأن هذا قام على عقيدة فاسدة، عقيدته ضالة. فإذن العقيدة الصحيحة هي أساس العمل، هي أساس العمل."], "fr": ["Ô musulman : la croyance, la croyance d&#x27;abord ! La croyance, la croyance, je vous en prie, la croyance ! Car la première chose qui frappe l&#x27;oreille des peuples de la part de leurs prophètes, ce sont les croyances. La première chose par laquelle les messagers ouvrent leur appel à leur peuple, c&#x27;est la croyance ; ils n&#x27;enseignent rien avant elle. Dieu, le Puissant et Majestueux, dit : « Nous avons envoyé dans chaque communauté un messager : &quot;Adorez Dieu et écartez-vous du Taghout&quot; » : telle est la mission des messagers, établir les questions de croyance. Et Il dit aussi : « Nous n&#x27;avons envoyé avant toi aucun messager sans lui révéler : &quot;Il n&#x27;y a de divinité que Moi, adorez-Moi donc.&quot; » La croyance d&#x27;abord ! Le premier appel des messagers, c&#x27;est la croyance.", "Noé dit à son peuple : « Adorez Dieu, vous n&#x27;avez pas d&#x27;autre divinité que Lui. » Hûd dit à son peuple : « Adorez Dieu, vous n&#x27;avez pas d&#x27;autre divinité que Lui » : c&#x27;est la croyance. Sâlih dit à son peuple : « Adorez Dieu, vous n&#x27;avez pas d&#x27;autre divinité que Lui. » Abraham et Chou&#x27;ayb l&#x27;ont dit aussi, [ainsi que les autres] prophètes, sur eux tous la prière et la paix de Dieu. Tous, absolument tous, ouvrent leur appel par l&#x27;unicité : « Adorez Dieu, vous n&#x27;avez pas d&#x27;autre divinité que Lui. »", "Toutes les œuvres que l&#x27;homme accomplit (aumône, prière, zakât, pèlerinage, petit pèlerinage, laisser pousser la barbe, bonté envers les parents, raccourcir ses vêtements, prière nocturne), Dieu n&#x27;en accepte aucune si elle ne repose pas sur une croyance correcte. Dès que la croyance est faussée, à droite ou à gauche, même si tu pries toute la nuit, Dieu ne l&#x27;accepte pas de toi ; même si tu jeûnes tous les jours de l&#x27;année, Dieu, le Puissant et Majestueux, ne l&#x27;accepte pas ; même si tu donnes tout ton argent en aumône, Dieu ne l&#x27;accepte pas. Dieu dit : « Rien n&#x27;a empêché que leurs dépenses soient acceptées sinon qu&#x27;ils ont renié Dieu et Son messager. » Tant que la croyance est chancelante, déviée, égarée, quoi que tu fasses, Dieu ne l&#x27;accepte pas de toi. L&#x27;unicité est le fondement de l&#x27;œuvre. Toute œuvre par laquelle le serviteur cherche à se rapprocher de Dieu sans reposer sur la tige de l&#x27;unicité correcte, Dieu la réduit à de la poussière dispersée.", "Quels que soient les efforts de l&#x27;homme dans les œuvres et les actes d&#x27;obéissance, s&#x27;ils reposent sur une croyance corrompue, Dieu en fait de la poussière dispersée. Dieu dit : « Nous nous sommes occupés de ce qu&#x27;ils ont fait comme œuvres, et Nous en avons fait de la poussière dispersée. » Et Il dit : « Dis : Vous informerai-je des plus grands perdants quant à leurs œuvres ? Ceux dont l&#x27;effort s&#x27;est égaré dans la vie présente alors qu&#x27;ils s&#x27;imaginent bien faire. Ce sont ceux qui ont renié les signes de leur Seigneur et la rencontre avec Lui. » Ils ont des œuvres, ils ont des efforts, et ils s&#x27;imaginent bien faire dans cette vie, mais Dieu n&#x27;accepte jamais rien de leurs œuvres. Pourquoi ? Parce qu&#x27;elles reposent sur une croyance vaine et corrompue. Craignez Dieu, mes frères, pour ce qui est de la croyance !", "C&#x27;est pourquoi les pieux anciens (as-salaf) disaient : « Tel homme a les cheveux blanchis et le dos courbé, et Dieu n&#x27;a pas accepté de lui une seule prosternation de toute sa vie. » Toute sa vie il se prosterne pour Dieu, il prie avec les musulmans, mais Dieu n&#x27;accepte de lui pas une seule prosternation : il est devenu vieux, ses cheveux ont blanchi, son dos s&#x27;est courbé, et pas une prosternation n&#x27;est acceptée. Pourquoi ? Parce que tout cela reposait sur une croyance corrompue, égarée. Ainsi, la croyance correcte est le fondement de l&#x27;œuvre."]}, {"id": "intro3", "g": "مقدمة المحاضرة", "gf": "Introduction", "ta": "خطورة الخطأ في العقيدة ووجوب العناية بها", "tf": "Gravité de l'erreur en croyance et devoir de s'en occuper", "ar": ["ثم اعلموا رحمكم الله أن الخطأ في المسائل العقدية أعظم بكثير من الخطأ في المسائل الفقهية. قد يخطئ الناس في المسائل الفقهية لكن لا تجب لهم النار؛ لكن لو أخطأ واحد منهم في مسائل عقدية فقد يكون مرتداً خالعاً ربقة الإسلام من عنقه بالكلية، وهو يعيش فيما بيننا لا يُدرى عن حالته، وهو كافر في ميزان الله عز وجل بسبب وجود هذا الخلل العقدي. لكن المسائل الفقهية أمرها سهل: كن شافعياً، كن حنفياً، كن حنبلياً، كن مالكياً. الخلاف في المسائل الفقهية يا إخواني أمره بسيط يسير، لكن الخلاف في المسائل العقدية هذا هو الطامة التي ما بعدها طامة.", "فيا معاشر طلبة العلم، نبّهوا الناس أولاً على ما تكون الأخطاء فيه جسيمة قبل تنبيههم على ما تكون الأخطاء فيه يسيرة. فهذا هو الذي يجعلنا نبدأ بالتوحيد ونكرر فيه ونعيد، ونبدئ فيه ونزيد. التوحيد التوحيد يا إخوان! العقيدة العقيدة! درِّسوا أولادكم وأزواجكم وأقاربكم وأرحامكم وعشائركم العقيدة الصحيحة. اذهب للناس ودرّسهم، اجتمع معهم في أفراحهم وفي أتراحهم ودرّسهم العقيدة الصحيحة، زُرهم في بيوتهم وتجاذب معهم أطراف العقيدة الصحيحة. ليكن جلُّ اهتمامكم يا طلبة العلم بالعقيدة؛ فإن أحوج ما نحتاجه في هذا الزمان تقريرُ مسائل العقيدة الصحيحة في قلوب الناس.", "فإذن نحن نبدأ بالعقيدة لأنها أول دعوة الرسل، ولأنها أساس الأعمال وأصلها وأسُّها، ولأن المخالفة فيها عظيمة."], "fr": ["Sachez ensuite, que Dieu vous fasse miséricorde, que l&#x27;erreur en matière de croyance est bien plus grave que l&#x27;erreur en matière de jurisprudence. Les gens peuvent se tromper dans les questions de jurisprudence sans que cela leur vaille l&#x27;Enfer ; mais si l&#x27;un d&#x27;eux se trompe dans une question de croyance, il peut être apostat, ayant ôté de son cou le lien de l&#x27;islam tout entier, tout en vivant parmi nous sans que nous connaissions son état. Il est mécréant dans la balance de Dieu à cause de ce défaut de croyance. Les questions de jurisprudence, en revanche, sont aisées : sois chaféite, sois hanafite, sois hanbalite, sois malikite. Le désaccord en jurisprudence, mes frères, est simple et léger ; le désaccord en croyance est la calamité au-delà de laquelle il n&#x27;y a pas de calamité.", "Ô assemblée des étudiants en sciences religieuses, alertez d&#x27;abord les gens sur ce en quoi les erreurs sont graves, avant de les alerter sur ce en quoi elles sont légères. C&#x27;est cela qui nous fait commencer par l&#x27;unicité, y revenir, la répéter, la reprendre et y insister. L&#x27;unicité, mes frères ! La croyance, la croyance ! Enseignez-la à vos enfants, à vos épouses, à vos proches, à vos parents, à vos clans. Va vers les gens, enseigne-leur la croyance correcte, retrouve-les dans leurs joies et leurs peines et enseigne-leur la croyance correcte. Rends-leur visite chez eux et échange avec eux sur la croyance correcte. Que votre principal souci, étudiants en sciences religieuses, soit la croyance. Car ce dont nous avons le plus besoin à notre époque, c&#x27;est d&#x27;établir les questions de la croyance correcte dans le cœur des gens.", "Nous commençons donc par la croyance, parce qu&#x27;elle est le premier appel des messagers, parce qu&#x27;elle est le fondement, la racine et la base des œuvres, et parce que la contrevenir est une faute immense."]}, {"id": "intro4", "g": "مقدمة المحاضرة", "gf": "Introduction", "ta": "الأصول الثلاثة: عرض إجمالي", "tf": "Les trois principes : aperçu général", "ar": ["فإن قال لنا قائل: إن العقيدة الإسلامية واسعة، وفروعها كثيرة، وجزئياتها منتشرة، وسوف يطول بي المقام وأنا أدرّسها للناس، وربما ينسي بعضها بعضاً؛ فالكتب العقدية كبيرة جداً، بعض الكتب العقدية يصل إلى أحد عشر مجلداً، وبعضها أقل، والكلام في هذه الكتب كثير جداً. فأقول: لا تخف يا أخي، الأمر بسيط؛ أنا عندي ثلاثة أصول، من ضبطها وحفظها وأتقنها وفهمها فهو ممن ﴿لا خوف عليهم ولا هم يحزنون﴾ إن شاء الله؛ لو نرميه في وسط المبتدعة بإذن الله سوف يغلبهم جميعاً. ثلاثة أصول تجمع لك كل ما قاله أهل السنة والجماعة في عقائدهم. لا تروح تبحث في كتبهم الطويلة إن كنت لا تستطيع البحث ولست بطالب علم؛ فهذه الثلاثة الأصول يفهمها الصغار والكبار، والعوام وطلبة العلم، والذكور والإناث؛ أصول بسيطة ويسيرة وسهلة، ما تحتاج في فهمها إلى تعقيد، وتجمع لك عقيدة أهل السنة والجماعة كلها بحذافيرها، ما ينقص منها شيء أبداً. تبقى التفاصيل والجزئيات، هذه لطلبة العلم. المهم أن تحتزم بهذه الأصول الثلاثة حتى تستطيع أن تقاوم الطوفان الذي هجم على الأمة الإسلامية، وهذه البلاد على وجه الخصوص.", "من عنده هذه الأصول الثلاثة فبإذن الله سوف تكون عنده أسلحة وأحزمة، وعنده القوة والشجاعة والدروع التي يستطيع أن يصدّ بها الهجمات واللطمات، وتلك الأمواج العاتية، والأعاصير المدمّرة، والفتن والمدلهمّات العظيمة. ثلاثة أصول بس! جميع الضلال الذي نراه شاهداً واقعاً كله بسبب الإخلال بواحد من هذه الأصول. ضلوا بسبب خلل وُجد عندهم في واحد من هذه الأصول؛ لو أنهم ضبطوا هذه الأصول ما يحصل لهم ضلال أبداً، وأقسم بالله ما في أحد يضل إذا اعتمد هذه الأصول الثلاثة.", "الخوارج ضلوا بسبب الإخلال بواحد، الجهمية ضلوا بسبب الإخلال بواحد، الرافضة ضلوا بسبب الإخلال بها كلها، الأشاعرة، الماتريدية، الكلابية، الزيدية، النصيرية، القرامطة، الإسماعيلية، الدروز، كافة طوائف الأمة الضالة التي تنتسب للإسلام، السابقة والمعاصرة واللاحقة، كل الخلل عندها حصل في واحد من هذه الأصول. أصول عظيمة جداً، وهي أصول يعرفها طلبة العلم؛ لكن انتبهوا: تستطيع يا طالب العلم أن تشرح العقيدة الإسلامية إجمالاً في جلسة واحدة بهذه الأصول الثلاثة.", "كأني بكم تقولون: طيب، ما هي؟ أعطناها، عجّل بها علينا. هي موضوع محاضرتنا في هذا المساء. وكنت أتمنى أن يسمعها الجميع، ولكن أمانة يا من حضرتم، وعلّقوا هذه الأمانة في رقابكم، أنتم يا من حضرتم، أنتم المسؤولون أمام الله عز وجل عن هذه الأمانة: متى ما رجعتم علّموها لأهلكم، وعلّموها لأقاربكم، وعلّموها لطلابكم، وعلّموها لأزواجكم وأرحامكم، بل حتى الخادمات في البيوت علّموهن هذه الأصول، وبسّطوا العبارة حتى يفهمها الجميع. من آمن بها فهو من أهل السنة، ومن أخلّ بواحد منها فهو من أهل البدع."], "fr": ["Si quelqu&#x27;un nous dit : « La croyance islamique est vaste, ses branches nombreuses, ses détails dispersés ; l&#x27;étude en sera longue et les éléments risquent de s&#x27;oublier les uns les autres. Les livres de croyance sont très volumineux : certains atteignent onze volumes, d&#x27;autres moins, et ils contiennent énormément de discours » ; je lui réponds : n&#x27;aie pas peur, mon frère, l&#x27;affaire est simple. J&#x27;ai trois principes. Celui qui les maîtrise, les retient, les perfectionne et les comprend fait partie de ceux « sur qui il n&#x27;y a pas de crainte et qui ne seront pas affligés », s&#x27;il plaît à Dieu. Même si on le jetait au milieu des innovateurs, avec la permission de Dieu il les vaincrait tous. Ces trois principes réunissent tout ce que disent les gens de la Sunna et de la communauté (Ahl as-Sunna wal-Jamâ&#x27;a) en matière de croyance. Ne va pas chercher dans leurs longs livres si tu ne le peux pas et que tu n&#x27;es pas étudiant en sciences religieuses : ces trois principes, les petits comme les grands, les gens du commun comme les étudiants, les hommes comme les femmes peuvent les comprendre. Ce sont des principes simples, aisés, faciles, qui ne demandent aucune complication pour être compris, et ils rassemblent l&#x27;intégralité de la croyance des gens de la Sunna et de la communauté, sans qu&#x27;il en manque rien. Il reste les détails, réservés aux étudiants en sciences religieuses. L&#x27;essentiel est que tu te ceignes de ces trois principes pour pouvoir résister au déluge qui s&#x27;est abattu sur la communauté islamique, et sur ce pays en particulier. Celui qui possède ces trois principes aura, avec la permission de Dieu, des armes, des ceintures, de la force, du courage et des cuirasses pour repousser les assauts, les gifles, ces vagues déchaînées, ces ouragans destructeurs, ces épreuves et ces ténèbres immenses. Trois principes seulement !", "Tout l&#x27;égarement que nous voyons de nos yeux provient d&#x27;un manquement à l&#x27;un de ces principes. Ils se sont égarés à cause d&#x27;un défaut qu&#x27;on trouve chez eux concernant l&#x27;un d&#x27;eux. S&#x27;ils avaient maîtrisé ces principes, aucun égarement ne les aurait touchés. Je jure par Dieu que personne ne s&#x27;égare s&#x27;il s&#x27;appuie sur ces trois principes.", "Les Kharijites se sont égarés par manquement à l&#x27;un d&#x27;eux. Les Jahmites se sont égarés par manquement à l&#x27;un d&#x27;eux. Les Rafidites se sont égarés par manquement à tous. Les Acharites, les Maturidites, les Kullabites, les Zaydites, les Nusayrites, les Qarmates, les Ismaéliens, les Druzes, toutes les sectes égarées de la communauté qui se rattachent à l&#x27;islam, passées, contemporaines et à venir : chez toutes, le défaut est survenu dans l&#x27;un de ces principes. Ce sont des principes immenses, que connaissent les étudiants en sciences religieuses, mais sachez, étudiant, que tu peux exposer la croyance islamique dans ses grandes lignes en une seule séance grâce à ces trois principes.", "J&#x27;imagine que vous dites : « Alors quels sont-ils ? Donne-les-nous vite. » Ils sont le sujet de notre conférence de ce soir. J&#x27;aurais aimé que tout le monde les entende, mais voici un dépôt confié, vous qui êtes présents ; suspendez ce dépôt à votre cou : vous êtes responsables devant Dieu, le Puissant et Majestueux, de ce dépôt. Quand vous rentrerez, enseignez-les à vos familles, à vos proches, à vos élèves, à vos épouses, à vos parents. Enseignez-les même aux employées de maison, et simplifiez l&#x27;expression pour que tous comprennent. Celui qui y croit est des gens de la Sunna ; celui qui manque à l&#x27;un d&#x27;eux est des gens de l&#x27;innovation."]}, {"id": "p1a", "g": "الأصل الأول: الأخذ من الكتاب والسنة", "gf": "Premier principe : le Livre et la Sunna", "ta": "تقرير الأصل الأول", "tf": "Énoncé du premier principe", "ar": ["الأصل الأول، المتفق عليه بين أهل السنة والجماعة، والذي أجمع أهل البدع على عدم الأخذ به؛ ومن أخذ به من أهل البدع تلبيساً ومخادعة ومجاملة فإنه يفهمه على خلاف الأصل الثاني. ما هو الأصل الأول؟", "ألّا نأخذ معتقداتنا إلا من الكتاب والسنة. أبسطها لكم: ألّا نأخذ معتقداتنا إلا من الكتاب والسنة. ألّا نعتقد شيئاً بقلوبنا في الله أو ملائكته أو كتبه أو رسله أو اليوم الآخر أو القدر أو الصحابة أو مرتكب الكبيرة، أو المسائل العقدية كلها، لا تعتقد منها شيئاً إلا وعليه شاهده وبرهانه ودليله من الكتاب أو السنة. احذر من أن تعتقد شيئاً لا دليل عليه. انتبه! قف! علامة خطر!", "كثير من طوائف الأمة ضلوا لأنهم لم يسوقوا معتقداتهم من الكتاب والسنة، وإنما ساقوها من عقولهم، أو من أذواقهم ومواجيدهم، أو من مكاشفاتهم وأحلامهم ورؤاهم، أو من المنقولات الواهية الموضوعة المكذوبة على آل البيت، أو ساقوها من أصول أخرى؛ لكنهم متفقون على عدم أخذ الاعتقاد من الكتاب والسنة، فوقعوا في ضلال عظيم لا زالت الأمة تعاني آثاره إلى هذا اليوم.", "أما أهل السنة والجماعة فلا: طريقان لا ثالث لهما في الاعتقاد، ما في طريق ثالث؛ طريقان فقط: كتاب الله، وسنة رسوله صلى الله عليه وسلم، غيرها ما فيه. أي عقيدة تُدخلها في قلبك وتؤمر باعتقادها، اسأل أولاً عن برهانها ودليلها ومستندها؛ فإن وجدته من كتاب الله وسنة رسوله صلى الله عليه وسلم فأدخلها في قلبك، واحتضنها في صدرك وأنت مطمئن البال، مرتاح الخاطر، منشرح الصدر.", "ولذلك لا تجد عقيدة في هذه الكتب العقدية الكبيرة إلا ويؤيدها مؤلفها مباشرة بدليلها من الكتاب والسنة. فعقيدتنا في الله مبنية على أدلة، عقيدتنا في عالم الملائكة مبنية على أدلة، عقيدتنا في عالم الجن مبنية على أدلة، عقيدتنا في عالم الآخرة بدايةً من القبر ونهايةً بدخول أهل الجنة الجنةَ وأهل النار النارَ كلها مبنية على أدلة. لا تقل لي: اعتقد إلا بدليل! لا تقل لي: اعتقد إلا بدليل!"], "fr": ["LE PREMIER PRINCIPE, sur lequel s&#x27;accordent les gens de la Sunna et de la communauté, et que tous les gens de l&#x27;innovation ont unanimement refusé d&#x27;adopter (et celui qui parmi eux l&#x27;adopte, par duperie, tromperie ou complaisance, le comprend à l&#x27;inverse du second principe). Quel est-il ?", "Ne prendre nos croyances que du Livre et de la Sunna. Je le dis simplement : nous ne prenons nos croyances que du Livre et de la Sunna. Ne crois rien dans ton cœur au sujet de Dieu, de Ses anges, de Ses livres, de Ses messagers, du Jour dernier, du destin, des compagnons, de l&#x27;auteur de grand péché, ni d&#x27;aucune autre question de croyance, sans que tu aies un témoin, une preuve et un argument tiré du Livre ou de la Sunna. Garde-toi de croire quoi que ce soit sans preuve. Attention ! Stop ! Signal de danger !", "Beaucoup de sectes de la communauté se sont égarées parce qu&#x27;elles n&#x27;ont pas tiré leurs croyances du Livre et de la Sunna. Elles les ont tirées de leurs raisonnements, de leurs goûts et de leurs états spirituels, de leurs dévoilements, de leurs songes et de leurs visions, ou encore de récits faibles, forgés et mensongèrement attribués à la famille du Prophète, ou d&#x27;autres sources encore. Mais elles s&#x27;accordent toutes pour ne pas prendre la croyance du Livre et de la Sunna, et sont tombées dans un grand égarement dont la communauté souffre encore aujourd&#x27;hui.", "Quant aux gens de la Sunna et de la communauté, non : il y a deux voies, pas de troisième voie en matière de croyance. Seulement deux : le Livre de Dieu et la Sunna de Son messager, que Dieu le bénisse et le salue. Il n&#x27;y a rien d&#x27;autre. Pour toute croyance qu&#x27;on te demande de faire entrer dans ton cœur, demande d&#x27;abord sa preuve, son argument, son fondement. Si tu la trouves dans le Livre de Dieu et la Sunna de Son messager, alors accueille-la dans ton cœur, serre-la contre ta poitrine, l&#x27;esprit tranquille, le cœur apaisé et la poitrine ouverte.", "C&#x27;est pourquoi tu ne trouveras aucune croyance dans les grands livres de croyance sans que son auteur l&#x27;appuie directement par sa preuve du Livre et de la Sunna. Notre croyance en Dieu repose sur des preuves ; notre croyance au monde des anges repose sur des preuves ; notre croyance au monde des djinns repose sur des preuves ; notre croyance en l&#x27;au-delà, depuis la tombe jusqu&#x27;à l&#x27;entrée des gens du Paradis au Paradis et des gens de l&#x27;Enfer en Enfer, repose entièrement sur des preuves. Ne me dis pas de croire sans preuve ! Ne me dis pas de croire sans preuve !"]}, {"id": "p1b", "g": "الأصل الأول: الأخذ من الكتاب والسنة", "gf": "Premier principe : le Livre et la Sunna", "ta": "العقل المجرد ليس طريقاً لمعرفة العقائد", "tf": "La raison seule n'est pas une voie vers les croyances", "ar": ["وهل العقل المجرد عن النقل يصلح أن يكون دليلاً في إثبات العقائد؟ بالعربي: لا. وبالإنجليزي: «نو». وبالهندي: «نهي». لعله يسمع هذه المحاضرة جميع أصحاب اللغات فيفهمون المقصود. قل «لا» بملء فيك: عقلي ليس طريقاً لمعرفة الاعتقادات.", "فلو كانت العقول تستقل بمعرفة العقائد لما كانت البشرية محتاجة إلى نزول كتب من الله أو إرسال رسل، إذ كل واحد منهم يستطيع بعقله أن يعرف العقيدة الصحيحة. لكن العلماء متفقون على أن العقول بمجردها لا تستطيع أن تستقل بإدراك الشرع مطلقاً، إنما هما أصلان: الكتاب والسنة."], "fr": ["La raison seule, détachée de la transmission, est-elle valable comme preuve pour établir les croyances ? En arabe : non. En anglais : « no ». En hindi : « nahin » (peut-être que des locuteurs de toutes les langues écoutent cette conférence et comprendront ainsi l&#x27;idée). Dis « non » à pleine bouche : la raison n&#x27;est pas une voie pour connaître les croyances. Si les raisons pouvaient connaître seules les croyances, l&#x27;humanité n&#x27;aurait pas eu besoin de la descente de livres venus de Dieu ni de l&#x27;envoi de messagers, car chacun aurait pu, par sa raison, connaître la croyance correcte. Or les savants s&#x27;accordent à dire que les raisons, à elles seules, ne peuvent absolument pas atteindre la législation divine. Il n&#x27;y a que deux fondements : le Livre et la Sunna. Dieu, le Puissant et Majestueux, dit : « Et cramponnez-vous tous ensemble à la corde de Dieu, et ne vous divisez pas. »"]}, {"id": "p1c", "g": "الأصل الأول: الأخذ من الكتاب والسنة", "gf": "Premier principe : le Livre et la Sunna", "ta": "الأدلة من القرآن", "tf": "Les preuves tirées du Coran", "ar": ["يقول الله عز وجل: ﴿واعتصموا بحبل الله جميعاً ولا تفرقوا﴾. وقد اختلف السلف في المراد بحبل الله؛ فعلى أحد التفسيرين أنه القرآن، والتفسير الثاني: عهد الله وميثاقه. فهما قولان في آية واحدة، والخلاف فيها خلاف تنوع لا تضاد. والمتقرر عند العلماء أن الآية إذا فُسرت بتفسيرين لا تنافي بينهما فإنها محمولة عليهما. فالله عز وجل في هذه الآية أمرنا أن نعتصم بكتابه؛ إذ لا نجاة للأمة إلا بالقرآن، ولا فلاح ولا بِرَّ ولا صلاح ولا سلامة، في الظاهر ولا في الباطن، في العقائد ولا في الأعمال، إلا بالاعتصام بالقرآن.", "يقول الله عز وجل: ﴿والذين يمسّكون بالكتاب وأقاموا الصلاة إنا لا نضيع أجر المصلحين﴾. هم استمسكوا به، لكن يمسّكون غيرهم به، بمعنى يأمرون غيرهم بالاستمساك والاعتصام بهذا القرآن العظيم. فالذي يأمر بالقرآن هذا مصلح وناصح ومجتهد لك في بذل ما فيه خيرك ونفعك في عاجل أمرك وآجله.", "لا عقيدة إلا من القرآن والسنة، لا عقيدة إلا بشاهدَي الوحي: كتاباً وسنة. يقول الله عز وجل: ﴿قل إن كنتم تحبون الله فاتبعوني يحببكم الله ويغفر لكم ذنوبكم والله غفور رحيم﴾. ويقول الله تبارك وتعالى: ﴿الذين يتبعون الرسول النبي الأمي الذي يجدونه مكتوباً عندهم في التوراة والإنجيل يأمرهم بالمعروف وينهاهم عن المنكر﴾، الآية بتمامها والآية بعدها: آيتان يأمر الله عز وجل فيهما باتباع محمد صلى الله عليه وسلم، ويعلق الهداية والفلاح والصلاح والاستقامة بمتابعته. ﴿فالذين آمنوا به وعزروه ونصروه واتبعوا النور الذي أنزل معه﴾. ما النور الذي أنزل معه؟ نوران: كتاب وسنة. فالسنة كانت تنزل على النبي صلى الله عليه وسلم كما ينزل القرآن. قال الله عز وجل: ﴿وأنزل الله عليك الكتاب والحكمة﴾، وقد أجمع المفسرون على أن الحكمة إذا قُرنت بالكتاب في مقام الإنزال فالمقصود بها السنة. وكان النبي صلى الله عليه وسلم يقول: «ألا وإني أوتيت القرآن ومثله معه».", "فلا نجاة أيتها الأمة إلا بالاستمساك بالكتاب والسنة. يقول صلى الله عليه وعلى آله وصحبه وسلم: «لقد تركت فيكم ما لن تضلوا إن اعتصمتم به: كتاب الله وسنتي». فالاستمساك بهما نجاة، والعضُّ عليهما بالنواجذ فلاح وصلاح.", "وإن أغلب مظاهر الإلحاد التي نراها بأعيننا إنما سببها هذا الشيطان الملعون الأفّاك، وهو الدعوة إلى نبذ الكتاب والسنة وعدم أخذ العقائد منهما: «لا نريد الكتاب والسنة، نحن قوم خلقنا الله ولنا عقول، الكتاب والسنة إنما تصلح للقرون السابقة». ويبدأ الواحد منهم يجترّ كما تجترّ البقرة بمثل هذه الشبهات التي يلقيها عليه أبالسة الجن والإنس حتى يمنعوه من مصدر الهدى ويوقعوه في مصائدهم وحبائلهم. فمتى أُبعدت العقول والقلوب عن الكتاب والسنة فسوف تتخطفها الأبالسة، وتهجم عليها الشياطين، وتعشعش فيها الأفكار الضالة والمذاهب الهدامة التي تفسد على الإنسان علاقته وعقيدته بالله عز وجل.", "الكتاب والسنة تكفون! الكتاب والسنة لا غيرهما! لا تحاكمني لا لعقل ولا لاجتهاد ولا لرأي ولا لمذهب ولا لرؤى ولا لمكاشفات ولا لاستحسانات ولا لصفاء أو خفاء، وإنما تحاكمني إلى الكتاب والسنة. عقيدة ما عليها دليل من الكتاب والسنة ما أقبلها، ما أقبلها أبداً. انتبهوا لهذا واحذروا، وفقكم الله وسدد خطاكم."], "fr": ["Les anciens ont divergé sur ce qu&#x27;on entend par « corde de Dieu ». Selon une interprétation, c&#x27;est le Coran ; selon une autre, c&#x27;est l&#x27;alliance et le pacte de Dieu. Ce sont deux explications d&#x27;un même verset, et la divergence est de la diversité, non de la contradiction. Il est établi chez les savants que lorsqu&#x27;un verset est expliqué de deux manières qui ne s&#x27;excluent pas, il est appliqué aux deux. Dieu, dans ce verset, nous ordonne de nous attacher à Son Livre, car il n&#x27;y a pas de salut pour la communauté sans le Coran, ni réussite, ni piété, ni droiture, ni sauvegarde, extérieurement comme intérieurement, ni dans les croyances ni dans les œuvres, sans s&#x27;attacher au Coran.", "Dieu dit : « Et ceux qui se tiennent fermement au Livre et accomplissent la prière, Nous ne laisserons pas perdre la récompense des réformateurs. » Ils s&#x27;y tiennent eux-mêmes, mais ils y font tenir aussi les autres, c&#x27;est-à-dire qu&#x27;ils ordonnent aux autres de s&#x27;attacher à ce grand Coran. Celui qui ordonne le Coran est un réformateur, un conseiller, qui s&#x27;efforce de te procurer ce qui est bon et utile pour toi dans ton présent et ton avenir.", "Pas de croyance sinon du Coran et de la Sunna ; pas de croyance sinon par les deux témoins de la Révélation, le Livre et la Sunna. Dieu dit : « Dis : Si vous aimez Dieu, suivez-moi : Dieu vous aimera et vous pardonnera vos péchés, Dieu est Pardonneur, Miséricordieux. » Et Il dit : « Ceux qui suivent le Messager, le Prophète illettré qu&#x27;ils trouvent mentionné chez eux dans la Torah et l&#x27;Évangile, qui leur ordonne le convenable et leur interdit le blâmable… », le verset en entier et celui qui suit. Dans ces deux versets, Dieu ordonne de suivre Muhammad, que Dieu le bénisse et le salue, et rattache la guidée, la réussite, la droiture et la rectitude au fait de le suivre.", "« Ceux qui ont cru en lui, l&#x27;ont soutenu et secouru et ont suivi la lumière descendue avec lui. » Quelle est la lumière descendue avec lui ? Deux lumières : le Livre et la Sunna. La Sunna descendait sur le Prophète comme descendait le Coran. Dieu dit : « Dieu a fait descendre sur toi le Livre et la Sagesse. » Les exégètes sont unanimes : lorsque la Sagesse est associée au Livre dans le contexte de la descente, elle désigne la Sunna. Et le Prophète disait : « Voici que le Coran m&#x27;a été donné, et son pareil avec lui. »", "Il n&#x27;y a donc de salut, ô communauté, que par l&#x27;attachement au Livre et à la Sunna. Il (que Dieu le bénisse, lui, sa famille et ses compagnons, et le salue) a dit : « J&#x27;ai laissé parmi vous ce qui vous empêchera de vous égarer si vous vous y attachez : le Livre de Dieu et ma Sunna. » S&#x27;y attacher est un salut ; les mordre avec les molaires est une réussite et une droiture.", "Et la plupart des manifestations de l&#x27;athéisme que nous voyons de nos yeux ont pour cause ce maudit, ce menteur de Satan : l&#x27;appel à rejeter le Livre et la Sunna et à ne pas en tirer les croyances. « Nous ne voulons ni du Livre ni de la Sunna ; nous sommes un peuple que Dieu a créé et qui a une raison ; le Livre et la Sunna ne conviennent qu&#x27;aux siècles passés. » Et l&#x27;un d&#x27;eux se met à ruminer, comme rumine la vache, ces doutes que lui jettent les diables des djinns et des hommes, jusqu&#x27;à ce qu&#x27;ils le détournent de la source de la guidée et le fassent tomber dans leurs pièges et leurs filets. Dès que les raisons et les cœurs sont éloignés du Livre et de la Sunna, les diables les saisissent, les démons les assaillent, les idées égarées et les doctrines destructrices y font leur nid, et elles corrompent la relation de l&#x27;homme avec Dieu et sa croyance en Lui.", "Le Livre et la Sunna vous suffisent ! Le Livre et la Sunna, et rien d&#x27;autre. Ne me soumets pas à une raison, ni à un effort personnel, ni à une opinion, ni à une école, ni à des visions, ni à des dévoilements, ni à des jugements de convenance, ni à une clarté ou une obscurité intérieures : soumets-moi seulement au Livre et à la Sunna. Une croyance sans preuve du Livre et de la Sunna, je ne l&#x27;accepte pas, je ne l&#x27;accepte jamais. Faites attention à cela et soyez-y vigilants, que Dieu vous accorde la réussite et affermisse vos pas."]}, {"id": "p1d", "g": "الأصل الأول: الأخذ من الكتاب والسنة", "gf": "Premier principe : le Livre et la Sunna", "ta": "الأدلة من السنة", "tf": "Les preuves tirées de la Sunna", "ar": ["والأدلة من السنة كثيرة جداً، ولكن الوقت يضيق بنا، لكن نذكر جملاً منها. في الصحيحين من حديث عائشة رضي الله عنها قالت: قال النبي صلى الله عليه وسلم: «من أحدث في أمرنا هذا ما ليس منه فهو رد». ويدخل الإحداث العقدي في المقام الأول؛ فجميع من أحدث عقائد لا دليل عليها من الكتاب والسنة فهي مردودة عليه غير مقبولة.", "وفي صحيح الإمام البخاري من حديث ابن عباس رضي الله عنهما قال النبي صلى الله عليه وسلم: «أبغض الناس إلى الله ثلاثة: ملحد في الحرم، ومبتغٍ في الإسلام سنة الجاهلية، ومطلب دم امرئ بغير حق ليهريق دمه». وكل من ابتغى عقائد أو قرر في الأمة عقائد ليس عليها أدلة من الكتاب ولا من السنة فقد ابتغى في الإسلام سنة الجاهلية.", "وفي السنن يقول النبي صلى الله عليه وسلم في حديث العرباض بن سارية المعروف: «فإنه من يعش منكم فسيرى اختلافاً كثيراً، فعليكم بسنتي وسنة الخلفاء الراشدين من بعدي، تمسكوا بها وعضوا عليها بالنواجذ، وإياكم ومحدثات الأمور، فإن كل محدثة بدعة، وكل بدعة ضلالة، وكل ضلالة في النار». حديث صحيح. فأمَرَنا هنا بالاعتصام والاستمساك بسنته وما عليه خلفاء أمته الأربعة رضي الله تعالى عنهم وأرضاهم.", "ويقول النبي صلى الله عليه وسلم: «كل أمتي يدخلون الجنة إلا من أبى». قالوا: ومن يأبى يا رسول الله؟ قال: «من أطاعني دخل الجنة ومن عصاني فقد أبى». وكل من اعتقد ما لا يدل عليه كتاب أو سنة فقد عصى رسول الله صلى الله عليه وسلم، وهذا إباء عن دخول الجنة.", "وفي صحيح الإمام مسلم من حديث جابر رضي الله عنه قال: جاءت ملائكة إلى النبي صلى الله عليه وسلم وهو نائم، فقال بعضهم لبعض: إن لصاحبكم هذا مثلاً فاضربوا له مثلاً. فقالوا: إنه نائم. وقال بعضهم: إن العين نائمة والقلب يقظان. فقالوا: مثله كمثل رجل بنى داراً وصنع فيها مأدبة، أي وليمة، وبعث داعياً؛ فمن أجاب الداعي دخل الدار وأكل من المأدبة، ومن لم يجب الداعي لم يدخل الدار ولم يأكل من المأدبة. فقالوا: أوِّلوها له يفقهها. قال بعضهم: إنه نائم، وقال بعضهم: إن العين نائمة والقلب يقظان. فقالوا: أما الدار فهي الجنة، وأما الداعي فهو محمد صلى الله عليه وسلم؛ فمن أجاب محمداً، أي أطاعه واتبع ما جاء به من العقائد والأعمال، دخل الدار، أي الجنة، وأكل من المأدبة، أي استمتع بما فيها من النعيم بالاعتقاد الصحيح. ولا تفتح أبواب الجنة إلا لأصحاب العقيدة الصحيحة؛ أهل التوحيد الصافي هم الذين تفتح لهم أبواب الجنة. ومن لم يجب الداعي لم يدخل الدار ولم يأكل من المأدبة. ومحمد فرّق بين الناس.", "وفي الصحيحين من حديث أبي موسى الأشعري رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «إنما مثلي ومثلكم كمثل رجل أتى قوماً فقال: يا قوم، إني رأيت الجيش بعيني، وأنا النذير العريان، فالنجاء النجاء! فأطاعه طائفة من قومه فأدلجوا على مهلهم فنجوا، وكذّبت طائفة منهم فأصبحوا مكانهم، فاجتاحهم الجيش فأهلكهم. فذلك مثل من أطاعني واتبع ما جئت به من الحق، ومثل من عصاني وكذّب ما جئت به من الحق». فمن اعتقد ما جاء به محمد صلى الله عليه وسلم من العقائد الصحيحة والأعمال الصريحة الراجحة، فإنه لا يستطيع الجيش، أي جيش العدو، جيش الشياطين، جيش الشبهات، جيش الشهوات، جيش الأبالسة، أن يدركه؛ ومن كذّب بمحمد صلى الله عليه وسلم واتبع هواه وما تمليه عليه شياطينه وعقله فإنه سوف تدركه هذه الجحافل الآثمة فتجتاحه وتقتله وتدمّره.", "وفي الصحيحين من حديث أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «إنما مثلي ومثلكم كمثل رجل استوقد ناراً، فلما أضاءت ما حوله جعل الفراش وهذه الدواب التي تقع في النار يقعن فيها، فجعل يحجزهن فيغلبنه ويتقحمن فيها، فأنا آخذ بحجزكم عن النار: هلمّ عن النار، وأنتم تفلتون من يدي» ــ وفي لفظ: «النجاء النجاء، فتغلبونني وتقحمون فيها». فلا نجاة لنا في ديننا واعتقاداتنا وأعمالنا وتعبداتنا إلا بأن نتابع محمداً صلى الله عليه وسلم.", "وفي الصحيحين من حديث أبي موسى رضي الله عنه قال: قال النبي صلى الله عليه وسلم: «مثل ما بعثني الله به من الهدى والعلم كمثل الغيث الكثير أصاب أرضاً، فكان منها طائفة قبلت الماء فأنبتت الكلأ والعشب الكثير، وأصاب منها طائفة أخرى أمسكت الماء فنفع الله بها الناس فشربوا وسقوا وزرعوا، وأصاب منها طائفة أخرى إنما هي قيعان لا تمسك ماءً ولا تنبت كلأً. فذلك، أي المثال الأول والثاني، مثل من فقه في دين الله ونفعه ما بعثني به من الهدى والعلم فعلِم وعلَّم، ومثل من لم يرفع بذلك رأساً ولم يقبل هدى الله الذي جئت به»."], "fr": ["Les preuves tirées de la Sunna sont très nombreuses, mais le temps nous presse ; citons-en quelques-unes. Dans les deux Sahih, d&#x27;après &#x27;Â&#x27;icha (que Dieu l&#x27;agrée) : le Prophète (que Dieu le bénisse et le salue) a dit : « Quiconque introduit dans notre affaire que voici ce qui n&#x27;en fait pas partie, cela est rejeté. » L&#x27;innovation en matière de croyance y entre en premier lieu : tous ceux qui ont introduit des croyances sans preuve du Livre et de la Sunna, elles sont rejetées et non acceptées.", "Dans le Sahih d&#x27;al-Boukhârî, d&#x27;après Ibn &#x27;Abbâs (que Dieu les agrée tous deux), le Prophète a dit : « Les plus détestés des gens auprès de Dieu sont trois : celui qui commet l&#x27;impiété dans le Sanctuaire sacré, celui qui cherche dans l&#x27;islam la pratique de la Jâhiliyya, et celui qui réclame le sang d&#x27;un homme sans droit pour le répandre. » Quiconque a recherché ou établi dans la communauté des croyances sans preuve du Livre ni de la Sunna a cherché dans l&#x27;islam la pratique de la Jâhiliyya.", "Dans les Sunan, le Prophète dit dans le hadith bien connu d&#x27;al-&#x27;Irbâd ibn Sâriya : « Celui d&#x27;entre vous qui vivra verra de nombreuses divergences. Attachez-vous à ma Sunna et à celle des califes bien guidés après moi ; tenez-y fermement, mordez-y avec les molaires. Prenez garde aux choses nouvellement introduites : toute chose nouvellement introduite est une innovation, toute innovation est un égarement, et tout égarement mène au Feu. » Hadith authentique. Il nous est ordonné ici de nous attacher à sa Sunna et à ce que suivaient les quatre califes de sa communauté, que Dieu les agrée.", "Le Prophète dit : « Toute ma communauté entrera au Paradis, sauf celui qui refuse. » On dit : « Qui refuse, ô Messager de Dieu ? » Il répondit : « Celui qui m&#x27;obéit entre au Paradis, et celui qui me désobéit a refusé. » Tout homme qui croit ce que ne prouvent ni le Livre ni la Sunna a désobéi au Messager de Dieu, et c&#x27;est un refus d&#x27;entrer au Paradis.", "Dans le Sahih de Muslim, d&#x27;après Jâbir (que Dieu l&#x27;agrée) : des anges vinrent au Prophète alors qu&#x27;il dormait. Certains dirent aux autres : « Votre compagnon que voici a une parabole, faites-lui une parabole. » Ils dirent : « Il dort. » D&#x27;autres dirent : « L&#x27;œil dort, mais le cœur veille. » Ils dirent : « Il est comme un homme qui a construit une maison et y a préparé un festin, puis a envoyé un appelant. Celui qui répond à l&#x27;appelant entre dans la maison et mange du festin ; celui qui ne répond pas à l&#x27;appelant n&#x27;entre pas dans la maison et ne mange pas du festin. » Ils dirent : « Interprétez-lui cela pour qu&#x27;il le comprenne. » (Certains dirent : « Il dort », d&#x27;autres : « L&#x27;œil dort et le cœur veille. ») Ils dirent : « La maison, c&#x27;est le Paradis ; l&#x27;appelant, c&#x27;est Muhammad, que Dieu le bénisse et le salue. Celui qui répond à Muhammad », c&#x27;est-à-dire lui obéit et suit ce qu&#x27;il a apporté en croyances et en œuvres, « entre dans la maison », c&#x27;est-à-dire au Paradis, « et mange du festin », c&#x27;est-à-dire jouit de ses délices grâce à la croyance correcte. Les portes du Paradis ne s&#x27;ouvrent qu&#x27;aux détenteurs de la croyance correcte : ce sont les gens de l&#x27;unicité pure à qui les portes du Paradis s&#x27;ouvrent. « Celui qui ne répond pas à l&#x27;appelant n&#x27;entre pas dans la maison et ne mange pas du festin. » Muhammad a établi une séparation entre les gens.", "Dans les deux Sahih, d&#x27;après Abû Mûsâ al-Ach&#x27;arî (que Dieu l&#x27;agrée), le Messager de Dieu a dit : « Ma parabole et la vôtre est celle d&#x27;un homme venu vers son peuple, disant : &quot;Ô mon peuple, j&#x27;ai vu l&#x27;armée de mes propres yeux, et je suis l&#x27;avertisseur nu : sauvez-vous, sauvez-vous !&quot; Un groupe de son peuple lui obéit, partit de nuit à son aise et fut sauvé. Un autre groupe le traita de menteur et resta à sa place au matin : l&#x27;armée les submergea et les anéantit. Telle est la parabole de celui qui m&#x27;obéit et suit la vérité que j&#x27;ai apportée, et de celui qui me désobéit et traite de mensonge la vérité que j&#x27;ai apportée. » Celui qui croit ce que Muhammad (que Dieu le bénisse et le salue) a apporté de croyances correctes et d&#x27;œuvres claires et solides, l&#x27;armée, c&#x27;est-à-dire l&#x27;armée de l&#x27;ennemi, l&#x27;armée des diables, des doutes, des passions et des démons, ne peut l&#x27;atteindre. Celui qui traite Muhammad de menteur et suit sa passion, ce que lui dictent ses démons et sa raison, ces hordes pécheresses l&#x27;atteindront, le submergeront, le tueront et le détruiront.", "Dans les deux Sahih, d&#x27;après Abû Hourayra (que Dieu l&#x27;agrée), le Messager de Dieu a dit : « Ma parabole et la vôtre est celle d&#x27;un homme qui alluma un feu. Quand il eut éclairé ce qui l&#x27;entourait, les papillons et ces insectes qui tombent dans le feu s&#x27;y jetèrent. Il se mit à les retenir, mais ils le vainquirent et s&#x27;y précipitèrent. Moi, je vous retiens par la taille loin du Feu : &quot;Sauvez-vous, sauvez-vous !&quot; Mais vous me vainquez et vous vous y précipitez. » Il n&#x27;y a donc de salut pour nous, dans notre religion, nos croyances, nos œuvres et nos actes d&#x27;adoration, que par le fait de suivre Muhammad, que Dieu le bénisse et le salue.", "Dans les deux Sahih, d&#x27;après Abû Mûsâ (que Dieu l&#x27;agrée), le Prophète a dit : « La parabole de la guidée et de la science avec lesquelles Dieu m&#x27;a envoyé est celle d&#x27;une pluie abondante tombée sur une terre. Une partie de cette terre, fertile, a absorbé l&#x27;eau et fait pousser l&#x27;herbe et une abondante végétation. Une autre partie, dure, a retenu l&#x27;eau, et Dieu en a fait profiter les gens : ils ont bu, abreuvé et semé. Une autre partie encore n&#x27;est qu&#x27;un sol aride qui ne retient pas l&#x27;eau et ne fait rien pousser. » Les deux premiers exemples sont celui qui a compris la religion de Dieu et tiré profit de ce avec quoi Dieu m&#x27;a envoyé, de guidée et de science : il a appris et enseigné. Le dernier est celui qui n&#x27;y a pas levé la tête et n&#x27;a pas accepté la guidée de Dieu que j&#x27;ai apportée."]}, {"id": "p1e", "g": "الأصل الأول: الأخذ من الكتاب والسنة", "gf": "Premier principe : le Livre et la Sunna", "ta": "إجماع السلف وخلاصة الأصل الأول", "tf": "Le consensus des salaf et conclusion du premier principe", "ar": ["والأدلة على هذا المعنى كثيرة، فشدوا على هذا الأصل العظيم بأيديكم. وقد أجمع علماء أهل السنة والجماعة على صحة هذا الأصل وعلى تقريره وعلى دعوة الأمة إليه. فهذا عبد الله بن مسعود يقول: «اتبعوا ولا تبتدعوا فقد كُفيتم». وقال رضي الله تعالى عنه وأرضاه: «إنا نتبع ولا نبتدع، ونقتدي ولا نبتدي، ولا نزال بخير ما كنا على الأثر». وإذا أطلق السلف الأثر فيقصدون به الكتاب والسنة.", "ألا هل بلغت؟ اللهم اشهد! هذا أصل عظيم، هو الفيصل بين أهل السنة وأهل البدعة؛ فتحزّموا بهذا السلاح العظيم، ولا تأخذوا معتقداتكم إلا من الكتاب والسنة. وإذا نظرت إلى غالب ضلال الأمم لوجدت أن وراءه عدم الأخذ بالكتاب والسنة.", "هل هذا الأصل كافٍ؟ الجواب: لا. انتبه! ما يكفيك هذا؛ لا بد أن تقرنه بالأصل الثاني على طول، بل لا تنتفع حقيقة الانتفاع بالأصل الأول إلا مربوطاً بالأصل الثاني. فلو أنك كفرت بالأصل الثاني أو أبيت ورفضت، فحقيقة رفضك له رفض للأصل الأول. ما هو الأصل الثاني؟ وما حقيقته؟"], "fr": ["Les preuves en ce sens sont nombreuses. Serrez donc ce grand principe de toutes vos mains ! Les savants des gens de la Sunna et de la communauté sont unanimes sur la validité de ce principe, sur son établissement et sur l&#x27;appel de la communauté à le suivre. Ainsi &#x27;Abdallah ibn Mas&#x27;ûd dit : « Suivez et n&#x27;innovez pas : vous êtes déjà comblés. » Et il dit aussi, que Dieu l&#x27;agrée : « Nous suivons et nous n&#x27;innovons pas ; nous imitons et nous ne prenons pas les devants ; et nous resterons dans le bien tant que nous suivrons la trace (al-athar). » Lorsque les anciens disent « la trace », ils entendent par là le Livre et la Sunna.", "Ai-je transmis ? Ô Dieu, sois témoin ! C&#x27;est un grand principe, il est le critère de séparation entre les gens de la Sunna et les gens de l&#x27;innovation. Ceignez-vous donc de cette arme puissante et ne prenez vos croyances que du Livre et de la Sunna. Si tu observes l&#x27;égarement de la plupart des peuples, tu constateras qu&#x27;il y a derrière lui le fait de ne pas s&#x27;attacher au Livre et à la Sunna.", "Ce principe suffit-il ? La réponse est : non. Attention ! Il ne te suffit pas : il faut aussitôt le lier au second principe. Bien plus, tu ne tires réellement profit du premier principe que s&#x27;il est lié au second. Si tu reniais le second ou le refusais, ton refus serait en réalité un refus du premier.", "Quel est le second principe, et quelle en est la réalité ?"]}, {"id": "p2a", "g": "الأصل الثاني: فهم السلف", "gf": "Deuxième principe : la compréhension des salaf", "ta": "تقرير الأصل الثاني", "tf": "Énoncé du deuxième principe", "ar": ["الأصل الثاني يقول: ألّا نفهم أدلة الكتاب والسنة إلا على مقتضى فهم سلف الأمة. لا يحل لك أن تفهم الكتاب والسنة على فهمك أنت، ولا تفسّر أدلة الاعتقاد على ما يحلو لك أنت. احذر! ففهم أدلة الاعتقاد توقيفي لا اجتهاد فيه. لا يحل لأحد من متأخري الأمة أن يأتي إلى شيء من أدلة الاعتقاد ويفهمها من تلقاء نفسه غير مستضيء بفهم السلف.", "هذا من أخطر الدعوات التي يدعو بها الفجرة والعلمانيون والليبراليون هذا اليوم والملاحدة. يقولون: تبون الكتاب والسنة؟ أبشروا بالخير، يلا عندكم الكتاب والسنة، بس بشرط: خلّني أسبح يا أخي بفهم جديد. لماذا تربطني بأفهام أناس قد ماتوا؟ هؤلاء رجال ونحن رجال، هؤلاء لهم فهمهم في زمانهم ونحن لنا فهمنا في زماننا. أقول: لا.", "الكلام ليس عن آيات الإعجاز في الكون؛ هذه يتجدد فيها الفهم على حسب ما يتجدد من المكتشفات التي يرى الناس بها ما لم يكن السلف يستطيعون رؤيته في آفاق الكون. لا أتكلم في قضية آيات الإعجاز، ولكن أتكلم في أدلة الاعتقاد: أدلة الأسماء والصفات، أدلة إثبات وجود الله وألوهيته وربوبيته، أدلة الملائكة، أدلة حقائق اليوم الآخر، أدلة الصحابة، الأدلة التي يتكلم فيها الله عن القدر وعن الأنبياء؛ يعني عامة أدلة الاعتقاد. الفهم فيها قد أُغلق، الفهم فيها قد أُغلق، الفهم فيها قد أُغلق.", "لا يجوز لأحد أن يفهم شيئاً من أدلة الكتاب والسنة في مسائل الاعتقاد إلا على فهم سلف الأمة. انتبه، لا تجتهد بفهم جديد! ولذلك احفظوا هذا الأصل الثاني الذي يقول: كل فهم في أدلة الاعتقاد يخالف فهم الصحابة فهو باطل؛ لأنني أقصد بالسلف أي الصحابة رضي الله تعالى عنهم وأرضاهم."], "fr": ["Le second principe dit : ne comprendre les preuves du Livre et de la Sunna que conformément à la compréhension des pieux prédécesseurs (as-salaf) de la communauté. Il ne t&#x27;est pas permis de comprendre le Livre et la Sunna selon ta propre compréhension, ni d&#x27;interpréter les preuves de la croyance comme il te plaît. Prends garde : la compréhension des preuves de croyance est fixée par la transmission (tawqîfî), sans place pour l&#x27;effort personnel.", "Il n&#x27;est permis à personne, parmi les derniers venus de la communauté, de s&#x27;approcher d&#x27;une preuve de croyance et de la comprendre de son propre chef, sans s&#x27;éclairer de la compréhension des salaf. C&#x27;est l&#x27;un des appels les plus dangereux que lancent aujourd&#x27;hui les libertins, les laïcistes, les libéraux et les athées. Ils disent : « Vous voulez le Livre et la Sunna ? Bonne nouvelle, les voici, mais à une condition : laissez-moi nager avec une compréhension nouvelle. Pourquoi me lier aux compréhensions de gens qui sont morts ? Ils étaient des hommes, nous sommes des hommes ; ils avaient leur compréhension en leur temps, nous avons la nôtre en notre temps. » Je dis : non.", "Il ne s&#x27;agit pas ici des versets des signes miraculeux dans l&#x27;univers : leur compréhension se renouvelle avec les découvertes qui permettent aux gens de voir ce que les salaf ne pouvaient voir aux horizons de l&#x27;univers. Je ne parle pas des signes miraculeux, mais des preuves de croyance : les preuves des Noms et des Attributs, les preuves de l&#x27;existence de Dieu, de Sa divinité et de Sa seigneurie, les preuves des anges, des réalités du Jour dernier, des compagnons, les preuves où Dieu parle du destin et des prophètes ; bref, toutes les preuves de croyance. La compréhension y est fermée. La compréhension y est fermée. La compréhension y est fermée.", "Il n&#x27;est permis à personne de comprendre quoi que ce soit des preuves du Livre et de la Sunna en matière de croyance autrement que selon la compréhension des salaf. Attention : ne fais pas d&#x27;effort personnel pour une compréhension nouvelle. Retenez donc ce second principe : toute compréhension des preuves de croyance qui contredit celle des compagnons est fausse, car par « salaf » j&#x27;entends les compagnons, que Dieu les agrée."]}, {"id": "p2b", "g": "الأصل الثاني: فهم السلف", "gf": "Deuxième principe : la compréhension des salaf", "ta": "تزكية الله لفهم الصحابة", "tf": "Dieu a purifié la compréhension des compagnons", "ar": ["الصحابة في أدلة الاعتقاد لهم فهم خاص، الله عز وجل زكّى فهمهم، وحذّر الأمة من مجانبة سبيلهم في العمل والعقيدة والفهم. فقال الله عز وجل: ﴿لقد رضي الله عن المؤمنين إذ يبايعونك تحت الشجرة﴾؛ وهذا الرضا مبني على صحة الاعتقاد فيهم، إذ الله لا يرضى عمن كانت عقيدته فاسدة. وقال الله عز وجل مادحاً لهم: ﴿محمد رسول الله والذين معه﴾، الصحابة من المهاجرين والأنصار رضي الله عنهم وأرضاهم، ﴿أشداء على الكفار رحماء بينهم تراهم ركعاً سجداً يبتغون فضلاً من الله ورضواناً سيماهم في وجوههم من أثر السجود ذلك مثلهم في التوراة ومثلهم في الإنجيل كزرع أخرج شطأه فآزره فاستغلظ فاستوى على سوقه يعجب الزراع ليغيظ بهم الكفار﴾. هذا المدح العظيم وهذا الثناء العاطر على الصحابة مبني على سلامة اعتقادهم وفهمهم في أدلة الكتاب والسنة؛ لو كانت عقيدتهم خطأ أو فهمهم خطأ لما استحقوا هذا الثناء العاطر من الله عز وجل.", "ويقول الله تبارك وتعالى: ﴿والسابقون الأولون من المهاجرين والأنصار والذين اتبعوهم بإحسان رضي الله عنهم ورضوا عنه وأعد لهم جنات تجري تحتها الأنهار خالدين فيها أبداً﴾؛ أي لسلامة عقائدهم وأعمالهم وفهمهم في أدلة الكتاب والسنة. لا يمكن أن يأتي من بعدهم بفهم جديد في أدلة العقائد؛ بل جميع من جاء بعدهم بفهم جديد إنما هم من أهل البدع. والعجيب العجيب أن عامة أهل البدع يكفرون بهذا الأصل الثاني كما كفروا بالأصل الأول. فهم وإن دغدغوا مشاعرنا بالاستدلال على عقائدهم بشيء من آيات الكتاب والسنة، يمكن تسمع من الرافضي آية أو حديثاً، يمكن تسمع من المعتزلي آية أو حديثاً، لكن العلة فيها ما هي؟ أنه يفهمها على خلاف فهم الصحابة، بل يفهمها على أصول مذهبه الفاسدة، وعلى عقله المنتن المبني على القواعد الفلسفية المنطقية المناقضة للمعقول والمخالفة للمنقول.", "فإذن ليس كل من قال «قال الله» يكون صادقاً، أو «قال رسوله» يكون ناصحاً، حتى ترى كيف يفهم الآية وكيف يفهم الحديث، ثم تعرض فهمه على فهم السلف الصالح؛ فإن اتفق معه فهذا رجل ناصح، هذا رجل طيب، هذا على الصراط المستقيم. وأما إن رأيته يستدل بالقرآن والسنة ثم ينأى بفهمهما عن شعب فهم السلف، ويأتي بأفهام جديدة وآراء واجتهادات غريبة عن منهج السلف، فاعلم أنه على ضلال، واشطب عليه بـ«إكس»، ولا تسمع منه شيئاً أبداً، احذر منه.", "ولذلك يقول الله عز وجل: ﴿ومن يشاقق الرسول من بعد ما تبين له الهدى ويتبع غير سبيل المؤمنين نوله ما تولى ونصله جهنم وساءت مصيراً﴾. من يدخل في وصف المؤمنين بالأصالة في هذه الآية؟ الصحابة، ومن بعدهم بالتبع. أول من يدخل بالأصالة في هذه الصفة هم الصحابة؛ فالله توعّد من اتبع غير سبيل الصحابة بأنه يوليه ما تولى ويصليه جهنم وساءت مصيراً. سبيلهم في ماذا؟ سبيلهم في العقائد والأعمال والأفهام. كل فهم يخالف فهم الصحابة في أدلة العقيدة فهو باطل، كل فهم يخالف فهم الصحابة في مسائل العقيدة فهو باطل. احفظوها: كل فهم يخالف فهم الصحابة في مسائل العقيدة فهو باطل. وأسألكم الآن بعد ما انتهيت من المحاضرة: كل فهم يخالف فهم الصحابة في مسائل العقيدة فهو...؟ باطل."], "fr": ["Les compagnons ont, dans les preuves de croyance, une compréhension qui leur est propre. Dieu, le Puissant et Majestueux, a purifié leur compréhension et a mis la communauté en garde contre le fait de s&#x27;écarter de leur voie dans l&#x27;œuvre, la croyance et la compréhension. Dieu dit : « Dieu a agréé les croyants lorsqu&#x27;ils te prêtaient serment sous l&#x27;arbre. » Cet agrément repose sur la justesse de la croyance, car Dieu n&#x27;agrée pas celui dont la croyance est corrompue.", "Et Dieu les loue en disant : « Muhammad est le Messager de Dieu ; et ceux qui sont avec lui » (les compagnons, émigrés et auxiliaires, que Dieu les agrée) « sont durs envers les mécréants et miséricordieux entre eux. Tu les vois inclinés, prosternés, recherchant une grâce de Dieu et Son agrément. Leur marque est sur leurs visages, trace de la prosternation. Telle est leur parabole dans la Torah, et leur parabole dans l&#x27;Évangile est celle d&#x27;une semence qui fait sortir sa pousse, la fortifie, qui devient épaisse et se dresse sur sa tige, à la joie des semeurs, afin qu&#x27;Il irrite par eux les mécréants. » Toute cette grande louange et cet éloge parfumé reposent sur la justesse de leur croyance et de leur compréhension des preuves du Livre et de la Sunna. Si leur croyance ou leur compréhension avait été erronée, ils n&#x27;auraient pas mérité cet éloge de Dieu.", "Dieu, béni et exalté, dit : « Les premiers et les tout premiers parmi les émigrés et les auxiliaires, et ceux qui les ont suivis en bien, Dieu les agrée et ils L&#x27;agréent ; Il leur a préparé des jardins sous lesquels coulent les ruisseaux, où ils demeureront éternellement. » Cela, pour la justesse de leurs croyances, de leurs œuvres et de leur compréhension des preuves du Livre et de la Sunna. Il est impossible que vienne après eux quelqu&#x27;un avec une compréhension nouvelle des preuves de croyance : tous ceux qui sont venus après eux avec une compréhension nouvelle sont des gens d&#x27;innovation.", "Et le plus étonnant, le plus étonnant, c&#x27;est que la plupart des gens d&#x27;innovation renient ce second principe comme ils ont renié le premier. Ils peuvent certes caresser nos sentiments en argumentant pour leurs croyances par quelque verset du Livre ou quelque hadith : tu peux entendre du Rafidite un verset ou un hadith, du Mu&#x27;tazilite un verset ou un hadith. Mais où est le défaut ? C&#x27;est qu&#x27;il les comprend à l&#x27;inverse de la compréhension des compagnons ; il les comprend selon les principes de sa doctrine corrompue et selon sa raison nauséabonde, bâtie sur des règles philosophiques et logiques contraires au rationnel et au transmis.", "Ce n&#x27;est donc pas tout homme qui dit « Dieu a dit » qui est sincère, ni tout homme qui dit « Son Messager a dit » qui est un conseiller sincère, tant que tu n&#x27;as pas vu comment il comprend le verset et le hadith, puis présenté sa compréhension à celle des pieux anciens. S&#x27;il s&#x27;accorde avec elle, c&#x27;est un homme sincère, un homme bien, sur le droit chemin. Mais si tu le vois argumenter par le Coran et la Sunna et s&#x27;éloigner, dans leur compréhension, de la voie des salaf, apportant des compréhensions nouvelles, des opinions et des efforts étrangers à la méthode des salaf, sache qu&#x27;il est dans l&#x27;égarement : raye-le d&#x27;une croix et n&#x27;écoute plus jamais rien de lui. Prends garde à lui.", "C&#x27;est pourquoi Dieu dit : « Quiconque s&#x27;oppose au Messager après que la guidée lui est apparue et suit un autre chemin que celui des croyants… » Qui entre, par essence, dans la description des croyants dans ce verset ? Les compagnons, puis ceux qui les suivent. Dieu menace celui qui suit un autre chemin que celui des compagnons : « Nous le laisserons à ce vers quoi il s&#x27;est tourné, et le ferons entrer en Géhenne, quelle mauvaise destination ! » Leur chemin en quoi ? Dans les croyances, les œuvres et les compréhensions.", "Toute compréhension qui contredit celle des compagnons dans les preuves de croyance est fausse. Toute compréhension qui contredit celle des compagnons dans les questions de croyance est fausse. Retenez-le : toute compréhension qui contredit celle des compagnons dans les questions de croyance est fausse. Et je vous poserai la question après la conférence : toute compréhension qui contredit celle des compagnons dans les questions de croyance est… fausse."]}, {"id": "p2c", "g": "الأصل الثاني: فهم السلف", "gf": "Deuxième principe : la compréhension des salaf", "ta": "أمثلة تطبيقية", "tf": "Exemples d'application", "ar": ["قالوا: يا أبا راشد، اضرب لنا أمثلة عشان توضح. طيب، خذ.", "إن من العقائد الكفرية الاعتزالية، المعتزلة من عقائدهم الكفرية: إنكار رؤية الله يوم القيامة في الجنة. ينكرونها يا رجل! يقولون: الله ما يراه أهل الجنة، ما في شيء اسمه رؤية الله يوم القيامة. هذه عقيدة صحيحة ولا باطلة؟ عقيدة باطلة باتفاق المسلمين، عقيدة باطلة. المشكلة ما هي يا إخواني؟ المشكلة أنهم يستدلون على عقيدتهم هذه بآية من القرآن، بآية من القرآن تدل على أن الله ما يرى في الجنة! يا رجل، من القرآن! وين هذه؟ قال: اسمع، أوَلم يقل الله عز وجل في سورة الأعراف: ﴿ولما جاء موسى لميقاتنا وكلمه ربه قال ربِّ أرني أنظر إليك قال لن تراني﴾؟ «لن تراني»! هذه آية من القرآن ولا لا؟ الجواب: نعم. يجيك المعتزلي مبسوط يقول: أنت يا سني تبي على عقيدتك آية من القرآن، أنا جبت لك على عقيدتي آية من القرآن!", "فكيف ترد عليه؟ ترد عليه بالأصل الثاني مباشرة. وهي أنك تقول له: أيها المعتزلي، اخسأ! كذبتَ على الله وعلى رسوله وعلى عقيدة المسلمين! فإن الصحابة متفقون على أن الرؤية المنفية في هذه الآية إنما هي نفي للرؤية في الدنيا فقط؛ الله ما يُرى في الدنيا. وأما في الجنة فقد تواترت الأدلة من الكتاب والسنة والإجماع على أنه يُرى رؤية حقيقية تليق بجلاله وعظمته. يخسأ المعتزلي حينئذ ويندحر، يهرب، لأنك رددت عليه. الصحابة كانت تطرق مسامعهم هذه الآية «لن تراني»، يعني ما قرأها إلا أنت يا المعتزلي؟! قرأها أبو بكر ولم يفهم فهمك، قرأها عمر ولم يفهم فهمك، قرأها عثمان وعلي والمهاجرون والأنصار والسلف الصالح والأئمة، ومع ذلك ما فهموا فهمك أنت. ففهمك في هذه الآية فهم مخالف لفهم السلف، وكل فهم مخالف لفهم السلف فهو فهم باطل.", "ولذلك يضيق أهل البدع من هذا الأصل الثاني، ويبون يفكّون الكتاب والسنة عن فهم السلف، يبون يفكّونها! هذا الكتاب والسنة وفهم السلف سياج يحمي الكتاب والسنة من دخول المبتدعة بالاستدلال فيها. «يا الربع، فكّونا من السلف الصالح! يا الربع، فكّونا من فهم الصحابة! خلّوا الناس في القرن العشرين يفهمون القرآن على فهم عصرهم يا أخي! لا تجعلني أفهم على فهم أناس قد ماتوا وأكل الدود لحومهم وعظامهم، ما عندهم مكتبات ولا عندهم مخترعات. نحن في القرن العشرين، قرن التطور، قرن صعدنا فيه على القمر، واكتشفنا وجبنا فيه أرجاء الفضاء! فكّونا من فهم السلف!» نقول: لا، اخسأ! أما هذه فلا. كل من استدل بالقرآن، انتبهوا، كل من استدل بالقرآن وفهمه على غير فهم السلف فهو منكر للقرآن وكافر به، حتى ولو قال «قال الله»، حتى ولو قال «قال رسول الله»؛ المهم الفهم، كيف تفهمه؟ الفهم كيف تفهم؟ هذا هو الصح. اللهم اهدِ قلوبنا يا رب العالمين.", "خذوا مثالاً ثانياً: ناقشنا رجلاً من الصوفية يوماً من الأيام، ممن يعبدون القبور من دون الله، يطوفون حول الأضرحة، يدعونها، يستغيثون بها من دون الله عز وجل. فلما ناقشناه قال: كيف تنكرون عليَّ ذلك وأنا عاملٌ بمقتضى القرآن؟ لا حول ولا قوة إلا بالله! هذه الأفعال الوثنية الشركية يدل عليها القرآن؟! قال: نعم. في أي آية من القرآن تدل عليها؟ تدل؟ ما هذه الآية؟ عطنا إياها. قال: قول الله عز وجل: ﴿ألا إن أولياء الله لا خوف عليهم ولا هم يحزنون﴾.", "هل تستطيع أن تقول: لا يا أخي، هذه سندها ضعيف، هذه ليست من القرآن؟ لا، الرد لا يكون هكذا. هي آية من القرآن، ولكن الخلل عندك أيها القبوري الصوفي إنما هو في فهمها؛ فإن الصحابة مجمعون على أن هذه الآية لا تدل على ما فهمته أنت منها لا في صدر ولا في ورد؛ فلا تدل على النذر للقبور، ولا تدل على جواز الذبح للأولياء، ولا تدل على الطواف حول قبورهم، ولا تدل على دعائهم واستغاثتهم من دون الله في تفريج الكربات وإغاثة اللهفات مطلقاً، ما تدل عليها. لكنك أنت بسبب سوء فهمك أصبحت تفهم من القرآن ما لا دليل عليه أبداً، وهو مخالف المخالفة المطلقة لفهم السلف الصالح. فإذن فهمك أيها الصوفي لهذه الآية على خلاف فهم السلف الصالح، والمتقرر في القواعد والأصول أن كل فهم يخالف فهم السلف الصالح فهو باطل. كذا ينقطع.", "والأدهى والأمرّ: واحد آخر يجيز الاستغاثة واستغفار النبي صلى الله عليه وسلم عند قبره؛ يقول: يجوز لك أن تقف عند قبر النبي صلى الله عليه وسلم وتستغفر وتدعوه من دون الله عز وجل، والدليل القرآن! لا حول ولا قوة إلا بالله! دليل القرآن على هذا الشرك الصراح المحض؟ دليله القرآن؟ قال: نعم. وين؟ فقال: في سورة النساء قول الله عز وجل: ﴿ولو أنهم إذ ظلموا أنفسهم جاؤوك فاستغفروا الله واستغفر لهم الرسول لوجدوا الله توابا رحيماً﴾. ويفهم من المجيء أنه المجيء المطلق في حياته وبعد مماته.", "هل هذا الفهم متفق مع فهم الصحابة والسلف الصالح؟ الجواب: لا. أما الآية فلا نقاش لنا فيها، هي آية من القرآن، لا كلام لنا فيها، لكن كلامنا في فهمٍ لها. فأنت تفهم أن الله عز وجل قال «جاؤوك» وتفهم من هذا المجيء أنه مجيء مطلق في حياته وبعد مماته. والصحابة والسلف الصالح والأئمة متفقون على أن المجيء الوارد في الآية إنما هو مجيء له في حياته فقط، لا بعد مماته. فإذن الخلل عندك في أي شيء؟ في الفهم الباطل. وهل أفسد الدنيا إلا الفهم الباطل؟", "وأول الخليقة فهم فهماً باطلاً: من هو؟ إبليس اللعين، نعوذ بالله منه، فهم فهماً باطلاً. لما أمره الله عز وجل أن يسجد لأبينا آدم، نظر في عنصره فرآه نارياً، ونظر في عنصر آدم فوجده طينياً، فقال: إن النار خير من الطين، فالمفضول، أي آدم، هو الذي يسجد للفاضل. بسبب ماذا؟ الفهم الفاسد. فالذي أفسد على الناس وعلى الأمم وعلى الطوائف عقائدَهم إنما هو الفهم الفاسد. فإذن في الأصل الثاني هذا يريد السلفُ أن يعصموا فهمك؛ القرآن والسنة موجودان، لكن الخطأ وين فيه؟ في الفهم. فقررنا هذه القاعدة حتى يُعصم فهمُ الناظر في أدلة الكتاب والسنة.", "خذ مثالاً ثالثاً أو رابعاً من العقائد المعتزلية الكفرية: أن القرآن مخلوق. القرآن ليس كلام الله بل هو مخلوق، أعوذ بالله! مع أن أهل السنة مجمعون على أن من قال بأن القرآن مخلوق فإنه كافر. لكن لو جئت تناقش المعتزلي قام يستدل لك على هذه العقيدة الكفرية بآية من القرآن! أعوذ بالله، القرآن يدل على أنه مخلوق؟ الجواب: نعم، يقول: نعم، عندنا آية في القرآن تدل على أنه مخلوق. يا رجل اتق الله، كيف؟ في آية تدل على أنه مخلوق والسلف يقولون: من قال بخلقه فهو كافر؟ عطنا هذه الآية نشوف إيش هي، عاطنا هذه الآية، عجّل علينا بها. قال: ألم تسمع إلى قول الله عز وجل: ﴿ما يأتيهم من ذكر من ربهم محدث إلا استمعوه وهم يلعبون﴾؟ محدث، والمحدث مخلوق؛ فكأن الله قال: ما يأتيهم من ذكر من ربهم مخلوق إلا استمعوه وهم يلعبون.", "كيف تجاوب بالله عليك؟ كيف ترد عليه؟ في القنوات يقولون هذا الكلام، وفي مواقع الإنترنت يقولون هذا الكلام، ترى هذا كلام ليس اختراعاً مني، هي أمثلة لكنها أمثلة واقعية تطبيقية نسمعها في مواقعهم. كيف تجيب عليه؟ تقول: أما الآية فلا كلام لي عليها، ولكن الكلام على فهمك أيها المعتزلي الخبيث؛ أنت فهمت فهماً في هذه الآية قد اتفق السلف الصالح على بطلانه؛ فإن «محدث» هنا باجماع الصحابة والسلف الصالح إنما هو الشيء الجديد وليس هو الشيء المخلوق؛ ما يأتيهم من ذكر من ربهم جديد، لأن القرآن كان ينزل على مدار زمن النبوة متتابعاً حسب الحوادث، فكلما نزل قرآن جديد قابله الكفار بالإعراض واللعب واللهو وعدم الإيمان به. ما يأتيهم من ذكر من ربهم جديد؛ فالسلف مجمعون على أن معنى «محدث» هنا إنما هو الشيء الجديد، وليس المقصود به الشيء المخلوق. فأنت أيها المعتزلي الضال فهمت من هذه الآية فهماً يخالف فهم السلف الصالح، والقاعدة تقول: كل فهم في مسائل الاعتقاد يخالف فهم السلف الصالح فهو... جاوبوا يا إخوان... باطل. باطل، فهو باطل، وأباهل على أنه باطل، وأقسم بالله ثلاثة أيمان أنه باطل. ولا حظَّ ولا حظَّ لسلامة الاعتقاد لرجل لا يأخذ عقائده من الكتاب على فهم سلف الأمة.", "شوفوا يا جماعة: الأشاعرة كلهم، كل الأشاعرة، يقولون في ﴿ويبقى وجه ربك﴾: الوجه يراد به الذات. خطأ! الصحابة متفقون على أنه يراد به الوجه الذاتي اللائق بالله عز وجل. قال الله عز وجل: ﴿بل يداه مبسوطتان﴾؛ الأشاعرة يقولون: المراد بها النعمة والقدرة. خطأ! السلف متفقون على أنها يدان حقيقيتان ذاتيتان لائقتان بجلاله وعظمته. «ينزل ربنا»: الأشاعرة يقولون: ينزل أمر ربنا، ينزل ملَك ربنا، ينزل رحمة ربنا. خطأ! بل السلف متفقون على أنه نزول إلهي يليق بجلاله وعظمته. في جميع الآيات! يقول الله عز وجل: ﴿ورحمتي وسعت كل شيء﴾؛ الأشاعرة وأهل البدع يقولون: الرحمة إرادة الإحسان. خطأ! بل هي رحمة لائقة بجلال الله وعظمته. قال: «حتى يضع رب العزة فيها رجله»، وفي رواية: «عليها قدمه»؛ أهل البدع يقولون: القدم والرجل أي الطائفة من الناس. خطأ! بل هي رجل الله وقدمه على الوجه اللائق به عز وجل. لا ندخل في هذا الباب متأولين بآرائنا ولا متوهمين بأهوائنا، فإن الله ﴿ليس كمثله شيء وهو السميع البصير﴾. هذه قاعدة تنسف جميع عقائد أهل البدع."], "fr": ["Vous dites : « Ô Abou Râchid, donne-nous des exemples pour que ce soit clair. » Voici.", "<b>Premier exemple.<\/b> Parmi les croyances mécréantes des Mu&#x27;tazilites : le déni de la vision de Dieu au Jour de la résurrection, au Paradis. Ils la nient. Ils disent : Dieu n&#x27;est pas vu par les gens du Paradis, il n&#x27;existe rien qui s&#x27;appelle la vision de Dieu au Jour de la résurrection. Cette croyance est-elle correcte ou fausse ? Fausse, par consensus des musulmans. Le problème, mes frères, c&#x27;est qu&#x27;ils argumentent pour cette croyance par un verset du Coran, un verset qui prouverait que Dieu ne sera pas vu au Paradis. Lequel ? Dieu, le Puissant et Majestueux, dit dans la sourate al-A&#x27;râf : « Et lorsque Moïse vint à Notre rendez-vous et que son Seigneur lui parla, il dit : &quot;Mon Seigneur, montre-Toi à moi que je Te regarde.&quot; Il dit : &quot;Tu ne Me verras pas.&quot; » C&#x27;est un verset du Coran, oui ou non ? Oui. Le Mu&#x27;tazilite arrive tout content : « Toi, le sunnite, tu veux un verset pour ta croyance ; moi, je t&#x27;ai apporté un verset pour la mienne. »", "Comment lui répondre ? Tu lui réponds directement par le second principe : « Arrière, ô Mu&#x27;tazilite ! Tu as menti sur Dieu, sur Son Messager et sur la croyance des musulmans. Les compagnons sont unanimes : la vision niée dans ce verset est la négation de la vision en ce monde seulement. Dieu n&#x27;est pas vu en ce monde. Quant au Paradis, les preuves du Livre, de la Sunna et le consensus sont concordantes : on Le verra d&#x27;une vision réelle qui convient à Sa majesté et à Sa grandeur. » Le Mu&#x27;tazilite recule alors et prend la fuite, car tu lui as répondu. Les compagnons entendaient ce verset « Tu ne Me verras pas » : ce n&#x27;est pas toi seul, ô Mu&#x27;tazilite, qui l&#x27;as lu ! Abou Bakr l&#x27;a lu sans le comprendre comme toi, &#x27;Omar l&#x27;a lu sans le comprendre comme toi, &#x27;Othmân, &#x27;Alî, les émigrés, les auxiliaires, les pieux anciens et les imams, et aucun d&#x27;eux n&#x27;a compris comme toi. Ta compréhension de ce verset contredit celle des salaf, et toute compréhension qui contredit celle des salaf est une compréhension fausse.", "C&#x27;est pourquoi les gens d&#x27;innovation s&#x27;irritent de ce second principe : ils veulent détacher le Livre et la Sunna de la compréhension des salaf. Le Livre, la Sunna et la compréhension des salaf sont une clôture qui protège le Livre et la Sunna de l&#x27;intrusion des innovateurs qui y puisent des arguments. « Eh, les gars, débarrassez-nous des salaf ! Débarrassez-nous de la compréhension des compagnons ! Laissez les gens du XXe siècle comprendre le Coran selon la compréhension de leur époque ! Ne me fais pas comprendre selon des gens qui sont morts, dont les vers ont mangé la chair et les os, qui n&#x27;avaient ni bibliothèques ni inventions. Nous sommes au siècle du progrès, nous sommes montés sur la lune, nous avons exploré les espaces ! Débarrassez-nous de la compréhension des salaf ! » Nous disons : arrière, pas cela.", "Quiconque argumente par le Coran en le comprenant autrement que les salaf est, en vérité, un négateur du Coran et un mécréant à son égard, même s&#x27;il dit « Dieu a dit », même s&#x27;il dit « le Messager de Dieu a dit ». L&#x27;essentiel est la compréhension : comment tu comprends. Voilà la vérité. Ô mon Seigneur, guide nos cœurs, Seigneur des mondes !", "<b>Deuxième exemple.<\/b> Nous avons discuté un jour avec un homme parmi les soufis, de ceux qui adorent les tombes en dehors de Dieu, qui tournent autour des mausolées, les invoquent et leur demandent secours en dehors de Dieu, le Puissant et Majestueux. Lorsque nous avons discuté avec lui, il a dit : « Comment me blâmez-vous alors que j&#x27;agis conformément au Coran ? » Il n&#x27;y a de force ni de puissance qu&#x27;en Dieu ! Ces actes païens et associationnistes, le Coran les prouverait ? « Oui. » Dans quel verset ? Donne-le-nous. Il dit : la parole de Dieu : « Les alliés (awliyâ&#x27;) de Dieu n&#x27;ont rien à craindre et ne seront pas affligés. »", "Peux-tu dire : « Mon frère, ce verset a une chaîne faible, il n&#x27;est pas du Coran » ? Non, la réponse ne se fait pas ainsi. C&#x27;est bien un verset du Coran ; mais le défaut est chez toi, ô soufi des tombes : il est dans ta compréhension. Car les compagnons sont unanimes que ce verset ne prouve pas ce que tu en as compris, ni de près ni de loin : il ne prouve ni le vœu fait aux tombes, ni la licéité du sacrifice pour les saints, ni la circumambulation autour de leurs tombes, ni leur invocation et la demande de secours auprès d&#x27;eux, en dehors de Dieu, pour dissiper les épreuves et secourir les affligés, absolument. Mais à cause de ta mauvaise compréhension, tu comprends du Coran ce qu&#x27;il ne prouve en rien, et qui est contraire de façon absolue à la compréhension des pieux prédécesseurs. Ta compréhension de ce verset, ô soufi, est contraire à celle des salaf ; et la règle établie dans les fondements est que toute compréhension qui contredit celle des salaf est fausse. Ainsi l&#x27;argument s&#x27;interrompt.", "<b>Troisième exemple, plus grave et plus amer.<\/b> Un autre autorise la demande d&#x27;aide et de pardon auprès du Prophète (que Dieu le bénisse et le salue) à son tombeau. Il dit : il est permis de t&#x27;arrêter près du tombeau du Prophète, de demander pardon et de l&#x27;invoquer en dehors de Dieu, le Puissant et Majestueux. Et la preuve, c&#x27;est le Coran. Il n&#x27;y a de force ni de puissance qu&#x27;en Dieu ! La preuve de ce pur associationnisme manifeste, c&#x27;est le Coran ? « Oui. » Où ? Dans la sourate an-Nisâ&#x27;, la parole de Dieu : « Si, après avoir fait du tort à eux-mêmes, ils venaient à toi, demandaient pardon à Dieu et que le Messager demande pardon pour eux, ils trouveraient Dieu Accueillant au repentir, Miséricordieux. » Et il comprend de cette « venue » qu&#x27;elle est une venue absolue, de son vivant et après sa mort.", "Cette compréhension s&#x27;accorde-t-elle avec celle des compagnons et des pieux anciens ? Non. Quant au verset, nous n&#x27;avons aucune discussion à son sujet : c&#x27;est un verset du Coran. Notre propos porte sur la compréhension que tu en as : tu comprends que Dieu a dit « ils sont venus à toi » et tu en tires une venue absolue, de son vivant et après sa mort. Or les compagnons, les pieux anciens et les imams sont unanimes que la venue mentionnée dans le verset est une venue à lui de son vivant seulement, non après sa mort. Le défaut chez toi est donc dans quoi ? Dans la compréhension fausse.", "Et qui a corrompu le monde, sinon la compréhension fausse ? Le premier de la création à avoir mal compris, qui est-ce ? Iblis le maudit, que Dieu nous préserve de lui. Quand Dieu lui ordonna de se prosterner devant notre père Adam, il regarda son élément et vit que c&#x27;était le feu ; il regarda l&#x27;élément d&#x27;Adam et vit que c&#x27;était l&#x27;argile ; et il dit : le feu est meilleur que l&#x27;argile, donc c&#x27;est l&#x27;inférieur, Adam, qui doit se prosterner devant le supérieur. À cause de quoi ? De la compréhension corrompue. Ce qui a corrompu les croyances des gens, des peuples et des sectes, c&#x27;est la compréhension corrompue.", "Dans ce second principe, voilà ce que veulent les salaf : protéger ta compréhension. Le Coran et la Sunna sont là ; mais où est l&#x27;erreur ? Dans la compréhension. Nous avons donc établi cette règle pour protéger la compréhension de celui qui examine les preuves du Livre et de la Sunna.", "<b>Quatrième exemple<\/b>, parmi les croyances mu&#x27;tazilites mécréantes : que le Coran est créé. Le Coran n&#x27;est pas la parole de Dieu, il est créé. Que Dieu nous en préserve ! Alors que les gens de la Sunna sont unanimes à dire que celui qui affirme que le Coran est créé est mécréant. Mais si tu discutes avec le Mu&#x27;tazilite, il se met à te présenter un argument pour cette croyance mécréante par un verset du Coran. Que Dieu nous préserve : le Coran prouverait qu&#x27;il est créé ? Il répond : « Oui, nous avons un verset dans le Coran qui prouve qu&#x27;il est créé. » Crains Dieu, comment ? Quel verset prouve qu&#x27;il est créé alors que les salaf disent que celui qui affirme sa création est mécréant ? Donne-nous ce verset, voyons. Il dit : « N&#x27;as-tu pas entendu la parole de Dieu : &quot;Aucun rappel nouveau (muhdath) de leur Seigneur ne leur vient sans qu&#x27;ils l&#x27;écoutent en s&#x27;amusant&quot; ? Muhdath, c&#x27;est-à-dire créé. C&#x27;est comme si Dieu avait dit : &quot;Aucun rappel créé de leur Seigneur ne leur vient sans qu&#x27;ils l&#x27;écoutent en s&#x27;amusant.&quot; »", "Comment répondre, je vous le demande ? Ils disent cela sur les chaînes et sur les sites internet ; ce n&#x27;est pas une invention de ma part, ce sont des exemples réels que nous entendons chez eux. Comment répondre ? Tu dis : quant au verset, je n&#x27;ai rien à dire à son sujet ; mon propos porte sur ta compréhension, ô Mu&#x27;tazilite pervers. Tu as compris de ce verset une compréhension dont les pieux anciens ont unanimement établi la fausseté. Car « muhdath » ici, par consensus des compagnons et des pieux anciens, désigne la chose nouvelle, non la chose créée : « aucun rappel nouveau de leur Seigneur ne leur vient », parce que le Coran descendait tout au long de la période de la prophétie, de façon successive, selon les événements ; chaque fois qu&#x27;un Coran nouveau descendait, les mécréants le recevaient par l&#x27;indifférence, le jeu, l&#x27;amusement et l&#x27;incroyance. Les salaf sont donc unanimes que le sens de « muhdath » ici est « nouveau », non « créé ». Toi, ô Mu&#x27;tazilite égaré, tu as compris de ce verset une compréhension qui contredit celle des pieux anciens, et la règle dit : toute compréhension en matière de croyance qui contredit celle des pieux anciens est… Répondez, mes frères !", "— Fausse !", "Fausse ! Fausse ! Je jure par Dieu trois fois qu&#x27;elle est fausse, et je suis prêt à l&#x27;imprécation mutuelle (mubâhala) sur sa fausseté. Il n&#x27;y a aucune pa
